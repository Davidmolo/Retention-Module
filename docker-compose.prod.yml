services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrator

    container_name: nextjs-migrate

    env_file:
      - .env

    command: ["bun", "run", "db:migrate"]

    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

    container_name: nextjs-app
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3000:3000"

    depends_on:
      migrate:
        condition: service_completed_successfully

  cron:
    build:
      context: .
      dockerfile: Dockerfile.migrator

    env_file:
      - .env

    restart: unless-stopped

    depends_on:
      migrate:
        condition: service_completed_successfully

    command: ["/usr/local/bin/supercronic", "/app/crontab"]

    environment:
      TZ: America/New_York

    volumes:
      - cron-logs:/app/logs
      - sftp-incoming:/app/data/sftp-incoming

volumes:
  mysql_data:
  cron-logs:
  sftp-incoming:
