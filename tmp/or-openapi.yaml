            schema:
              type: object
              required: [trailer]
              properties:
                trailer:
                  type: object
                  properties:
                    oos:               { type: boolean, description: "Out-of-service flag" }
                    needs_repair:      { type: boolean, description: "Needs-repair flag" }
                    oos_note:          { type: string, description: "Grantable — requires field grant to write" }
                    needs_repair_note: { type: string, description: "Grantable — requires field grant to write" }
              example:
                trailer:
                  oos: true
                  oos_note: "Reefer unit failure"
      responses:
