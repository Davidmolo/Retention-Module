          schema: { type: string, format: date-time }
        - name: created_at
          in: query
          description: Filter by created_at. Accepts range.
          schema: { type: string, format: date-time }
        - name: updated_at
          in: query
          description: Filter by updated_at. Accepts range.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Successful response
          content:
