  /customers/{customer_id}/notes:
    get:
      tags: [Customer Notes]
      summary: List notes on a customer
      description: |
        Paginated list of the notes of a customer, newest first by default. Returns the notes of the Notes box (`type` = `Customer`) and of the Customer Service Notes box (`type` = `Customer_Customer_Service_Notes`, shown as "Customer Service Note" in the app). A note whose text looks like a login or a password (for example a text with "password", "login", "pwd" or "user name:") is never returned, so portal credentials stay out of the API. Scoped to the authenticated application's account.
      operationId: listCustomerNotes
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          description: Sort by creation time. Default is `-created_at` (newest first).
          schema:
            type: string
            enum: [created_at, '-created_at']
        - name: type
          in: query
          description: Filter by note type. `Customer` is the Notes box. `Customer_Customer_Service_Notes` is the Customer Service Notes box. Multi-value supported, for example `?type[]=Customer&type[]=Customer_Customer_Service_Notes`.
          schema: { type: string, enum: [Customer, Customer_Customer_Service_Notes] }
        - name: created_at
          in: query
          description: Filter by creation time. Accepts a date range with `?created_at[gte]=2026-01-01&created_at[lt]=2026-02-01`. Operators are `gt`, `gte`, `lt` and `lte`, with an ISO 8601 date or timestamp.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CustomerNote' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Customer Notes]
      summary: Create a note on a customer
      description: |
        Writes a note to the Notes box of the customer (`type` = `Customer`), never to the Customer Service Notes box. The note shows on the customer page like a note of a user. The note's `author` is your application name, followed by ` - API`. Returns 404 for a customer of another account.
      operationId: createCustomerNote
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
