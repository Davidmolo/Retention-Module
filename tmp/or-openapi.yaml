    get:
      tags: [Customers]
      summary: Retrieve a customer
      operationId: getCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Customer' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Customers]
      summary: Update a customer
      description: |
        Update the credit fields of a customer. See the request body schema below for the current writable field set; any other body keys are silently dropped.

        Every field in the body except `fsc_applies` is grantable — each one requires its matching field grant to write. Without the grant, that key is silently dropped from the request (consistent with read-side behavior). `fsc_applies` is a default field: the `customers#update` endpoint grant alone writes it.

        `available_balance` is derived from `available_balance_limit` minus `open_balance`, so a credit raises it above the limit. It is never writable, and a request that sends it has that key dropped.

        `hard_block_credit_limit` reads and writes different values. A READ returns the effective hard block limit that OpenRoad enforces for the customer, which comes from the per-customer override when one is set and from the account rule otherwise. A WRITE sets the per-customer override. A write of `null` clears the override, and the read then returns the account rule again.

        For an account with no Sage, QuickBooks or Apex integration, OpenRoad recalculates `open_balance` from the loads of the account, so the next load save overwrites a value written through this endpoint. The other three fields always persist.
      operationId: updateCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer]
              properties:
                customer:
                  type: object
                  properties:
                    available_balance_limit: { type: number, description: "Grantable — requires field grant to write. The Credit Limit of the customer." }
                    hard_block_credit_limit: { type: [ number, 'null' ], description: "Grantable — requires field grant to write. Sets the per-customer hard block override. Send null to clear the override." }
                    open_balance:            { type: number, description: "Grantable — requires field grant to write. What the customer currently owes. A negative value is a credit and raises the Available Balance above the limit." }
                    credit_hold:             { type: boolean, description: "Grantable — requires field grant to write. True puts the credit of the customer on hold." }
                    billing_hold:            { enum: [ true, false, "true", "false", 1, 0, "1", "0" ], description: "Grantable — requires field grant to write. True holds every unexported load of the customer out of the billing exports and holds each new load; false releases the held loads. A load already exported or billed keeps its state. Only true, false, \"true\", \"false\", 1, 0, \"1\" and \"0\" are accepted; any other value, null included, returns 422 with field billing_hold." }
                    fsc_applies:             { type: boolean, description: "Default field: the customers#update endpoint grant alone writes it. null answers 422." }
              example:
                customer:
                  available_balance_limit: 50000.0
                  hard_block_credit_limit: 55000.0
                  open_balance: 12345.67
                  credit_hold: false
                  fsc_applies: false
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Customer' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

