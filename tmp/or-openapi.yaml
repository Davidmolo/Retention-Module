  /driver_pay_statements:
    get:
      tags: [Driver Pay Statements]
      summary: List driver pay statements
      description: |
        Returns a paginated list of driver pay statements, one per driver and pay period. A statement exists once the driver has any line item for the period. Every amount is signed as stored: a deduction is negative. Money and miles are decimal strings.

        **Locked and unlocked.** A statement is `locked` once accounting has frozen it; its amounts then never change. An unlocked statement is the latest calculation of the current week and the two weeks before it, refreshed hourly, so its amounts can still change. An older period that was never locked is not returned.

        **Pay type.** `per_mile`, `percentage` or `flat`, read from the pay items of the period. It is null when the period has no pay item. `total_paid_miles` is the paid loaded and empty miles of the statement for `per_mile`. For `percentage` and `flat` it is the `total_miles` of the driver statistics row of the same driver and week (`start_date` equal to `period_start`), and null when no such row exists.

        **Amounts.** `linehaul` is the load pay (per-mile, percentage of linehaul and flat pay). `earnings` adds accessorials, detention, adjustments and the seniority bonus. `gross` is `earnings` plus `fuel_surcharge`. `fees` are the taxes and deductions, `fuel_card_fees` the fuel card fees, and `settlement` the net total of every line item.

        Every amount, `line_items` and the file link are grantable fields.
      operationId: listDriverPayStatements
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          description: Default `-period_start,driver_id`.
          schema:
            type: string
            enum: [period_start, period_end, settlement_date, '-period_start', '-period_end', '-settlement_date']
        - name: id
          in: query
          description: Filter by statement id. Multi-value supported.
          schema: { type: string, pattern: '^\d+_\d{4}-\d{2}-\d{2}$' }
        - name: driver_id
          in: query
          description: Filter by driver. Multi-value supported.
          schema: { type: integer }
        - name: driver_type
          in: query
          description: Filter by driver type. Multi-value supported.
          schema: { type: string, enum: [company_driver, contract_driver, owner_operator, leased_owner] }
        - name: driver_status
          in: query
          description: Filter by driver status. Multi-value supported.
          schema: { type: string, enum: [pre_hired, active, suspended_new, suspended, lead] }
        - name: pay_type
          in: query
          description: Filter by pay type. Multi-value supported.
          schema: { type: string, enum: [per_mile, percentage, flat] }
        - name: locked
          in: query
          schema: { type: boolean }
        - name: period_start
          in: query
          description: >-
            Filter by the first day of the period. Accepts range — `?period_start[gte]=2026-01-01`.
          schema: { type: string, format: date }
        - name: period_end
          in: query
          description: Filter by the last day of the period. Accepts range.
          schema: { type: string, format: date }
        - name: settlement_date
          in: query
          description: Filter by the settlement date. Multi-value and range supported.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriverPayStatement' }
                  error:
                    type: 'null'
                    example: null
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

