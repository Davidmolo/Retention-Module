  /drivers/{driver_id}/safety_notes:
    get:
      tags: [Driver Safety Notes]
      summary: List safety notes on a driver
      description: |
        Returns a paginated list of safety notes on the driver profile, newest first. Scoped to the authenticated application's account.

        Safety Notes and Driver Notes are separate records in separate tables. `/drivers/{driver_id}/notes` returns the free-form notes of the driver profile, and it does not return a Safety Note created since February 2026. The safety notes that the profile held before that date were copied into the Safety Notes table, and their original rows stay on `/drivers/{driver_id}/notes`. A client that reads both endpoints sees those older notes twice.
      operationId: listDriverSafetyNotes
      parameters:
        - name: driver_id
          in: path
          required: true
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriverSafetyNote' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Driver Safety Notes]
      summary: Create a safety note on a driver
      description: |
        Attaches a safety note to the specified driver. `note_date` is required. The note needs `comment` or `safety_setting_id` — a request with both blank returns 422. `safety_setting_id` is the identifier of the safety category; the category carries its own points value, and no endpoint lists the categories today.

        The note is stored without an author user — partner-created notes appear in the internal driver profile marked as SYSTEM authorship.
      operationId: createDriverSafetyNote
      parameters:
        - name: driver_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [safety_note]
              properties:
                safety_note:
                  type: object
                  required: [note_date]
                  properties:
                    safety_setting_id: { type: [ integer, 'null' ] }
                    comment:           { type: [ string, 'null' ], example: "Hard braking event" }
                    note_date:         { type: string, format: date-time }
                    points:            { type: integer, description: "Grantable — requires field grant to write" }
              example:
                safety_note:
                  comment: "Hard braking event"
                  note_date: "2026-09-14T10:30:00Z"
      responses:
        '201':
          description: Safety note created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DriverSafetyNote' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta: { $ref: '#/components/schemas/Meta' }
