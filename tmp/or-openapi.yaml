        answers `429 rate_limited` with `Retry-After: 60`.
        The body is the standard error envelope: `data` is null, `error.code` is `rate_limited`, `error.message` names the
        limit reached (`File fetch limit reached: 2 per document per minute` or `File fetch limit reached: 30 per application per minute`),
        and `error.details` is an empty list. Read the `Retry-After` header, then fetch again. Fetch each file once and keep it.
        Reading the link itself (`GET /loads/{load_id}/full_pdf`) is not limited.
      security: []
      responses:
        '200':
          description: The Full PDF.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `no-store`.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/LinkExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Load id. Must be the id the token was minted for.
        - name: token
          in: query
          required: true
          schema: { type: string }
  /hos_logs:
    get:
      tags: [HOS Logs]
      summary: List HOS logs
      description: |
        Returns a paginated list of hours-of-service clock samples, one per driver every 3 minutes. Each sample carries the driver's active load at that moment. Read the driver name on /drivers and the vehicle on /trucks. Duration fields are milliseconds.

        The endpoint serves at most 31 days of `created_at` per request. With no `created_at` bound, it returns the last 31 days. With one bound, it returns the 31 days from that bound. A `gte`/`lte` pair that spans more than 31 days answers 400.

        Every request must name `driver_id` or `load_id`. A request with neither answers 400 `invalid_filter`. That scope is required because the row count that fills the pagination meta reads the timestamp index of every tenant before it narrows to yours: scoped to one driver or one load it costs milliseconds, and without a scope it would cost seconds.
      operationId: listHosLogs
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, id, '-created_at', '-id']
        - name: driver_id
          in: query
          description: Filter by driver. Multi-value supported. Required unless `load_id` is given.
          schema: { type: integer }
        - name: load_id
          in: query
          description: Filter by load. Multi-value supported. Required unless `driver_id` is given.
          schema: { type: integer }
        - name: current_duty_status_code
          in: query
          description: Filter by the ELD duty status at the sample. Multi-value supported.
          schema: { type: string, enum: [SLEEPER_BED, OFF_DUTY, DRIVING, DISCONNECTED, ON_DUTY, PERSONAL_CONVEYANCE, YARD_MOVE] }
        - name: created_at
          in: query
          description: >-
            Filter by created_at. Accepts range — `?created_at[gte]=2026-09-16T00:00:00Z`.
            The effective window is at most 31 days: with no bound it defaults to the last 31 days,
            with one bound it extends 31 days from that bound, and a `gte`/`lte` pair over 31 days apart answers 400.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/HosLog' }
                  error:
                    type: 'null'
                    example: null
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /hos_logs/{id}:
