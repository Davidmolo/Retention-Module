        trailer_size:           { type: [ integer, 'null' ] }
        total_volume:           { type: [ integer, 'null' ], description: "Total loads of the bid." }
        customer_miles:         { type: [ string, 'null' ], description: "Miles the customer stated. Decimal-precision string." }
        gp_miles:               { type: [ string, 'null' ], description: "OpenRoad routed miles. Decimal-precision string." }
        loading_type:           { type: [ string, 'null' ], enum: [live, drop, live_or_drop, round_trip, null] }
        unloading_type:         { type: [ string, 'null' ], enum: [live, drop, live_or_drop, round_trip, null] }
        stop_offs:              { type: [ integer, 'null' ], description: "Extra stops. Total stops = stop_offs + 2." }
        commodity:              { type: [ string, 'null' ] }
        fuel_compensation_type: { type: string, enum: [per_mile, percent, breakthrough] }
        alcohol_shipment:       { type: [ boolean, 'null' ] }
        pre_award_status:       { type: [ string, 'null' ], enum: [primary, backup, 'no', null] }
        award:                  { type: [ boolean, 'null' ], description: "Null is possible and `award=false` does not match it." }
        awarded_lane_type:      { type: [ string, 'null' ], enum: [primary, backup, null] }
        award_volume:           { type: [ string, 'null' ], description: "Committed loads of the award. Decimal-precision string." }
        created_by:             { type: [ string, 'null' ], description: "The API application that created the bid, as `<application name> - API`; null for a bid created by the template upload." }
        created_at:             { type: string, format: date-time }
        updated_at:             { type: string, format: date-time }
        r1_bid: { type: [ boolean, 'null' ], description: "Grantable — requires field grant. Whether round 1 holds a bid." }
