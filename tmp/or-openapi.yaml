          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          description: Sort field. Prefix with `-` for descending.
          schema:
            type: string
            enum: [created_at, updated_at, start_date, end_date, '-created_at', '-updated_at', '-start_date', '-end_date']
        - name: driver_id
          in: query
          description: Filter by driver ID. Multi-value supported.
          schema: { type: integer }
        - name: assignment_id
          in: query
          description: Filter by assignment foreign key (truck or trailer ID). Multi-value supported.
          schema: { type: integer }
        - name: assignment_type
          in: query
