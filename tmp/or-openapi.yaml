                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Load Flags]
      summary: Preload a trailer on a load
      description: |
        Sets the preloaded trailer, the Billing Hold, or both. Send `preloaded_trailer_id`, or `billing_hold` (needs the `billing_hold` field grant), or both; a body with neither returns 400. The trailer is preloaded first, and a trailer that cannot be preloaded returns 422 and writes no hold. A hold write works on a load at any status, locked statuses included, and logs the change as SYSTEM. It answers 201 when something changed and 200 when nothing did; releasing a load that has no flag row answers 200 with `billing_hold` false and writes no row. `billing_hold` accepts only `true`, `false`, `"true"`, `"false"`, `1`, `0`, `"1"` and `"0"`; any other value, `null` included, returns 422 with field `billing_hold` and code `invalid_value`, and writes nothing.

        The preload runs the same steps as the Customer Service Preload Trailer action: it sets the flag `preloaded` with the trailer, writes the load note "Preloaded #<unit>", puts the trailer on every stop and writes the trailer locations when the account uses Trailer Organizer, syncs the flatbed flag of the load, and sends an email to the driver manager of the first stop.

        A load preloaded with another trailer switches to this one. Sending the trailer that is already preloaded returns 200 and changes nothing. The note has no author user. This endpoint does not remove a preload, and it takes no pickup time.
      operationId: createLoadFlag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [load_flag]
              properties:
                load_flag:
                  type: object
                  required: [load_id]
                  properties:
                    billing_hold:
                      enum: [ true, false, "true", "false", 1, 0, "1", "0" ]
                      description: "Grantable. True holds the load out of every billing export, false releases it. Only true, false, \"true\", \"false\", 1, 0, \"1\" and \"0\" are accepted; any other value, null included, returns 422 with field billing_hold."
                      example: true
                    load_id:
                      type: integer
                      description: Load ID of the account.
                      example: 123
                    preloaded_trailer_id:
                      type: integer
                      description: Trailer ID. Must be an active trailer of the account or the current trailer of the first pickup of the load. An out-of-service trailer is accepted.
                      example: 456
      responses:
        '201':
          description: Trailer preloaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LoadFlag' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta: { $ref: '#/components/schemas/Meta' }
        '200':
          description: Already preloaded with this trailer; nothing changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LoadFlag' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

