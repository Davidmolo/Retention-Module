        name_of_location: { type: [ string, 'null' ], description: "Name of the place, for example a yard or a customer." }
        location:         { type: [ string, 'null' ], description: "Address or city of the place." }
        load_id:          { type: [ integer, 'null' ], description: "Load the trailer waits for or carries, or null." }
        gp_load:          { type: [ string, 'null' ], description: "Load number of that load, or null." }
        status:           { type: string, enum: [empty, fully_loaded], description: "`empty` = Empty, `fully_loaded` = Loaded." }
        stop_type:        { type: [ string, 'null' ], enum: [pick_up, delivery, trailer_pu, trailer_del, null], description: "Stop type of the linked load stop: `pick_up` = Pickup, `delivery` = Delivery, `trailer_pu` = Trailer Pickup, `trailer_del` = Trailer Drop; null when no stop is linked." }
        trailer_yard:     { type: boolean, description: "True when the live place of the row (the `place_id` place) is a trailer yard." }
        place_id:         { type: [ integer, 'null' ], description: "Optional — requires field grant. The `id` of the live place of the row on `/places`: the stored place, or its merge target when the stored place is merged. Not the stored link. Null when the row has no place, the place is deleted without a merge target, or the merge target is merged itself." }
        start_date:       { type: string, format: date-time }
        end_date:         { type: [ string, 'null' ], format: date-time }
        created_by_id:    { type: [ integer, 'null' ], description: "The user who created the row. Resolve via /users. Null for a row a system process wrote." }
        updated_by:       { type: [ string, 'null' ], description: "The stored editor text of the row: a user name, a user id written as text, `<application name> - API` for a row an External API write saved, or null." }
        created_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time }

    TrailerYard:
      type: object
      description: |
        One trailer yard. The counts follow the Trailer Organizer page for the yard: a trailer counts once, and a trailer with a later row elsewhere inside the window does not count.
      properties:
        id:                  { type: integer, example: 31 }
        place_id:            { type: integer, description: "The `id` of the yard place on `/places`." }
        customer_id:         { type: [ integer, 'null' ], description: "The customer of the yard on `/customers`." }
        trailer_pool:        { type: [ integer, 'null' ], description: "The pool size set on the yard. Null when the pool is 0 (no pool)." }
        trailers_now:        { type: integer, description: "All trailers at the yard now, empty and loaded." }
        empty_trailers_now:  { type: integer }
        loaded_trailers_now: { type: integer }
        pool_balance:        { type: [ integer, 'null' ], description: "`trailers_now` minus `trailer_pool`. Negative means fewer trailers than the pool. Null when no pool is set." }
        created_at:          { type: string, format: date-time }
        updated_at:          { type: string, format: date-time }

    Place:
      type: object
      description: |
        A place of the account. A place stores no contact and no type column: its kind is the `tags` list and `trailer_yard`.
      properties:
        id:                             { type: integer, example: 2231 }
        name:                           { type: string, example: "North Yard" }
        description:                    { type: [ string, 'null' ] }
        street:                         { type: string }
        street2:                        { type: [ string, 'null' ] }
        city:                           { type: string, example: "Chicago" }
        state:                          { type: string, example: "IL" }
        zip:                            { type: string }
        country:                        { type: string, example: "US" }
        full:                           { type: string, description: "The full address line." }
        lat:                            { type: [ number, 'null' ] }
        lng:                            { type: [ number, 'null' ] }
        time_zone_name:                 { type: [ string, 'null' ], example: "America/Chicago" }
        tags:                           { type: array, items: { type: string, enum: [terminal, drop_yard, scale_location, rest_location, trailer_yard, home_time_parking] }, description: "Stored tags. A tag and the `trailer_yard` record can disagree on a few places." }
        trailer_yard:                   { type: boolean, description: "True when the place has a trailer yard record." }
        banned:                         { type: [ boolean, 'null' ] }
        overnight_parking:              { type: string, enum: [unknown, allowed, not_allowed] }
        special_handling_transfer_mode: { type: [ string, 'null' ], enum: [none, load_handling, load_notes, both, null] }
        merged_to_id:                   { type: [ integer, 'null' ], description: "The place that stays when this place is merged, else null." }
        created_at:                     { type: string, format: date-time }
        updated_at:                     { type: string, format: date-time }
        tracking_area:                  { type: [ object, 'null' ], description: "Optional — requires field grant. GeoJSON Polygon of the arrival area, or null." }

    PlaceInformation:
      type: object
      description: |
        The information of one customer at one place. Times are `HH:MM` text; `*_isopen` and the flags are booleans, or null when never set.
      properties:
        id:                { type: integer }
        place_id:          { type: integer, description: "Foreign key to Place" }
        customer_id:       { type: [ integer, 'null' ], description: "Foreign key to Customer" }
        monday_start:      { type: [ string, 'null' ] }
        monday_end:        { type: [ string, 'null' ] }
        monday_isopen:     { type: [ boolean, 'null' ] }
        tuesday_start:     { type: [ string, 'null' ] }
        tuesday_end:       { type: [ string, 'null' ] }
        tuesday_isopen:    { type: [ boolean, 'null' ] }
        wednesday_start:   { type: [ string, 'null' ] }
        wednesday_end:     { type: [ string, 'null' ] }
        wednesday_isopen:  { type: [ boolean, 'null' ] }
        thursday_start:    { type: [ string, 'null' ] }
        thursday_end:      { type: [ string, 'null' ] }
        thursday_isopen:   { type: [ boolean, 'null' ] }
        friday_start:      { type: [ string, 'null' ] }
        friday_end:        { type: [ string, 'null' ] }
        friday_isopen:     { type: [ boolean, 'null' ] }
        saturday_start:    { type: [ string, 'null' ] }
        saturday_end:      { type: [ string, 'null' ] }
        saturday_isopen:   { type: [ boolean, 'null' ] }
        sunday_start:      { type: [ string, 'null' ] }
        sunday_end:        { type: [ string, 'null' ] }
        sunday_isopen:     { type: [ boolean, 'null' ] }
        hot:               { type: [ boolean, 'null' ] }
        pu_drop_and_hook:  { type: [ boolean, 'null' ] }
        del_drop_and_hook: { type: [ boolean, 'null' ] }
        default_time:      { type: [ boolean, 'null' ] }
        main_customer:     { type: [ boolean, 'null' ] }
        late_tolerance:    { type: [ string, 'null' ] }
        advanced_arrival:  { type: [ string, 'null' ] }
        created_at:        { type: string, format: date-time }
        updated_at:        { type: string, format: date-time }
        special_instructions: { type: [ string, 'null' ], description: "Optional — requires field grant." }
        high_value:        { type: [ boolean, 'null' ], description: "Optional — requires field grant." }
        bol_skip:          { type: [ boolean, 'null' ], description: "Optional — requires field grant." }

    Assignment:
      type: object
      description: |
        A driver-to-truck or driver-to-trailer assignment. `assignment_type` is either `Truck` or `Trailer`, and `assignment_id` points to the corresponding resource.

        Read the driver on `/drivers` through `driver_id`, and the equipment on `/trucks` or `/trailers` through `assignment_id`.
      properties:
        id:              { type: integer, example: 9912 }
        driver_id:       { type: integer, example: 8421 }
        assignment_id:   { type: integer, example: 312, description: "Foreign key to Truck or Trailer" }
        assignment_type: { type: string, enum: [Truck, Trailer] }
        start_date:      { type: string, format: date-time }
        end_date:        { type: [ string, 'null' ], format: date-time }
        created_by_id:   { type: [ integer, 'null' ], description: "The user who created the row. Resolve via /users. Null for a row a system process or the driver wrote." }
        updated_by_id:   { type: [ integer, 'null' ], description: "The user who last saved the row. Resolve via /users. Null when none is stored." }
        created_at:      { type: string, format: date-time }
        updated_at:      { type: string, format: date-time }

    AvailabilityEvent:
      type: object
      description: |
        A single availability window for a driver. Status indicates the kind of window: `loaded` (on a load), `off_duty` (resting/HOS), `planned` (scheduled time off), `pending_hometime`.
      properties:
        id:               { type: integer, example: 17234 }
        driver_id:        { type: integer, example: 8421 }
        status:           { type: string, enum: [loaded, off_duty, planned, pending_hometime] }
        start_date:       { type: string, format: date-time }
        end_date:         { type: string, format: date-time }
        created_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time }
        off_duty_reason:  { type: [ string, 'null' ], enum: ['10 Hour Reset', '34 Hour Reset', 'Home Time', 'Unapproved Off', 'Vacation', 'Medical', 'Bereavement', 'Breakdown', 'Weather', 'Paid Layover', 'Not Paid Layover', 'Off', 'Other', 'Unscheduled Off', 'Planned', 'Layover', 'Layover (Paid)', '', null], description: "Grantable — requires field grant. The 11 Planner values can be written. `Off`, `Other`, `Unscheduled Off`, `Planned`, `Layover` and `Layover (Paid)` are read-only legacy values that older events carry; an event that is not off duty reads an empty string. `Vacation` is the stored value of the Planner label PTO/Vacation." }
        off_duty_comment: { type: [ string, 'null' ], description: "Grantable — requires field grant." }
        pto_type:         { type: [ string, 'null' ], enum: [pto, pto_cash_out, null], description: "Grantable — requires field grant. Set on Vacation events; null on others and on events with no stored value." }
        layover_reason:   { type: [ string, 'null' ], enum: ['Closed facility', 'Dispatch related', 'Capacity related', 'Dwell time related', 'Contracted customer related', 'Long loading/unloading time', 'Trailer pool related', 'No load', 'Traffic related', 'TONU/Load Cancellation  related', 'Other', null], description: "Grantable — requires field grant. Stored exactly as listed, double space included." }
        reset_location:   { type: [ string, 'null' ], description: "Grantable — requires field grant. Address text, `City, ST`." }
        reset_location_state: { type: [ string, 'null' ], description: "Grantable — requires field grant. Stored state of the reset location; null when `reset_location` is blank." }
        reset_location_zip_code: { type: [ string, 'null' ], description: "Grantable — requires field grant." }
        reset_location_place_name: { type: [ string, 'null' ], description: "Grantable — requires field grant. Name of the saved Place, when the reset location is one." }
        reset_location_place_id: { type: [ integer, 'null' ], description: "Grantable — requires field grant." }
        reset_location_lat: { type: [ number, 'null' ], description: "Grantable — requires field grant." }
        reset_location_lng: { type: [ number, 'null' ], description: "Grantable — requires field grant." }
        pending_event_status: { type: [ string, 'null' ], enum: [pending, approved, rejected, null], description: "Grantable — requires field grant. The approval status of a pending Home Time event; null for an event with no pending step, as an API-created event." }
        approved_by_id:   { type: [ integer, 'null' ], description: "Grantable — requires field grant. User who approved the event; null on an API-created Vacation event." }
        created_by_id:    { type: [ integer, 'null' ], description: "Grantable — requires field grant. User who created the event; null when an application or a job created it. Read from the create audit, which an event keeps only while it has at most 20 audits." }
        created_by:       { type: [ string, 'null' ], description: "Grantable — requires field grant. Name of the user, or `<application name> - API`; null for a job or when the create audit is gone." }

    User:
      type: object
      description: |
        A user in the account, referenced by other resources via FKs (`manager_id` and `substitute_manager_id` on drivers; `account_manager_id`, `customer_service_representative_id`, `billing_specialist_ids`, and `detention_specialist_ids` on customers; `user_id` (creator/sales rep), `account_manager_id`, `csr_manager_id`, `planner_manager_id` on loads). MobileUser (driver mobile-app login) accounts are excluded; back-office staff appear here only when they have a User record — use `/employees` to resolve `capacity_manager_id` and similar. Sensitive contact fields require explicit grants.
      properties:
        id:          { type: integer, example: 1024 }
        first_name:  { type: [ string, 'null' ], description: "First name" }
        last_name:   { type: [ string, 'null' ], description: "Last name" }
        type:        { type: string, example: Dispatcher, description: "One of: Superadmin, Admin, Dispatcher, Accounting, Safety, Steersman, Client, Mechanic, HR, Maintenance, Capacity." }
        status:      { type: string, example: active, description: "active or suspended" }
        email:       { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        phone:       { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        office:      { type: [ string, 'null' ], description: "Grantable — requires field grant. Office location label." }
        team:        { type: [ string, 'null' ], description: "Grantable — requires field grant. Internal team assignment." }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    Customer:
      type: object
      description: |
        A customer (shipper, broker, or 3PL) booked on loads. Sensitive contact, manager, and financial fields require explicit grants. Internal operational flags (`critical_customer`, `not_scheduled_loads`, `protect_from_freeze`, default-load-type config, EFS usernames, fuel-account routing) are never exposed via this API regardless of grants. External system IDs (`macropoint_id`, `apex_broker_id`, `tmw_id`) ARE available with field grants for partners that need to map records back to their own systems.

        **Freshness note for credit fields.** `open_balance`, `available_balance`, and `available_balance_limit` reflect the state of accounting at the moment the request was processed. Reads can lag writes by a few seconds (read-replica propagation). For workflows where stale credit data has real cost — e.g. a credit check before booking a load — re-fetch immediately before the check rather than relying on cached values.
      properties:
        id:                                 { type: integer, example: 4421 }
        name:                               { type: string }
        dba:                                { type: [ string, 'null' ], description: "Doing-business-as name" }
        mc:                                 { type: [ string, 'null' ], description: "Motor carrier number (FMCSA-issued, public)" }
        status:                             { type: string, enum: [active, inactive, do_not_use, potential] }
        customer_type:                      { type: string, enum: ['3pl', broker, direct] }
        tier:                               { type: string, enum: [tier_1, tier_2, tier_3] }
        macropoint_integration:             { type: boolean, description: "Whether Macropoint visibility integration is enabled" }
        ryder_integration:                  { type: [ boolean, 'null' ], description: "Whether the Ryder integration is enabled" }
        four_kites_integration:             { type: boolean, description: "Whether Four Kites visibility integration is enabled" }
        fourkites_epod:                     { type: boolean, description: "Whether Four Kites ePOD is enabled" }
        load_status_notification_email:     { type: boolean, description: "Whether the customer wants load-status notification emails" }
        fsc_applies:                         { type: boolean, description: "FSC Applies indicator, set by hand. Informational only: OpenRoad calculates, adds or changes no fuel surcharge from it." }
        created_at:                         { type: string, format: date-time }
        updated_at:                         { type: string, format: date-time }
        phone:                              { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        email:                              { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        fax:                                { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        contact:                            { type: [ string, 'null' ], description: "Grantable — requires field grant. Primary contact name." }
        extra_contact:                      { type: [ string, 'null' ], description: "Grantable — requires field grant. Additional contact name." }
        extra_phone:                        { type: [ string, 'null' ], description: "Grantable — requires field grant. Additional phone number." }
        street:                             { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        street_second:                      { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        city:                               { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        state_code:                         { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        zip_code:                           { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        ap_contact:                         { type: [ string, 'null' ], description: "Grantable — requires field grant. Accounts-payable contact name." }
        ap_phone:                           { type: [ string, 'null' ], description: "Grantable — requires field grant. Accounts-payable phone." }
        ap_fax:                             { type: [ string, 'null' ], description: "Grantable — requires field grant. Accounts-payable fax." }
        ap_email:                           { type: [ array, 'null' ], items: { type: string }, description: "Grantable — requires field grant. Array of AP email addresses." }
        bol_notification_emails:            { type: array, items: { type: string }, description: "Grantable — requires field grant. Recipients for BOL/POD delivery notifications." }
        load_status_notification_email_value: { type: array, items: { type: string }, description: "Grantable — requires field grant. Recipients for load-status notifications." }
        contracted_loads_info_email:        { type: [ string, 'null' ], description: "Grantable — requires field grant. Contracted-loads info email." }
        account_group_email:                { type: [ string, 'null' ], description: "Grantable — requires field grant. Internal account group customer service inbox." }
        account_manager_id:                 { type: [ integer, 'null' ], description: "Grantable — requires field grant. FK to /users." }
        customer_service_representative_id: { type: [ integer, 'null' ], description: "Grantable — requires field grant. FK to /users." }
        capacity_manager_id:                { type: [ integer, 'null' ], description: "Grantable — requires field grant. FK to /employees (not /users — capacity managers are back-office staff)." }
        billing_specialist_ids:             { type: array, items: { type: integer }, description: "Grantable — requires field grant. Array of billing-specialist User IDs (resolve via /users)." }
        detention_specialist_ids:           { type: array, items: { type: integer }, description: "Grantable — requires field grant. Array of detention-specialist User IDs (resolve via /users)." }
        billing_preference:                 { type: [ string, 'null' ], description: "Grantable — requires field grant. One of original, fax, email, epay, website, manual, edi, transflo, rydershare, cass, new_profile, syncada, transplace." }
        payment_terms:                      { type: [ string, 'null' ], description: "Grantable — requires field grant. e.g. net_30, net_60, due_on_receipt." }
        ar_type:                            { type: [ string, 'null' ], description: "Grantable — requires field grant. AR routing: account_receivable, evergreen_bank, collections, old_second." }
        billing_setting_id:                 { type: [ integer, 'null' ], description: "Grantable — requires field grant. FK to /billing_settings (billing profile template)." }
        sage_id:                            { type: [ integer, 'null' ], description: "Grantable — requires field grant. Sage accounting system ID." }
        custom_billing:                     { type: [ boolean, 'null' ], description: "Grantable — requires field grant. Custom billing flag." }
        open_balance:                       { type: [ string, 'null' ], description: "Grantable — requires field grant. What the customer currently owes (sensitive financial state). A negative value is a credit. Decimal-precision string, e.g. '12345.67'." }
        available_balance:                  { type: [ string, 'null' ], description: "Grantable — requires field grant. Live remaining credit (computed: limit minus open balance). Decimal-precision string." }
        available_balance_limit:            { type: [ string, 'null' ], description: "Grantable — requires field grant. Credit limit ceiling. Decimal-precision string." }
        hard_block_credit_limit:            { type: [ string, 'null' ], description: "Grantable — requires field grant. On a read, the effective hard block limit that OpenRoad enforces for this customer. A write of this field sets the per-customer override instead. Decimal-precision string." }
        credit_hold:                        { type: [ boolean, 'null' ], description: "Grantable — requires field grant. True when credit is currently on hold." }
        billing_hold:                       { type: boolean, description: "Grantable — requires field grant. True when the loads of the customer are held out of the billing exports." }
        contract_start_date:                { type: [ string, 'null' ], format: date-time, description: "Grantable — requires field grant" }
        contract_end_date:                  { type: [ string, 'null' ], format: date-time, description: "Grantable — requires field grant" }
        procedures:                         { type: [ string, 'null' ], description: "Grantable — requires field grant. Free-text customer service notes/procedures." }
        macropoint_id:                      { type: [ string, 'null' ], description: "Grantable — requires field grant. External Macropoint system ID." }
        apex_broker_id:                     { type: [ string, 'null' ], description: "Grantable — requires field grant. Apex broker identifier." }
        tmw_id:                             { type: [ string, 'null' ], description: "Grantable — requires field grant. TMW external system ID." }
        trailer_dwell_grace_period_days:    { type: [ integer, 'null' ], description: "Grantable — requires field grant. Days a trailer can stay in a yard of this customer free of charge. Stored only: OpenRoad calculates no charge from it." }
        trailer_dwell_rate_per_day:         { type: [ string, 'null' ], description: "Grantable — requires field grant. Detention rate per day after the grace period. Decimal-precision string, e.g. '75.00'. Stored only: OpenRoad calculates no charge from it." }
        fuel_customer:                       { type: [ boolean, 'null' ], description: "Grantable — requires field grant. True when the customer buys fuel from the account (a fuel customer)." }
        user_portal:                         { type: [ boolean, 'null' ], description: "Grantable — requires field grant. True when the customer has portal access." }
        bol_requirement:                     { type: [ string, 'null' ], description: "Grantable — requires field grant. Time limit for the BOL after delivery. The customer form offers disabled, 24h, 48h and 72h." }
        pod_subject:                         { type: [ string, 'null' ], description: "Grantable — requires field grant. Subject of the POD email of the customer." }
        detention_request_email:             { type: [ array, 'null' ], items: { type: string }, description: "Grantable — requires field grant. Recipients of the detention payment request email." }
        payment_status_request_email:        { type: [ array, 'null' ], items: { type: string }, description: "Grantable — requires field grant. Recipients of the payment status request email." }
        payment_status_request_response_email: { type: [ array, 'null' ], items: { type: string }, description: "Grantable — requires field grant. Reply-To addresses of the payment status request email." }
        alcohol_shipment:                    { type: boolean, description: "Grantable — requires field grant. True when the customer loads carry alcohol by default." }
        fourkites_reference_strategy:        { type: string, enum: [full_value, first_part, last_part], description: "Grantable — requires field grant. Which part of the customer load number goes to FourKites as the reference." }

    Employee:
      type: object
      description: |
        A back-office staff member referenced by FKs (e.g. `capacity_manager_id` on Customer). The schema below is the security boundary — fields not listed here (SSN, DOB, banking, emergency contacts, compensation, etc.) are NEVER exposed via this API regardless of grants.
      properties:
        id:               { type: integer, example: 87 }
        first_name:       { type: string }
        last_name:        { type: [ string, 'null' ] }
        position:         { type: string, description: "Job position (e.g. accounting, dispatcher, fleet_manager)" }
        status:           { type: string, enum: [active, inactive, suspended_new] }
        office:           { type: [ string, 'null' ] }
        department:       { type: [ string, 'null' ] }
        user_id:          { type: [ integer, 'null' ], description: "Linked /users record (back-office staff often have both Employee and User records)" }
        created_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time }
        email:            { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        phone:            { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        work_extension:   { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        work_phone:       { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        employment_date:  { type: [ string, 'null' ], format: date, description: "Grantable — requires field grant" }
        termination_date: { type: [ string, 'null' ], format: date, description: "Grantable — requires field grant" }

    BillingSetting:
      type: object
      description: |
        A billing profile template referenced by customers via `billing_setting_id`. Internal template configuration (logo, address, signature) lives in non-exposed fields.
      properties:
        id:           { type: integer, example: 12 }
        profile_name: { type: [ string, 'null' ], description: "Human-readable profile name" }
        default:      { type: boolean, description: "True when this is the account's default billing profile" }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }

    PayrollSchedule:
      type: object
      description: |
        A pay-cadence definition. Small set per account; reference data partners typically fetch once and cache. No grantable fields — whole record is non-PII.
      properties:
        id:          { type: integer, example: 7 }
        name:        { type: string, example: "NET6 Weekly" }
        frequency:   { type: string, enum: [weekly, monthly] }
        start_day:   { type: [ integer, 'null' ], description: "Day-of-week the pay window starts on (0=Sunday)" }
        days_to_pay: { type: integer, description: "Lag in days between period close and pay-out" }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    DriverPayStatement:
      type: object
      description: |
        The pay statement of one driver for one pay period. The identity fields, the period fields and `total_paid_miles` are always returned. Every amount, `line_items` and the file link are grantable and omitted without the grant. Every amount is signed as stored, in dollars, as a decimal-precision string.
      properties:
        id:               { type: string, pattern: '^\d+_\d{4}-\d{2}-\d{2}$', example: "4821_2026-09-07", description: "The user id of the driver, an underscore and the first day of the period." }
        driver_id:        { type: integer, example: 8421, description: "FK to /drivers" }
        driver_type:      { type: string, enum: [company_driver, contract_driver, owner_operator, leased_owner] }
        driver_status:    { type: string, enum: [pre_hired, active, suspended_new, suspended, lead], description: "The stored driver status now, not at the period, as on /drivers: suspended_new is Suspended and suspended is Terminated." }
        pay_type:         { type: [ string, 'null' ], enum: [per_mile, percentage, flat, null], description: "Null when the period has no pay item." }
        period_start:     { type: string, format: date }
        period_end:       { type: string, format: date }
        settlement_date:  { type: [ string, 'null' ], format: date, description: "The pay day: the last day of the period plus the days to pay of the driver payroll schedule. Null when the driver has no schedule." }
        locked:           { type: boolean, description: "True once accounting froze the statement. An unlocked statement can still change." }
        total_paid_miles: { type: [ string, 'null' ], description: "Decimal string. Paid loaded and empty miles of the statement for per_mile; the total_miles of the driver statistics row of the same driver and week for percentage and flat. Null without a pay type, and null for percentage and flat when no statistics row exists." }
        linehaul:         { type: string, description: "Grantable. Load pay: per-mile, percentage of linehaul and flat pay." }
        fuel_surcharge:   { type: string, description: "Grantable. Percentage pay on the fuel surcharge." }
        earnings:         { type: string, description: "Grantable. Load pay plus accessorials, detention, adjustments and the seniority bonus." }
        adjustments:      { type: string, description: "Grantable. Adjustments and bonuses, including ELITE bonuses." }
        fees:             { type: string, description: "Grantable. Taxes and deductions." }
        fuel_card_fees:   { type: string, description: "Grantable. Fuel card fees: reefer, cash advance and other." }
        gross:            { type: string, description: "Grantable. `earnings` plus `fuel_surcharge`." }
        settlement:       { type: string, description: "Grantable. The net total of every line item." }
        line_items:
          type: array
          description: "Grantable. Every line item of the statement."
          items: { $ref: '#/components/schemas/DriverPayLineItem' }
        url:              { type: [ string, 'null' ], description: "Grantable, with `url_expires_at`. A short-lived link to the PDF of the statement. Null for an unlocked statement." }
        url_expires_at:   { type: [ string, 'null' ], format: date-time }

    DriverPayLineItem:
      type: object
      description: One line item of a driver pay statement, nested inside DriverPayStatement. Fixed shape.
      properties:
        name:
          type: string
          enum: [tax, accessorial, accessorial_percentage, linehaul_percentage, detention_percentage, flat,
                 loaded_per_mile, empty_per_mile, per_diem, less_per_diem, fuel_transaction_reefer_fee,
                 fuel_transaction_cash_ads_fee, fuel_transaction_other_fee, fuel_transaction_total,
                 fuel_transaction_cash_advance, adjustment, fuel_surcharge_percentage, seniority_bonus, elite_bonus]
          description: "The kind of item. `elite_bonus` is an `adjustment` whose description starts with `ELITE bonus`."
        amount:       { type: string, description: "Dollars, signed as stored. Decimal-precision string." }
        description:  { type: [ string, 'null' ] }
        load_id:      { type: [ integer, 'null' ], description: "FK to /loads, when the item belongs to a load." }
        category:     { type: [ string, 'null' ], description: "Accessorial category, for an accessorial item." }
        created_by_user_id: { type: [ integer, 'null' ], description: "FK to /users. The user that created the accessorial. Only for an accessorial item." }
        created_at:   { type: [ string, 'null' ], format: date-time, description: "When the accessorial was created. Only for an accessorial item." }

    DriverEarningsSummary:
      type: object
      description: |
        The earnings and the paid miles of one driver over three windows, counted from today. The window bounds and the paid miles are always returned; the earnings are grantable.
      properties:
        id:                   { type: integer, example: 8421, description: "The driver id. Resolve via /drivers." }
        weekly_period_start:  { type: string, format: date, description: "7 days ago." }
        weekly_period_end:    { type: string, format: date, description: "Yesterday." }
        weekly_paid_miles:    { type: string, description: "Decimal string." }
        weekly_earnings:      { type: string, description: "Grantable. Decimal string, dollars." }
        monthly_period_start: { type: string, format: date, description: "28 days ago." }
        monthly_period_end:   { type: string, format: date, description: "Yesterday." }
        monthly_paid_miles:   { type: string, description: "Decimal string." }
        monthly_earnings:     { type: string, description: "Grantable. Decimal string, dollars." }
        annual_period_start:  { type: string, format: date, description: "1 January of the current year." }
        annual_period_end:    { type: string, format: date, description: "Yesterday." }
        annual_paid_miles:    { type: string, description: "Decimal string." }
        annual_earnings:      { type: string, description: "Grantable. Decimal string, dollars." }

    DriverOtdSummary:
      type: object
      description: |
        The on-time delivery and pickup percentages of one driver over the requested date range. A stop is late for the driver when its service failure reason is `driver_related`, `traffic_delay` or `accident`, the failure is charged to the driver and it is preventable.
      properties:
        id:                    { type: integer, example: 162, description: "The driver id." }
        driver_id:             { type: integer, example: 162, description: "Same value as `id`. FK to /drivers." }
        period_start:          { type: string, format: date, description: "First day of the requested range." }
        period_end:            { type: string, format: date, description: "Last day of the requested range." }
        deliveries_count:      { type: integer, example: 33, description: "Deliveries of the driver dated in the range." }
        late_deliveries_count: { type: integer, example: 2, description: "Deliveries late for the driver by the OTD rule." }
        otd_percentage:        { type: [ number, 'null' ], example: 93.94, description: "100 minus the late share of all deliveries in the range, 2 decimals. Null when the driver has no delivery in the range." }
        pickups_count:         { type: integer, example: 42, description: "Pickups of the driver dated in the range. Trailer pickups are not counted." }
        late_pickups_count:    { type: integer, example: 1, description: "Pickups late for the driver by the OTP rule." }
        otp_percentage:        { type: [ number, 'null' ], example: 97.62, description: "100 minus the late share of all pickups in the range, 2 decimals. Null when the driver has no pickup in the range." }
        weeks_period_start:    { type: [ string, 'null' ], format: date, example: "2026-09-20", description: "First Sunday on or after the first day of the range. Null when the range holds no whole week." }
        weeks_period_end:      { type: [ string, 'null' ], format: date, example: "2026-10-10", description: "Last Saturday on or before the last day of the range. Null when the range holds no whole week." }
        counted_weeks:         { type: integer, example: 3, description: "Whole weeks that count in the miles and money figures: the newest week, a week with gross profit above zero and a vacation week. 0 when the range holds no whole week or no week with a mileage event." }
        average_miles:         { type: [ string, 'null' ], example: "1370.5", description: "Decimal string. Total miles over the counted weeks divided by `counted_weeks`. Null when `counted_weeks` is 0." }
        median_miles:          { type: [ string, 'null' ], example: "1370.0", description: "Decimal string. Median of the weekly total miles of the counted weeks. Null when `counted_weeks` is 0." }
        average_revenue:       { type: [ string, 'null' ], example: "1768.6", description: "Grantable. Decimal string, dollars. Revenue over the counted weeks divided by `counted_weeks`. Null when `counted_weeks` is 0." }
        median_revenue:        { type: [ string, 'null' ], example: "1768.6", description: "Grantable. Decimal string, dollars. Median of the weekly revenue of the counted weeks. Null when `counted_weeks` is 0." }
        revenue_per_mile:      { type: [ string, 'null' ], example: "2.0", description: "Grantable. Decimal string, dollars. Revenue divided by miles over the counted weeks. Null when `counted_weeks` is 0 or the counted weeks hold 0 miles." }
        average_gross_profit:  { type: [ string, 'null' ], example: "1032.01", description: "Grantable. Decimal string, dollars. Gross profit over the counted weeks divided by `counted_weeks`. Null when `counted_weeks` is 0." }
        median_gross_profit:   { type: [ string, 'null' ], example: "1032.01", description: "Grantable. Decimal string, dollars. Median of the weekly gross profit of the counted weeks. Null when `counted_weeks` is 0." }

    EliteScore:
      type: object
      description: |
        A driver performance score snapshot covering one date range. The headline `score` is always exposed; component sub-scores (idle, route+fuel, mpg, on-time, etc.) are extracted from the snapshot's underlying components and require explicit grants per component.
      properties:
        id:                  { type: integer, example: 9182 }
        driver_id:           { type: integer, example: 8421, description: "FK to /drivers" }
        score:               { type: string, description: "Headline score for the period (decimal, returned as string for precision)" }
        period_start:        { type: string, format: date-time, description: "UTC instant, ends in Z." }
        period_end:          { type: string, format: date-time, description: "UTC instant, ends in Z." }
        created_at:          { type: string, format: date-time }
        updated_at:          { type: string, format: date-time }
        idelic_score:        { type: [ number, 'null' ], description: "Grantable — requires field grant. Idelic safety component." }
        home_time_score:     { type: [ number, 'null' ], description: "Grantable — requires field grant. Home-time adherence component." }
        mpg_score:           { type: [ number, 'null' ], description: "Grantable — requires field grant. Fuel-efficiency component." }
        route_and_fuel_score: { type: [ number, 'null' ], description: "Grantable — requires field grant. Route compliance + fuelling component." }
        idle_score:          { type: [ number, 'null' ], description: "Grantable — requires field grant. Idle-time component." }
        on_time_score:       { type: [ number, 'null' ], description: "Grantable — requires field grant. On-time delivery component." }

    LoadScore:
      type: object
      description: |
        The Load Score of one load: its current predicted version beside its current actual version, as flat columns. The predicted score grades the appointments a customer gave the load, 0-100 with a letter grade, from a modelled run. The actual score applies the same rules to the real stop times, and to the driver's own HOS logs when the row has the `HOS_ACTUAL` flag. No grantable fields.

        Every value comes from the stored predicted version, except `customer_id` and `load_status` (read from the load now) and the `actual_*` columns (read from the current actual version). A version never changes after it is written, so the stored columns show the inputs when the load was scored.

        Hours are decimal strings, rounded to 2 decimals: stored minutes divided by 60.

        **Grades.** The grade reads the score rounded to a whole point:

        | Grade | Score |
        |-------|-------|
        | A | 89.5 to 100 |
        | B | 79.5 to below 89.5 |
        | C | 69.5 to below 79.5 |
        | D | 54.5 to below 69.5 |
        | F | below 54.5 |

        **Components.** The score is the sum of the four component points divided by the sum of their weights, times 100. Each `<component>_points` is out of its `<component>_weight` (the max points), for example 4.2 of 10. The weights are account settings; the defaults are 30, 25, 10 and 35. A component the version does not hold returns null points and a null weight.

        | Component | Label | Graded from |
        |-----------|-------|-------------|
        | `utilization` | Truck Use | Idle hours of the run |
        | `waste` | Wasted Time | Idle truck days |
        | `window` | Window Width | Width of each appointment window |
        | `time_of_day` | Appointment Hour | Pickup hour against the clock-start hour, and the delivery hour |

        **Flags.** The engine can write these codes:

        | Flag | Meaning |
        |------|---------|
        | `FLEX_PICKUP` | The pickup window is at least as wide as the account's flexible window threshold (default 20 hours) |
        | `ZERO_WIDTH_PU` | The pickup is at a fixed time (window width 0) |
        | `ZERO_WIDTH_DEL@<city>` | A delivery stop is at a fixed time; the suffix is the stop city |
        | `EARLY_AM_DELIVERY` | A live delivery stop has a window that opens before 07:00 local time |
        | `OFF_CYCLE_PICKUP` | The run starts 2 hours or more before the clock-start hour |
        | `PRETRIP_WAIT` | The truck waits 2 hours or more for the pickup after the clock-start hour |
        | `INSUFFICIENT_INTERSTOP` | Two consecutive stops are booked too close together: dwell at the first plus drive to the second is more than the time between their window openings |
        | `FORCED_SLACK` | Idle time is half a truck day (12 hours) or more |
        | `EXTREME_SLACK` | Idle time is two truck days (48 hours) or more |
        | `WEEKEND_TRAP` | Idle time is one truck day or more and the run covers two or more weekend dates |
        | `WEEKEND_RESTART` | A weekly restart falls inside the run |
        | `NO_ROOM_FOR_RESTART` | The run with a weekly restart is late, so the version is scored from the run without it, which is less late |
        | `WEEKEND_SLACK_GRACE` | A weekly restart happened and the idle hours are above the normal full-points band, so Truck Use uses the weekend band |
        | `INFEASIBLE` | The load cannot be run on time (`feasible` is false) |
        | `SINGLE_FEASIBLE_START` | The load runs on time only from the earliest pickup time |
        | `FULLY_FLEXIBLE` | Every window is at least as wide as the flexible window threshold and the load runs on time, so the score is 100 |
        | `HOS_ACTUAL` | An actual version built from the driver's HOS logs; never on a predicted version |
      properties:
        load_id:                 { type: integer, description: "FK to /loads. The path id of GET /load_scores/{id}" }
        customer_id:             { type: [ integer, 'null' ], description: "FK to /customers, read from the load now" }
        load_status:             { type: [ string, 'null' ], description: "The load's CURRENT status (as on /loads), not its status when the load was scored" }
        pickup_from:             { type: [ string, 'null' ], format: date-time, description: "Appointment window open of the first scored stop, as stored with the predicted version" }
        pickup_to:               { type: [ string, 'null' ], format: date-time, description: "Appointment window close of the first scored stop" }
        delivery_from:           { type: [ string, 'null' ], format: date-time, description: "Appointment window open of the last scored stop" }
        delivery_to:             { type: [ string, 'null' ], format: date-time, description: "Appointment window close of the last scored stop" }
        predicted_score:         { type: string, description: "0-100, decimal, returned as string for precision" }
        predicted_grade:         { type: string, enum: [A, B, C, D, F] }
        actual_score:            { type: [ string, 'null' ], description: "Score of the current actual version; null until the last customer stop has both its time in and time out" }
        actual_grade:            { type: [ string, 'null' ], enum: [A, B, C, D, F, null], description: "Grade of the current actual version; null without one" }
        feasible:                { type: boolean, description: "Predicted: false when no legal start lets a truck run the load on time. An infeasible load keeps its score and grade" }
        actual_feasible:         { type: [ boolean, 'null' ], description: "Actual: false when a stop's time in is after its appointment window closed; null without an actual version" }
        committed_hours:         { type: string, description: "Decimal hours the driver spends on the load in the predicted run, clock start to release" }
        productive_hours:        { type: string, description: "Decimal hours of driving, dock time and required rest" }
        waste_hours:             { type: string, description: "Decimal idle hours" }
        utilization_points:      { type: [ string, 'null' ], description: "Truck Use points, out of utilization_weight" }
        utilization_weight:      { type: [ integer, 'null' ], description: "Truck Use max points" }
        waste_points:            { type: [ string, 'null' ], description: "Wasted Time points, out of waste_weight" }
        waste_weight:            { type: [ integer, 'null' ], description: "Wasted Time max points" }
        window_points:           { type: [ string, 'null' ], description: "Window Width points, out of window_weight" }
        window_weight:           { type: [ integer, 'null' ], description: "Window Width max points" }
        time_of_day_points:      { type: [ string, 'null' ], description: "Appointment Hour points, out of time_of_day_weight" }
        time_of_day_weight:      { type: [ integer, 'null' ], description: "Appointment Hour max points" }
        clock_start_at:          { type: [ string, 'null' ], format: date-time, description: "When the truck clock starts in the modelled run: the earlier of run_start_at and the account's clock-start hour (Settings V2 Load Score, default 11:00) on the date the pickup window opens" }
        run_start_at:            { type: [ string, 'null' ], format: date-time, description: "When the modelled run takes the pickup" }
        run_release_at:          { type: [ string, 'null' ], format: date-time, description: "When the driver is released after the last stop in the modelled run" }
        gate_wait_hours:         { type: string, description: "Decimal hours the truck waits from the clock start to the pickup; counted as idle" }
        early_hours:             { type: string, description: "Decimal hours the run starts before the clock-start hour; 0 when it starts at or after it" }
        flags:                   { type: array, items: { type: string }, description: "Flags of the predicted version; see the table above" }
        on_hold:                 { type: boolean, description: "The On Hold flag of the load when the predicted version was scored, stored with the version" }
        not_scheduled:           { type: boolean, description: "The Not Scheduled flag of the load when the predicted version was scored, stored with the version" }
        scored_at:               { type: string, format: date-time, description: "When the current predicted version was written" }

    LoadScoreSnapshot:
      type: object
      description: |
        One Load Score version of one load, for one kind. Each score change writes a new version and sets `superseded_at` on the version it replaces. Grades, component points and weights and flag codes are as in `LoadScore`. Hours are decimal strings, rounded to 2 decimals. No grantable fields.
      properties:
        id:                      { type: integer, example: 51204 }
        load_id:                 { type: integer, description: "FK to /loads" }
        kind:                    { type: string, enum: [predicted, actual], description: "predicted: the modelled run from the appointments. actual: the same rules against the real stop times, written once the last customer stop has both its time in and time out" }
        version:                 { type: integer, description: "1-based per load and kind" }
        score:                   { type: string, description: "0-100, decimal, returned as string for precision" }
        grade:                   { type: string, enum: [A, B, C, D, F] }
        feasible:                { type: boolean, description: "predicted: false when no legal start lets a truck run the load on time. actual: false when a stop's time in is after its appointment window closed" }
        committed_hours:         { type: string, description: "Decimal hours the driver spends on the load, start to release" }
        productive_hours:        { type: string, description: "Decimal hours of driving, dock time and required rest" }
        waste_hours:             { type: string, description: "Decimal idle hours" }
        utilization_points:      { type: [ string, 'null' ], description: "Truck Use points, out of utilization_weight" }
        utilization_weight:      { type: [ integer, 'null' ], description: "Truck Use max points" }
        waste_points:            { type: [ string, 'null' ], description: "Wasted Time points, out of waste_weight" }
        waste_weight:            { type: [ integer, 'null' ], description: "Wasted Time max points" }
        window_points:           { type: [ string, 'null' ], description: "Window Width points, out of window_weight" }
        window_weight:           { type: [ integer, 'null' ], description: "Window Width max points" }
        time_of_day_points:      { type: [ string, 'null' ], description: "Appointment Hour points, out of time_of_day_weight" }
        time_of_day_weight:      { type: [ integer, 'null' ], description: "Appointment Hour max points" }
        flags:                   { type: array, items: { type: string }, description: "Flags of this version; see LoadScore" }
        on_hold:                 { type: boolean, description: "The On Hold flag of the load when this version was scored, stored with the version" }
        not_scheduled:           { type: boolean, description: "The Not Scheduled flag of the load when this version was scored, stored with the version" }
        superseded_at:           { type: [ string, 'null' ], format: date-time, description: "Null for the current version; set when a later version replaced it" }
        created_at:              { type: string, format: date-time, description: "When this version was written" }

    Compensation:
      type: object
      description: |
        Driver pay structure (Per Mile, Percentage, or Flat). The `/compensations` endpoint requires explicit grant — without it the request returns 403. Once granted, only `id, name, status` are visible by default; rate, percentage, flat, and bonus fields require additional field grants on top of the endpoint grant.
      properties:
        id:                                       { type: integer, example: 312 }
        name:                                     { type: string, example: "Standard Per Mile" }
        status:                                   { type: string, enum: ['Per Mile', 'Percentage', 'Flat'] }
        created_at:                               { type: string, format: date-time }
        updated_at:                               { type: string, format: date-time }
        loaded_mile_rate:                         { type: [ string, 'null' ], description: "Grantable — requires field grant. Per-mile rate for loaded miles." }
        empty_mile_rate:                          { type: [ string, 'null' ], description: "Grantable — requires field grant. Per-mile rate for empty miles." }
        banded:                                   { type: boolean, description: "Grantable — requires field grant. Whether banded mileage rates apply." }
        linehaul_percentage:                      { type: [ string, 'null' ], description: "Grantable — requires field grant. Percentage of linehaul revenue paid to driver." }
        fuel_surcharge_percentage:                { type: [ string, 'null' ], description: "Grantable — requires field grant. Percentage of fuel surcharge paid to driver." }
        detention_percentage:                     { type: [ string, 'null' ], description: "Grantable — requires field grant. Percentage of detention paid to driver, Wages accounts only. Null pays at the account fallback, the Linehaul % or the Fuel Surcharge %." }
        layover_percentage:                       { type: [ string, 'null' ], description: "Grantable — requires field grant. Percentage of layover accessorials paid to driver, Wages accounts only. Null pays at the account fallback, the Linehaul % or the Fuel Surcharge %." }
        flat_status:                              { type: [ string, 'null' ], description: "Grantable — requires field grant. Sub-status for flat pay drivers." }
        flat_rate:                                { type: [ string, 'null' ], description: "Grantable — requires field grant. Flat-rate amount." }
        seniority_bonus_enabled:                  { type: boolean, description: "Grantable — requires field grant. Whether seniority bonus applies." }
        seniority_bonus_cents_per_mile_per_year:  { type: [ string, 'null' ], description: "Grantable — requires field grant. Cents-per-mile-per-year-of-tenure bonus rate." }
        seniority_bonus_excluded_event_reasons:   { type: array, items: { type: string }, description: "Grantable — requires field grant. Event reasons that disqualify a period from the seniority bonus calculation." }

    Accident:
      type: object
      description: |
        An accident and claim record. Persisted fields use the database column names; derived fields (`state_code`, `primary_safety_manager_full_name`, the `weather` and `claim_types` arrays) keep serializer names. `id` is the record identifier; the insurer claim number is `claim`. Read the driver, the truck and the trailer through `driver_id`, `truck_id` and `trailer_id`: the references survive equipment deletion. Grantable fields are omitted from the response without a field grant.
      properties:
        id:                      { type: integer, example: 4821 }
        claim:                   { type: [ string, 'null' ], example: "2026-0113", description: "Insurer claim number." }
        claim_status:            { type: [ string, 'null' ], enum: [open, closed, pending, null] }
        accident_type:           { type: [ string, 'null' ], enum: [accident, incident, null], description: "Classification." }
        date:                    { type: [ string, 'null' ], format: date, description: "Accident date." }
        time:                    { type: [ string, 'null' ], description: "Accident wall-clock time as recorded, free text." }
        days_since_last_restart: { type: [ string, 'null' ] }
        hour_on_duty:            { type: [ string, 'null' ] }
        hour_of_driving:         { type: [ string, 'null' ] }
        collision_types_array:   { type: [ array, 'null' ], items: { type: string }, description: "Collision types, e.g. rear_end_ov, jackknife." }
        road_types:              { type: [ array, 'null' ], items: { type: string }, description: "Road types, e.g. highway, truck_stop." }
        violation_types:         { type: array, items: { type: string }, description: "Violation type names selected on the accident. Each account defines its own list in Settings." }
        weather:                 { type: array, items: { type: string, enum: [clear, wet, snow, ice, raining, fog, high_wind, dust_storm] }, description: "Active weather flags in canonical order." }
        claim_types:             { type: array, items: { type: string, enum: [auto_liability, general_liability, physical_damage, cargo, workers_compensation, occupational_accident, property_damage] }, description: "Checked claim types in canonical order." }
        address:                 { type: [ string, 'null' ] }
        city:                    { type: [ string, 'null' ] }
        state_code:              { type: [ string, 'null' ] }
        zip_code:                { type: [ string, 'null' ] }
        damage_to_cargo:         { type: [ string, 'null' ], description: "Cargo damage flag: yes, no, or unknown. Legacy rows can carry an empty string." }
        truck_damage_note:       { type: [ string, 'null' ] }
        trailer_damage_note:     { type: [ string, 'null' ] }
        primary_safety_manager_full_name: { type: [ string, 'null' ] }
        driver_id:               { type: [ integer, 'null' ], description: "Driver FK. Resolve via /drivers." }
        truck_id:                { type: [ integer, 'null' ], description: "Truck FK. Resolve via /trucks." }
        trailer_id:              { type: [ integer, 'null' ], description: "Trailer FK. Resolve via /trailers." }
        tow:                     { type: [ boolean, 'null' ], description: "Grantable — requires field grant." }
        injury:                  { type: [ boolean, 'null' ], description: "Grantable — requires field grant." }
        total_number_injuries:   { type: [ integer, 'null' ], description: "Grantable — requires field grant." }
        citations:               { type: [ boolean, 'null' ], description: "Grantable — requires field grant." }
        citation_comment:        { type: [ string, 'null' ], description: "Grantable — requires field grant." }
        fatal:                   { type: [ boolean, 'null' ], description: "Grantable — requires field grant." }
        total_number_fatalities: { type: [ integer, 'null' ], description: "Grantable — requires field grant." }
        dot_accident:            { type: [ boolean, 'null' ], description: "DOT reportable. Grantable — requires field grant." }
        preventable:             { type: [ boolean, 'null' ], description: "Grantable — requires field grant." }
        at_fault:                { type: [ boolean, 'null' ], description: "Grantable — requires field grant." }
        truck_vin:               { type: [ string, 'null' ], description: "Grantable — requires field grant." }
        trailer_vin:             { type: [ string, 'null' ], description: "Grantable — requires field grant." }
        truck_license_plate:     { type: [ string, 'null' ], description: "Grantable — requires field grant." }
        trailer_license_plate:   { type: [ string, 'null' ], description: "Grantable — requires field grant." }
        accident_estimate_line_items:
          type: array
          items: { $ref: '#/components/schemas/AccidentEstimateLineItem' }
          description: "Grantable — requires field grant."
        accident_line_items:
          type: array
          items: { $ref: '#/components/schemas/AccidentLineItem' }
          description: "Grantable — requires field grant."
        total_loss_truck:        { type: [ string, 'null' ], description: "Decimal-precision string. Grantable — requires field grant." }
        total_loss_trailer:      { type: [ string, 'null' ], description: "Decimal-precision string. Grantable — requires field grant." }
        created_at:              { type: string, format: date-time }
        updated_at:              { type: string, format: date-time }

    AccidentEstimateLineItem:
      type: object
      description: An estimated claim cost line item, nested inside an accident.
      properties:
        id:               { type: integer }
        policy:           { type: [ string, 'null' ], enum: [al, cargo, gl, ocac, pd, wcc, expense, null] }
        description:      { type: [ string, 'null' ] }
        subrogation:      { type: [ boolean, 'null' ] }
        amount_estimated: { type: string, description: "Decimal-precision string." }
        created_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time }

    AccidentLineItem:
      type: object
      description: A paid claim cost line item, nested inside an accident.
      properties:
        id:              { type: integer }
        paid_by:         { type: [ string, 'null' ] }
        paid_to:         { type: [ string, 'null' ] }
        policy:          { type: [ string, 'null' ], enum: [al, cargo, gl, ocac, pd, wcc, expense, null] }
        description:     { type: [ string, 'null' ] }
        subrogation:     { type: [ boolean, 'null' ] }
        amount_paid:     { type: string, description: "Decimal-precision string." }
        amount_received: { type: string, description: "Decimal-precision string." }
        created_at:      { type: string, format: date-time }
        updated_at:      { type: string, format: date-time }

    LoadFinancial:
      type: object
      description: |
        The money view of one load. `id` is the load id. The identity fields are always returned; every money field and both lists are grantable and omitted without the grant.
      properties:
        id:                  { type: integer, example: 48213, description: "The load id." }
        customer_id:         { type: [ integer, 'null' ], description: "Resolve via /customers." }
        status:              { type: string, description: "Load status. Same enum as /loads." }
        created_at:          { type: string, format: date-time }
        updated_at:          { type: string, format: date-time, description: "The load's updated_at. An accessorial edit touches the load." }
        linehaul_rate:       { type: string, description: "Grantable. Linehaul amount on the load, in dollars. Decimal-precision string." }
        fuel_surcharge:      { type: string, description: "Grantable. Fuel surcharge amount on the load, in dollars. Decimal-precision string." }
        detention_sum:       { type: string, description: "Grantable. Detention amount on the load, in dollars. Decimal-precision string." }
        total:               { type: string, description: "Grantable. Total of the load, in dollars. Decimal-precision string." }
        lumper_sum:          { type: string, description: "Grantable. Lumper amount on the load, in dollars. Decimal-precision string." }
        storage_sum:         { type: string, description: "Grantable. Storage amount, in dollars. Decimal-precision string." }
        misc_sum:            { type: string, description: "Grantable. Misc. amount, in dollars. Decimal-precision string." }
        deductions_sum:      { type: string, description: "Grantable. Deductions amount, in dollars. Decimal-precision string." }
        additional_charges:
          type: array
          description: "Grantable. The Additional Charges of the load. The whole list is the grant unit."
          items: { $ref: '#/components/schemas/LoadAdditionalCharge' }
        driver_accessorials:
          type: array
          description: "Grantable. The Driver Accessorial Pay rows of the load, without the empty placeholder rows. The whole list is the grant unit."
          items: { $ref: '#/components/schemas/LoadDriverAccessorial' }
        carrier_pay:
          type: array
          description: "Grantable. One item per carrier of a brokered load, with its charges. Empty for a load with no carrier."
          items:
            type: object
            properties:
              vendor_id: { type: integer, description: "The carrier. Resolve via /vendors." }
              charges:
                type: array
                items:
                  type: object
                  properties:
                    id:          { type: integer }
                    name:        { type: string }
                    amount:      { type: [ string, 'null' ], description: "Dollars. Decimal-precision string." }
                    description: { type: [ string, 'null' ] }
                    created_at:  { type: string, format: date-time }

    LoadBillingStatus:
      type: object
      description: The billing status of one load. `id` is the load id.
      properties:
        id:         { type: integer, description: "The load id." }
        status:     { type: string, enum: [booked, assigned, en_route_to_shipper, at_shipper, picked_up, delayed, en_route_to_consignee, at_consignee, delivered, delivered_pending, exported, missing_paperwork, billed_pending, billed, billed_pending_acc, closed, open_balance, canceled, tonu], description: "Load status. Same enum as /loads." }
        updated_at: { type: string, format: date-time }

    LoadAdditionalCharge:
      type: object
      description: One customer charge on a load, nested inside LoadFinancial. Fixed shape.
      properties:
        id:          { type: integer }
        name:        { type: string, description: "Charge name as shown in the Additional Charges section." }
        amount:      { type: string, description: "Dollars. Decimal-precision string." }
        description: { type: [ string, 'null' ] }
        mapped_field: { type: string, enum: [linehaul_rate, fuel_surcharge, lumper_sum, storage_sum, misc_sum, detention_sum, deductions_sum], description: "The load column the charge is part of." }
        created_at:  { type: string, format: date-time }

    LoadChargesBreakdown:
      type: object
      properties:
        linehaul_rate:  { type: string, description: "Linehaul rate. Decimal-precision string from -9999999.99 to 9999999.99, '0.0' when not sent, e.g. '1500.0'." }
        fuel_surcharge: { type: string, description: "Fuel surcharge. Decimal-precision string from -9999999.99 to 9999999.99, '0.0' when not sent, e.g. '210.5'." }
        storage_sum:    { type: string, description: "Storage. Decimal-precision string from -9999999.99 to 9999999.99, '0.0' when not sent, e.g. '40.0'." }
        detention_sum:  { type: string, description: "Detention. Decimal-precision string from -9999999.99 to 9999999.99, '0.0' when not sent, e.g. '100.25'." }
        lumper_sum:     { type: string, description: "Lumper. Decimal-precision string from -9999999.99 to 9999999.99, '0.0' when not sent, e.g. '75.0'." }
        misc_sum:       { type: string, description: "Miscellaneous charges. Decimal-precision string from -9999999.99 to 9999999.99, '0.0' when not sent, e.g. '20.0'." }
        deductions_sum: { type: string, description: "Deductions. Zero or negative decimal-precision string from -9999999.99 to 0, '0.0' when not sent, e.g. '-50.5'." }
        additional_charges:
          type: array
          items:
            type: object
            properties:
              name:   { type: [ string, 'null' ], description: "Free text as sent." }
              amount: { type: string, description: "Decimal-precision string, negative for a credit, e.g. '12.0'." }
        total:          { type: string, description: "linehaul_rate + fuel_surcharge + storage_sum + detention_sum + lumper_sum + misc_sum + deductions_sum + every additional charge amount. From 0 to 9999999.99, never negative. Decimal-precision string, e.g. '1907.25'." }

    LoadDriverAccessorial:
      type: object
      description: |
        One Driver Accessorial Pay row, nested inside LoadFinancial. Fixed shape. The settlement fields show the payroll week the accessorial was actually paid in — which is not always the load's delivery week.
      properties:
        id:                    { type: integer }
        driver_id:             { type: integer, description: "Resolve via /drivers." }
        sum:                   { type: string, description: "Accessorial amount, in dollars. Decimal-precision string." }
        category:              { type: [ string, 'null' ], description: "Accessorial category key." }
        note:                  { type: [ string, 'null' ] }
        created_at:            { type: string, format: date-time, description: "When the accessorial was added." }
        settlement_status:     { type: string, enum: [paid, excluded, pending], description: "`paid`: part of a locked payroll. `excluded`: added after the load's payroll week was locked, so no payroll includes it. `pending`: the load's payroll week is not locked yet." }
        settlement_week_start: { type: [ string, 'null' ], format: date, description: "First day of the payroll week the accessorial was paid in. Null unless `paid`." }
        settlement_week_end:   { type: [ string, 'null' ], format: date, description: "Last day of that week. Null unless `paid`." }
        settlement_date:       { type: [ string, 'null' ], format: date, description: "Pay date of that week. Null unless `paid`." }

    LoadFlag:
      type: object
      description: |
        A customer service flag on a load. Not every load has a row; a load with no row carries no flag, and every boolean below reads false for it.
      properties:
        id:                    { type: integer, description: "Primary key." }
        load_id:               { type: integer, description: "Parent load FK. Resolve via GET /loads/{id}." }
        preloaded:             { type: boolean, description: "True while a trailer is preloaded on the load. Set by POST /load_flags and by the Customer Service Preload Trailer action. Cleared when customer service removes the preload, or when a stop of the load gets a different trailer." }
        preloaded_trailer_id:  { type: [ integer, 'null' ], description: "Trailer FK of the preload. Resolve via GET /trailers/{id}. Null when preloaded is false." }
        on_hold:               { type: boolean, description: "Customer service put the load on hold." }
        unscheduled:           { type: boolean, description: "The load has no scheduled appointment yet." }
        cs_done:               { type: boolean, description: "Customer service marked its work on this load done." }
        billing_hold:          { type: boolean, description: "Grantable. True while the load is held out of every billing export." }
        created_at:            { type: string, format: date-time, description: "When the flag row was created." }
        updated_at:            { type: string, format: date-time, description: "Moves on every flag change, a cleared preload included." }

    LoadInvoice:
      type: object
      description: |
        The invoice of one load from Exported onward. `id` is the load id. `url` is the link to the invoice PDF, rendered on request. Read it before `url_expires_at`. The link is a bearer credential until it expires. Do not log it. Do not store it.
      properties:
        id:             { type: integer, description: "The load id." }
        load_id:        { type: integer, description: "Same value as `id`. Resolve via /loads." }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time }
        url:            { type: [ string, 'null' ], description: "A gogp link that answers with the invoice PDF. Treat it as opaque. Do not store it. Grantable, so it is absent unless your application is granted it.", example: "https://app.openroadtms.com/api/ext/v1/load_invoices/123/file?token=..." }
        url_expires_at: { type: [ string, 'null' ], format: date-time, description: "When `url` stops working. Grantable with `url`." }

    LoadFullPDF:
      type: object
      description: |
        The Full PDF of one load: the invoice and the confirmed POD, with the rate confirmation, lumper receipts and scale tickets. `url` is the link to the PDF, rendered on request. Read it before `url_expires_at`. The link is a bearer credential until it expires. Do not log it. Do not store it.
      properties:
        load_id:        { type: integer, description: "The load id." }
        url:            { type: [ string, 'null' ], description: "A gogp link that answers with the Full PDF. Treat it as opaque. Do not store it. Grantable, so it is absent unless your application is granted it.", example: "https://app.openroadtms.com/api/ext/v1/loads/123/full_pdf/file?token=..." }
        url_expires_at: { type: [ string, 'null' ], format: date-time, description: "When `url` stops working. Grantable with `url`." }

    LoadGrossProfit:
      type: object
      description: The estimated gross profit of one load.
      properties:
        load_id:      { type: integer, description: "The load id." }
        gross_profit: { type: [ string, 'null' ], example: "100.0", description: "Grantable. Decimal string in dollars, rounded to cents. Null when the account is not a GP Transco account, when the load has no driver, or when the Load view shows \"Can't calculate\" for every driver." }

    DriverStat:
      type: object
      description: |
        The gross profit of one driver. The driver stats job refreshes the row, so `updated_at` moves on each refresh. The values are decimal strings in dollars. `this_week_gross_profit` and `last_week_gross_profit` are one week each. Each `last_N_gross_profit` is the average per week of the newest N weeks, and it is null until the driver first has N weekly rows. After that it keeps the last value computed, because the refresh skips a blank window.
      properties:
        id:                     { type: integer }
        driver_id:              { type: integer, description: "Parent driver FK. Resolve via GET /drivers/{id}." }
        this_week_gross_profit: { type: [ string, 'null' ], description: "Grantable." }
        last_week_gross_profit: { type: [ string, 'null' ], description: "Grantable." }
        last_4_gross_profit:    { type: [ string, 'null' ], description: "Grantable. Average per week of the last 4 weeks." }
        last_8_gross_profit:    { type: [ string, 'null' ], description: "Grantable. Average per week of the last 8 weeks." }
        last_13_gross_profit:   { type: [ string, 'null' ], description: "Grantable. Average per week of the last 13 weeks." }
        last_26_gross_profit:   { type: [ string, 'null' ], description: "Grantable. Average per week of the last 26 weeks." }
        last_52_gross_profit:   { type: [ string, 'null' ], description: "Grantable. Average per week of the last 52 weeks." }
        created_at:             { type: string, format: date-time }
        updated_at:             { type: string, format: date-time }

    RehireEligibility:
      type: object
      description: |
        A rehire eligibility assessment for a driver. Each of `operations`, `safety` and `human_resources` is true (yes), false (no), or null (not assessed). A driver with no row has no per-department answers; the driver field `eligible_for_rehire` holds the overall answer.
      properties:
        id:               { type: integer }
        driver_id:        { type: integer, description: "Parent driver FK. Resolve via GET /drivers/{id}." }
        operations:       { type: [ boolean, 'null' ] }
        safety:           { type: [ boolean, 'null' ] }
        human_resources:  { type: [ boolean, 'null' ] }
        created_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time }

    DriverFeedback:
      type: object
      description: |
        A driver satisfaction survey response, and its optional follow-up answers.

        `rating` is the driver's answer to "how do you feel about the past 7 days of working with the company", on a 1–6 scale where 1 is the lowest (angriest) and 6 is the highest (happiest); a rating of 3 or less sends an internal alert mail. Nothing validates the column, so a 0 can appear on an old row. `revision` is the question-set version (1 is the current set).

        `responses` is grantable and holds the optional follow-up answers, keyed by question number as a string. The whole object is null until the driver submits the follow-up form. A radio question (`"2"`–`"5"`) the driver left unanswered has no key in `responses`; a free-text question (`"1"`, `"6"`) left unanswered is an empty string:
          - `"1"`: free text — reason(s) for the rating.
          - `"2"`: 1–6 scale as a string — quality of communication with the dispatcher.
          - `"3"`: 1–6 scale as a string — miles received.
          - `"4"`: 1–6 scale as a string — waiting times at shippers/receivers.
          - `"5"`: 1–6 scale as a string — total pay.
          - `"6"`: free text — other concerns.

        To read the latest feedback of one driver: `?driver_id={id}&sort=-created_at&per_page=1`.
      properties:
        id:          { type: integer }
        driver_id:   { type: integer, description: "Parent driver FK. Resolve via GET /drivers/{id}." }
        rating:      { type: integer, example: 5, description: "1–6 scale, 1 lowest and 6 highest. Nothing validates the column, so a 0 can appear on an old row." }
        revision:    { type: [ integer, 'null' ], description: "Question-set version. 1 is the current set." }
        responses:   { type: [ object, 'null' ], description: "Grantable — requires field grant. Keys \"1\" through \"6\"; see schema description for each question, its value domain, and the unanswered-question shape. Null until the driver submits the follow-up form." }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    Vendor:
      type: object
      description: |
        A vendor. `driving_as` is the name a driver's paperwork shows when it does not match the driver's own name (a lease or an owner-operator arrangement); it is null otherwise. Resolve a driver's `vendor_id` here.

        Financial columns (bank account, tax number and similar) are never exposed on this endpoint.
      properties:
        id:            { type: integer }
        name:          { type: [ string, 'null' ] }
        type:          { type: [ string, 'null' ], description: "owner_operator, carrier, equipment, company_driver, maintenance" }
        status:        { type: [ string, 'null' ], description: "active, inactive, do_not_use" }
        driving_as:    { type: [ string, 'null' ] }
        adp_id:        { type: [ string, 'null' ], description: "Grantable — requires field grant. Confidential. The ADP ID of the vendor, the pay-to company of a driver (companies.adp_id); null when the vendor has no ADP ID. The value is a string and keeps its leading zeros. Off for every application until the OpenRoad staff enable it." }
        updated_at:    { type: string, format: date-time }

    FuelCardTransaction:
      type: object
      description: |
        One fuel card purchase. Fields marked "Grantable" need a field grant. Money columns are decimal strings. The endpoint serves the live rows: deleted and cancelled rows are left out.
      properties:
        id:              { type: integer, example: 5120 }
        date:            { type: string, format: date, example: "2026-09-10" }
        time:            { type: [ string, 'null' ], format: date-time, description: "The vendor's transaction time read as US Central; it is not a true instant for a stop outside Central (Comdata and EFS carry local digits, Relay a true instant)." }
        card_type:       { type: [ string, 'null' ], enum: [ EFS, FleetOne, Comdata, Manual, Relay, Other, null ], description: "Where the row came from: `Comdata`, `EFS` and `Relay` rows come from the vendor feed; `Manual` rows come from the page form; `Other` rows come from a file upload on the page; `FleetOne` rows are the 2014 to 2017 import; `null` on a few old rows." }
        funding_type:    { type: [ string, 'null' ], enum: [ EFS, FleetOne, Comdata, Manual, Relay, Other, Pilot, Loves, null ], description: "Who funded the purchase: `EFS`, `FleetOne`, `Comdata`, `Relay`, `Manual` and `Other` repeat the card type; `Pilot` and `Loves` mark a purchase at a Pilot or Flying J, or a Love's, location, matched from the merchant name and the account's fuel location list." }
        driver_id:       { type: [ integer, 'null' ], description: "The driver of the purchase; usually null on a resale row." }
        driver_no:       { type: [ string, 'null' ], example: "D77", description: "The driver number shown on the Fuel Card Transactions page: the number on the vendor row, else the driver's number; null on a fill resold to a fuel customer, which carries `customer_id`." }
        customer_id:     { type: [ integer, 'null' ], description: "The fuel customer that owns the card: set on resale rows, null on GP fleet rows." }
        unit:            { type: [ string, 'null' ], example: "T-101", description: "Vendor text; may not match a truck unit." }
        merchant_name:   { type: [ string, 'null' ], example: "LOVES #1044" }
        city:            { type: [ string, 'null' ], example: "Joplin" }
        state_code:      { type: [ string, 'null' ], example: "MO" }
        diesel_gallons:  { type: string, example: "120.5", description: "Decimal string. Includes DEF today; changes when the DEF fields ship." }
        odometer:        { type: [ string, 'null' ], example: "412345.5", description: "Decimal string. Odometer reading at the transaction; null when none." }
        exported:        { type: boolean }
        created_at:      { type: string, format: date-time }
        updated_at:      { type: string, format: date-time }
        card:            { type: [ string, 'null' ], example: "4821", description: "Grantable. The card number of the row. A FleetOne card is shown zero-padded to 4 digits, and a FleetOne row with no stored card shows `0000`, as the page does. The `card` filter reads the stored value and needs this grant." }
        diesel_amount:   { type: string, example: "645.92", description: "Decimal string. Grantable. Includes DEF today and changes when the DEF fields ship. A Comdata `diesel_amount` includes the transaction fee." }
        reefer_amount:   { type: string, example: "10.25", description: "Grantable. Decimal string." }
        discount:        { type: string, example: "3.5", description: "Grantable. Decimal string." }
        net_pg:          { type: string, example: "4.75", description: "Grantable. Decimal string." }
        rebate:          { type: string, example: "1.25", description: "Grantable. Decimal string." }
        cash_ad:         { type: string, example: "20.0", description: "Grantable. Decimal string." }
        other:           { type: string, example: "7.5", description: "Grantable. Decimal string. Includes DEF today; changes when the DEF fields ship." }
        transaction_fee: { type: string, example: "2.0", description: "Grantable. Decimal string." }
        total:           { type: string, example: "686.42", description: "Grantable. Decimal string." }

    FuelPriceDatum:
      type: object
      description: |
        One week's DOE (EIA) retail diesel price for one US area. Global reference data — identical rows for every account, filled by a daily cron.
      properties:
        id:                { type: integer, example: 1024 }
        period:            { type: string, format: date, description: "Week start (Monday)." }
        area_name:         { type: string, enum: [ us, east_coast, new_england, midwest, california, west_coast_less_california, central_atlantic, lower_atlantic, west_coast, gulf_coast, rocky_mountain ] }
        fuel_type:         { type: string, enum: [ diesel ], example: diesel }
        price_per_gallon:  { type: string, example: "3.987" }
        created_at:        { type: string, format: date-time }
        updated_at:        { type: string, format: date-time }

    IftaQuarter:
      type: object
      description: |
        One IFTA filing quarter. `tax_rate` and `surcharge` are the published per-jurisdiction tables of the IFTA agreement for that quarter — public tax data, not the account's own figures.

        **The rate tables are filled in after a quarter closes, and only for accounts that file IFTA through OpenRoad.** An open or future quarter returns `{}` for both `tax_rate` and `surcharge`. Treat these records as the historical rate reference; they are not a source of mileage. Mileage for any period, open or closed, comes from `GET /driver_route_state_reports`.

        A quarter record is created by hand, so the list can hold a quarter far in the future and a quarter with no rates. Read `tax_rate` before you rely on a record.
      properties:
        id:         { type: integer, example: 214 }
        quarter:    { type: string, example: "2026Q2" }
        start_date: { type: string, format: date }
        end_date:   { type: string, format: date }
        tax_rate:
          type: object
          description: "Per-jurisdiction tax rate for the quarter, keyed by state or province code, as a decimal-precision string, for example \"0.3596\". A jurisdiction with no published rate carries null or an empty string."
          additionalProperties: { type: [ string, 'null' ] }
        surcharge:
          type: object
          description: "Per-jurisdiction surcharge for the quarter, keyed by state or province code, as a decimal-precision string. A jurisdiction with no published surcharge carries null or an empty string, which is the common case."
          additionalProperties: { type: [ string, 'null' ] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Region:
      type: object
      description: |
        A region of the account. `code` is the region name.
      properties:
        id:           { type: integer, example: 12 }
        code:         { type: string, example: "IL-CHI" }
        zip_prefixes: { type: array, items: { type: string }, description: "Sorted zip prefixes of the region. A region with no zip area returns an empty list." }
        planner_id:   { type: [ integer, 'null' ], description: "Grantable. Id of the user that holds the active Planner assignment of the region (Capacity, Planners). The newest active assignment wins. Null when none, or when the user is deleted. The substitute (`substitute_id`) is not returned." }
        planner_full_name: { type: [ string, 'null' ], example: "Pat Planner", description: "Grantable. Full name of that Planner." }
        planner_assigned_at: { type: [ string, 'null' ], format: date-time, description: "Grantable. When that Planner started on the region: the start of the unbroken run of assignment rows of the same user and region that ends in the active row. A substitute change continues the run; a user who left and came back starts a new run. Null when `planner_id` is null." }
        bookers:
          type: array
          description: "Grantable. The distinct users assigned as Bookers of the region (Capacity, Bookers), sorted by id. A deleted user is left out. An empty list when none. The substitute (`substitute_id`) is not returned."
          items:
            type: object
            properties:
              id:        { type: integer, example: 31 }
              full_name: { type: string, example: "Bo First" }
              assigned_at: { type: string, format: date-time, description: "When the user was assigned: the earliest creation time of the user's Booker rows on the region." }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }

    RegionPlan:
      type: object
      description: |
        The planned volume and reserve of one region on one calendar date. `source` is `update` (a saved plan for that weekday), `default` (derived from the pickups of the same weekday in the four latest full weeks before the date's week (before the current week for a future date); a week that holds New Year's Day, Memorial Day, Independence Day, Labor Day, Thanksgiving Day or Christmas Day is skipped and one more week back is taken) or `missing` (no plan and no pickup in those four weeks: the No volume set status).
      properties:
        region_id:    { type: integer }
        region_code:  { type: string, example: "IL-CHI" }
        date:         { type: string, format: date }
        weekday:      { type: integer, minimum: 1, maximum: 7, description: "ISO weekday of the date, 1 Monday to 7 Sunday." }
        plan:         { type: integer, description: "Sum of the plan_<group> columns." }
        reserve:      { type: integer, description: "Sum of the reserve_<group> columns." }
        plan_local: { type: integer, description: "Planned volume of the local fleet group. 0 when source is missing." }
        plan_short_haul: { type: integer, description: "Planned volume of the short_haul fleet group. 0 when source is missing." }
        plan_regional: { type: integer, description: "Planned volume of the regional fleet group. 0 when source is missing." }
        plan_otr: { type: integer, description: "Planned volume of the otr fleet group. 0 when source is missing." }
        plan_dedicated: { type: integer, description: "Planned volume of the dedicated fleet group. 0 when source is missing." }
        plan_flatbed: { type: integer, description: "Planned volume of the flatbed fleet group. 0 when source is missing." }
        reserve_local: { type: integer, description: "Reserve of the local fleet group, part of its plan. 0 unless source is update." }
        reserve_short_haul: { type: integer, description: "Reserve of the short_haul fleet group, part of its plan. 0 unless source is update." }
        reserve_regional: { type: integer, description: "Reserve of the regional fleet group, part of its plan. 0 unless source is update." }
        reserve_otr: { type: integer, description: "Reserve of the otr fleet group, part of its plan. 0 unless source is update." }
        reserve_dedicated: { type: integer, description: "Reserve of the dedicated fleet group, part of its plan. 0 unless source is update." }
        reserve_flatbed: { type: integer, description: "Reserve of the flatbed fleet group, part of its plan. 0 unless source is update." }
        source:       { type: string, enum: [default, update, missing] }
        default_plan: { type: integer, description: "Plan derived from the booking history of the date: the pickups of the same weekday in the four latest full weeks before the date's week (before the current week for a future date); a week that holds New Year's Day, Memorial Day, Independence Day, Labor Day, Thanksgiving Day or Christmas Day is skipped and one more week back is taken, averaged and rounded. A load whose first pickup stop holds a test driver (the Test Driver flag) is left out. Present also when source is update." }
        valid_from:   { type: [ string, 'null' ], format: date, description: "Start of the period of the winning plan. Null when no plan covers the date." }
        valid_to:     { type: [ string, 'null' ], format: date, description: "End of the period of the winning plan. Null when no plan covers the date." }
        saved_by:     { type: [ string, 'null' ], description: "Who saved the winning plan: a user name, or `<application name> - API` for a write through /region_plan_periods. Null when source is missing." }
        created_at:   { type: [ string, 'null' ], format: date-time, description: "Creation time of the winning plan. Null when no plan covers the date." }
        updated_at:   { type: [ string, 'null' ], format: date-time, description: "Update time of the winning plan. Does not move when a period is deleted or when a default plan changes. Null when no plan covers the date." }

    RegionPlanPeriod:
      type: object
      description: |
        The stored plan of one region over one period, as written by POST /region_plan_periods.
      properties:
        id:          { type: integer }
        region_id:   { type: integer }
        region_code: { type: string, example: "IL-CHI" }
        valid_from:  { type: string, format: date }
        valid_to:    { type: string, format: date }
        saved_at:    { type: string, format: date-time }
        days:
          type: array
          description: "One entry per weekday of the period that holds a plan, in weekday order."
          items:
            type: object
            properties:
              weekday: { type: integer, minimum: 1, maximum: 7 }
              plan:    { type: integer }
              reserve: { type: integer }
              plan_local: { type: integer }
              plan_short_haul: { type: integer }
              plan_regional: { type: integer }
              plan_otr: { type: integer }
              plan_dedicated: { type: integer }
              plan_flatbed: { type: integer }
              reserve_local: { type: integer }
              reserve_short_haul: { type: integer }
              reserve_regional: { type: integer }
              reserve_otr: { type: integer }
              reserve_dedicated: { type: integer }
              reserve_flatbed: { type: integer }

    RegionCapacity:
      type: object
      description: |
        The planned volume against the booked pickups of one region on one calendar date.
      properties:
        region_id:      { type: integer }
        region_code:    { type: string, example: "IL-CHI" }
        date:           { type: string, format: date }
        plan:           { type: integer, description: "Planned volume: the sum of the fleet group columns of /region_plans." }
        source:         { type: string, enum: [default, update, missing], description: "As on /region_plans. missing is the No volume set status." }
        booked_pickups: { type: integer, description: "Pickups booked in the region on the date. A load whose first pickup stop holds a test driver (the Test Driver flag) is left out." }
        remaining:      { type: integer, description: "plan minus booked_pickups, never below 0." }
        unassigned_drivers: { type: [ integer, 'null' ], description: "Optional - requires field grant. Active drivers of the account whose last free event (a delivered load or an ended off-duty event) lies in the region from the date that event ends until the day before their next load starts (the day their next off-duty event starts still counts), counted on each date from today to today plus the Capacity date range setting; null outside that range." }
        empty_drivers_now:  { type: [ integer, 'null' ], description: "Optional - requires field grant. Active drivers whose current Capacity board event is empty (a delivered load with a time out, or an ended off-duty event) in the region at the time of the request; on today's row only, null on every other row." }

    DriverCapacity:
      type: object
      description: |
        The drivers of one region on one calendar date, counted as the Capacity board counts them, for active drivers only; a driver with the Test Driver flag counts nowhere.
      properties:
        region_id:        { type: integer }
        region_code:      { type: string, example: "IL-CHI" }
        date:             { type: string, format: date }
        fleet_group:      { type: string, enum: [none, local, short_haul, regional, otr, dedicated, flatbed], description: "Grantable — requires field grant. The driver Fleet Group the counts cover; a driver with no Fleet Group counts under none. A grant splits the rows per fleet group." }
        total_drivers:    { type: integer, description: "Distinct drivers in the region on the date: with a stop there, available there, or whose time off starts there." }
        available_drivers: { type: integer, description: "Distinct drivers available in the region on the date by the Capacity board rule: after a load or a time off that ends on the date (placed by the ZIP prefix of its last stop or reset location; a time off not started at the time of the request, or with no reset ZIP, by the ZIP prefix of the last delivery or trailer drop of the driver before it starts, when he has one) with the Minimum Hours Gap Between Events free before the next load or time off, or, on today's date only, waiting there since a load or time off that ended before today." }
        landing_drivers_total: { type: integer, description: "Grantable — requires field grant. `landing_drivers_total` counts the active drivers, not Test Drivers, who land in the region on the date. A driver lands at the last delivery or trailer drop of each of his loads, placed by the first 3 digits of its ZIP code and dated as `loaded_drivers` is, on a load that is not canceled or TONU. A driver also lands at the end of a time off on the date, placed as for `available_drivers` (by the reset ZIP code, or by the last delivery or trailer drop of the driver before a time off that has not started at the time of the request or has no reset ZIP code). A last delivery or trailer drop is not a landing when a time off starts within the account Minimum Hours Gap Between Events after it with no stop of the driver between, or when it falls inside a time off; the driver then lands where the last of those time offs ends, a time off ending within the gap before another time off or inside another one counting the same way. A time off whose last stop of the driver before it is a pickup or trailer pickup is not a landing when that load delivers after the time off ends: the driver lands where that load delivers. A load that follows keeps the driver landing. A driver counts once per date, at his first landing of the date in any region, so a request filtered by region does not move him to a later landing; a landing with no ZIP code counts in no region. A pending home time request is not a time off." }
        off_duty_drivers: { type: integer, description: "Distinct drivers whose time off starts on the date, in the region of its reset ZIP code." }
        loaded_drivers:   { type: integer, description: "Distinct drivers with a delivery or trailer delivery stop in the region on the date." }
        unassigned_booked_delivery_loads: { type: [ integer, 'null' ], description: "Distinct loads in status booked with a delivery stop in the region on the date that has no driver. With the fleet_group grant it is null on every row but the none row." }

    DriverEta:
      type: object
      description: |
        The current ETA v2 simulation of one driver at one stop. Live data from the latest calculation, not stored.
      properties:
        driver_id:             { type: integer }
        destination_id:        { type: integer, description: "The stop." }
        load_id:               { type: [ integer, 'null' ] }
        gp_load:               { type: [ string, 'null' ], example: "2610-12653", description: "The load number." }
        eta:                   { type: [ string, 'null' ], format: date-time, description: "Simulated arrival at the stop (UTC)." }
        ete:                   { type: [ string, 'null' ], format: date-time, description: "Simulated end of the stop, after the loading or unloading time (UTC)." }
        distance:              { type: [ string, 'null' ], example: "358.223", description: "Miles of the leg from the previous point (the truck or the previous stop) to the stop. Decimal, returned as a string for precision." }
        shift_drive_remaining: { type: [ integer, 'null' ], description: "Driving time left in the shift at ete, in milliseconds." }
        shift_remaining:       { type: [ integer, 'null' ], description: "On-duty time left in the shift at ete, in milliseconds." }
        cycle_remaining:       { type: [ integer, 'null' ], description: "Time left in the cycle at ete, in milliseconds." }
        cycle_tomorrow:        { type: [ integer, 'null' ], description: "Time left in the cycle on the next day, as of ete, in milliseconds." }

    Meta:
      type: object
      required: [request_id, timestamp]
      properties:
        request_id:
          type: string
          description: "Unique identifier for this request. Include in support inquiries."
          example: "8f3a-c4e2-bb19-2f7d"
        timestamp:
          type: string
          format: date-time
          description: "Server timestamp (UTC)"

    PaginationMeta:
      type: object
      properties:
        page:     { type: integer, example: 1 }
        per_page: { type: integer, example: 25 }
        total:    { type: integer, example: 142 }

    Error:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          description: "Machine-readable top-level error code"
          enum:
            - unauthorized
            - forbidden
            - not_found
            - bad_request
            - link_expired
            - invalid_filter
            - invalid_sort
            - validation_error
            - rate_limited
            - internal_error
          example: invalid_filter
        message:
          type: string
          description: "Short human-readable summary. For per-field detail, see `details`."
          example: "Invalid filter parameters"
        details:
          type: array
          description: "Per-field error entries. Empty for errors without field context (auth, not-found, server-side)."
          items: { $ref: '#/components/schemas/ErrorDetail' }

    ErrorDetail:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: "The parameter or attribute that triggered this error"
          example: status
        code:
          type: string
          description: "Machine-readable per-field error code"
          enum:
            - unknown_field
            - invalid_value
            - unsupported_op
            - invalid_operator
            - missing_parameter
            - too_many_values
          example: invalid_value
        message:
          type: string
          description: "Human-readable description of this specific field error"
          example: "value 'banana' is not one of [booked, assigned, ...]"
        value:
          description: "The rejected value, when the error names one. Present on a write rejection and on the 422 of `GET /loads/{load_id}/full_pdf`."
          example: delivered

    ErrorResponse:
      description: "Failure response. `data` is null; `error` and `meta` are populated."
      type: object
      properties:
        data:
          type: 'null'
          example: null
          description: Always null on error responses.
        error: { $ref: '#/components/schemas/Error' }
        meta:  { $ref: '#/components/schemas/Meta' }

  headers:
    X-RateLimit-Limit:
      description: Requests allowed in the window with fewer requests left (the minute window of 12,000 or the hour window of 120,000). Not sent on a file download.
      schema: { type: integer }
    X-RateLimit-Remaining:
      description: Requests left in that window.
      schema: { type: integer }
    X-RateLimit-Reset:
      description: Epoch seconds when that window ends.
      schema: { type: integer }
  responses:
    BadRequest:
      description: Request was malformed or contained invalid parameters.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            invalid_filter_single:
              summary: Unknown filter value (single error)
              value:
                data: null
                error:
                  code: invalid_filter
                  message: "Invalid filter parameters"
                  details:
                    - field: status
                      code: invalid_value
                      message: "value 'banana' is not one of [booked, assigned, ...]"
                meta:
                  request_id: "8f3a-c4e2-bb19-2f7d"
                  timestamp: "2026-04-14T12:00:00Z"
            invalid_filter_multiple:
              summary: Multiple filter errors in one response
              value:
                data: null
                error:
                  code: invalid_filter
                  message: "Invalid filter parameters"
                  details:
                    - field: status
                      code: invalid_value
                      message: "value 'banana' is not one of [booked, assigned, ...]"
                    - field: total
                      code: unsupported_op
                      message: "does not support multiple values"
                meta:
                  request_id: "8f3a-c4e2-bb19-2f7d"
                  timestamp: "2026-04-14T12:00:00Z"
            ungranted_filter_field:
              summary: Filter on a field your application cannot see
              value:
                data: null
                error:
                  code: invalid_filter
                  message: "Invalid filter parameters"
                  details:
                    - field: linehaul_rate
                      code: unknown_field
                      message: "unknown filter field"
                meta:
                  request_id: "8f3a-c4e2-bb19-2f7d"
                  timestamp: "2026-04-14T12:00:00Z"
            invalid_sort:
              summary: Unknown sort field
              value:
                data: null
                error:
                  code: invalid_sort
                  message: "Invalid sort parameter"
                  details:
                    - field: foo
                      code: unknown_field
                      message: "unknown sort field"
                meta:
                  request_id: "8f3a-c4e2-bb19-2f7d"
                  timestamp: "2026-04-14T12:00:00Z"

    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            data: null
            error:
              code: unauthorized
              message: "Invalid credentials"
              details: []
            meta:
              request_id: "8f3a-c4e2-bb19-2f7d"
              timestamp: "2026-04-14T12:00:00Z"

    Forbidden:
      description: Your application does not have permission for this endpoint.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            data: null
            error:
              code: forbidden
              message: "You do not have permission to access this endpoint"
              details: []
            meta:
              request_id: "8f3a-c4e2-bb19-2f7d"
              timestamp: "2026-04-14T12:00:00Z"

    LinkExpired:
      description: The file link has expired. Read the parent resource again for a fresh one.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            data: null
            error:
              code: link_expired
              message: "File link expired, read the resource again for a new link"
              details: []
            meta:
              request_id: "8f3a-c4e2-bb19-2f7d"
              timestamp: "2026-04-14T12:00:00Z"

    RateLimited:
      description: Too many requests. Either the application used its 12,000 requests a minute or 120,000 requests an hour, or a file link was fetched too often (2 per document and 30 per application in one minute; fetch each file once and keep it). Wait for `Retry-After` seconds, then try again.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before the next request. 60 for a file fetch, else the seconds until the exceeded window ends.
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            data: null
            error:
              code: rate_limited
              message: "File fetch limit reached: 2 per document per minute"
              details: []
            meta:
              request_id: "8f3a-c4e2-bb19-2f7d"
              timestamp: "2026-04-14T12:00:00Z"

    NotFound:
      description: The resource does not exist or is not accessible to this account.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            data: null
            error:
              code: not_found
              message: "Resource not found"
              details: []
            meta:
              request_id: "8f3a-c4e2-bb19-2f7d"
              timestamp: "2026-04-14T12:00:00Z"

    UnprocessableEntity:
      description: Request was well-formed but failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            data: null
            error:
              code: validation_error
              message: "Validation failed"
              details:
                - field: content
                  code: invalid_value
                  message: "can't be blank"
            meta:
              request_id: "8f3a-c4e2-bb19-2f7d"
              timestamp: "2026-04-14T12:00:00Z"

