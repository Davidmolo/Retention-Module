        A load with no generated estimate returns `status`, `sub_status`, `mileage_version`, `estimated_fuel_surcharge`, `estimated_miles` and both variance fields as `null`; `fuel_surcharge` and `miles` come from the load and keep their values.

        `mileage_version` names the matrix engine version behind the estimate's miles: the Trimble version when the method reads Trimble miles, the Mile Maker version when it reads Mile Maker miles, `null` for every other miles source (including a Breakthrough method).

        `fuel_surcharge_variance_percent` and `miles_variance_percent` compare the estimate against the load's own fuel surcharge and miles; both are `null` unless `status` is `processed`.

        No sort field is accepted. The order is `first_pu_time_from` descending, nulls last.
