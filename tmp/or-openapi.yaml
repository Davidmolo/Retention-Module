openapi: 3.1.0

info:
  title: OpenRoad TMS External API
  version: '1.0'
  description: |
    REST API for integrating with the OpenRoad TMS platform.

    For AI-assisted integration, see [/llms.txt](/llms.txt) (short summary) or [/llms-full.txt](/llms-full.txt) (full LLM-friendly reference). For integration best practices (auth rotation, retry policy, observability, versioning), see the "Integration best practices" section in /llms-full.txt.

    ## Authentication
    HTTP Basic Auth with your application's client ID and secret. Secrets can be rotated at any time; rotations include a 24-hour grace period during which both the old and new secrets remain valid, so you can roll over your integration without downtime.

    ## Attribution
    The audit of every write is attributed to your application name followed by ` - API`, and so are `changed_by` and the `author` of a load, driver, truck, trailer or accident note. A safety note and the Billing Hold load log show SYSTEM.

    ## Response envelope
    Every response uses the same three-field envelope (data, error, meta). Successful responses populate data and meta with error set to null. Failed responses populate error and meta with data set to null. The meta object always includes a unique request_id (include this when contacting support) and a server timestamp in UTC.

    Errors always include a `details` array. For errors with per-field context (filter validation, record validation, missing parameters), each entry is `{field, code, message}` so clients can parse without regex. For errors without field context (auth, not-found, server-side), `details` is an empty array — always present, never omitted, so one parsing path fits every error.

    ## Filtering, sorting, pagination
    Collection endpoints support consistent query syntax:

    | Feature | Syntax | Example |
    |---------|--------|---------|
    | Equality filter | `?field=value` | `?status=delivered` |
    | Multi-value filter (OR) | `?field[]=a&field[]=b` | `?status[]=delivered&status[]=billed` |
    | Range filter | `?field[op]=value` | `?total[gte]=1000&total[lt]=5000` |
    | Sort ascending | `?sort=field` | `?sort=created_at` |
    | Sort descending | `?sort=-field` | `?sort=-created_at` |
    | Pagination | `?page=N&per_page=M` | `?page=2&per_page=50` (max 100) |

    Supported range operators: gte (≥), gt (>), lte (≤), lt (<). Each endpoint documents which fields accept which operators.

    Any parameter whose description says "Multi-value supported" accepts the bracket syntax shown above (`?field[]=a&field[]=b`). The non-bracketed repeated form (`?field=a&field=b`) is **not** parsed as multi-value — only the last value is used.

    Multi-value filters (including bulk ID lookups via `?id[]=`) cap at 100 values per request. Larger requests return `400 invalid_filter` with `details[].code: too_many_values`. Chunk in batches of 100 for FK resolution patterns — see the **Performance & batching** section in [/llms-full.txt](/llms-full.txt) for the canonical recipe.

    Note for OpenAPI client-codegen consumers: standard array serialization (`style: form, explode: true`) generates the non-bracketed form, which the server treats as last-wins. Multi-value query params are documented as scalar in this spec; partners using generated clients need to send the bracket form manually for multi-value calls.

    ## Request body conventions

    All write endpoints (`POST`, `PATCH`) wrap request bodies under a singular resource key:

    | Endpoint | Wrapper | Example |
    |----------|---------|---------|
    | `POST /loads/:id/notes`, `/drivers/:id/notes`, `/trucks/:id/notes`, `/trailers/:id/notes` | `note` | `{"note": {"content": "..."}}` |
    | `PATCH /trucks/:id` | `truck` | `{"truck": {"oos": true, "oos_note": "..."}}` |
    | `PATCH /trailers/:id` | `trailer` | `{"trailer": {"needs_repair": false}}` |

    Always send the wrapper. A form body without it returns `400 bad_request`; a JSON body without it is wrapped by the server when its keys are fields of the resource.

    ## Embedded summaries

    Some endpoints embed fixed-shape projections of related entities to enable single-roundtrip rendering of joined data. `/loads` embeds its `destinations` and its grantable `charges_breakdown`. A reference to another resource is an id, such as `driver_id` or `truck_id`: read the record on its own endpoint. See [/llms-full.txt](/llms-full.txt) for the full pattern.

    ## Rate limiting

    Every authenticated request of `/api/ext/v1` counts against two fixed windows of the application, 12,000 requests a minute and 120,000 requests an hour. Each response carries `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset` (epoch seconds when the window ends) of the window with fewer requests left. A request over a limit is answered with `429 rate_limited` and `Retry-After` (seconds until that window ends). The file downloads keep their own limit (the `file` link of a document, a driver document, a fuel surcharge matrix, a driver pay statement, a load invoice and a load Full PDF; the driver photo link is not limited): at most 2 downloads of the same document and at most 30 downloads of any document per application in one minute, answered with `429 rate_limited` and `Retry-After: 60`, and they carry no `X-RateLimit-*` header. Partners should implement exponential backoff and respect `Retry-After` headers on every endpoint.

    ## Request rules

    Follow these three rules. A client that breaks them slows OpenRoad TMS for every user.

    1. **Ask for many records in one request, not one request per record.** A multi-value filter takes up to 100 values, and a page holds up to 100 rows. Send `GET /api/ext/v1/destinations?trailer_id[]=101&trailer_id[]=102&...&per_page=100`, not a separate call for each trailer.
    2. **After the first full load, fetch only what changed.** Save the time of your last sync. Next time, ask for `updated_at[gte]=<last sync time>&sort=updated_at`, for example `GET /api/ext/v1/destinations?updated_at[gte]=2026-09-29T14:00:00Z&sort=updated_at`. The data changes over minutes, not seconds, so poll every 5 to 15 minutes. Do not poll in a tight loop.
    3. **Always limit the time range, and send one request at a time.** Add a date filter such as `app_date[gte]=2026-09-22`, so old history is not read again on every call. Wait for each page before you ask for the next one, and never fire pages or requests in parallel. Stop when a page returns fewer rows than `per_page`.

    ## Data types

    Timestamps are UTC ISO 8601 (`2026-04-14T12:00:00Z`). Money and miles fields use decimal-precision strings (e.g. `"1234.56"`) to preserve arbitrary precision — see each field's type below. When a nullable field is included in the response, a null value is rendered as `null`, never omitted (ungranted grantable fields are a separate case — omitted entirely; see field visibility).

    ## Error codes

    Top-level `error.code` values (machine-readable category):

    | Code | HTTP | When it happens |
    |------|------|-----------------|
    | `unauthorized` | 401 | Missing or invalid credentials |
    | `forbidden` | 403 | Endpoint not granted to your application |
    | `not_found` | 404 | Resource does not exist or is not accessible to your account |
    | `link_expired` | 410 | A file link has expired. Read the parent resource again for a fresh link |
    | `bad_request` | 400 | Required parameter missing or malformed |
    | `invalid_filter` | 400 | One or more filter parameters are invalid (see `error.details`) |
    | `invalid_sort` | 400 | Sort field is not allowed for this endpoint (see `error.details`) |
    | `validation_error` | 422 | Input failed validation (see `error.details`) |
    | `rate_limited` | 429 | Request rate exceeded — back off per `Retry-After` header |
    | `internal_error` | 500 | Server-side fault — report the `request_id` from response meta |

    Per-detail `error.details[].code` values (what's wrong with a specific field):

    | Code | Meaning |
    |------|---------|
    | `unknown_field` | Field is not recognized for this operation. May mean the field does not exist, or exists but your application has not been granted access — the API does not distinguish between these to prevent schema enumeration. |
    | `invalid_value` | Value failed validation (wrong type, not in allowed set, or malformed) |
    | `unsupported_op` | Operator is not supported for this field (e.g., range operator on a non-range field, multi-value syntax on a non-multi field) |
    | `invalid_operator` | Range operator is not one of `gt`, `gte`, `lt`, `lte` |
    | `missing_parameter` | A required parameter was not provided |
    | `too_many_values` | Multi-value filter exceeded the per-request cap (max 100 values, e.g. `?id[]=` for bulk lookups) |

servers:
  - url: /api/ext/v1
    description: Current environment

security:
  - basicAuth: []

tags:
  # Top-level resources are alphabetical for predictable sidebar ordering.
  # Sub-resources (notes, documents) follow their parent immediately. Health
  # sits at the end as the utility/diagnostic endpoint, separated from
  # business resources.
  - name: Accidents
    description: |
      Accident and claim records with equipment, driver, and claim cost data. Claim cost fields (line item lists, totals, total loss values) and equipment identifiers (VIN, license plate) are grantable.
  - name: Accident Documents
    description: |
      List and retrieve documents (dashcam video, photos, police reports, claim PDFs) attached to an accident. When granted, each document carries a `url` link and its `url_expires_at`. The resource is read-only, so it exposes no upload.
  - name: Accident Notes
    description: List, retrieve, and create notes attached to accidents.
  - name: Assignments
    description: List the rows of the truck and trailer Assignments tab. Driver rows are on /assignments (current by default, every row with include_history=true), trailer location rows on /trailer_locations (an update sets Empty / Loaded on the current row).
  - name: Places
    description: |
      Places of the account, as the Places page shows them: the name, the address, the point, the tags and the trailer yard flag. The list holds primary places only; a merged place is reachable by `GET /places/{id}` and names its target in `merged_to_id`. `tracking_area` (GeoJSON) is grantable. An update edits a place as the Places page form does and is logged in the place history as "<application name> - API". Contacts are not stored, so the resource has none.
  - name: Place Informations
    description: |
      The per-customer information of a place: opening hours, flags and special instructions, one row per place and customer. `special_instructions`, `high_value` and `bol_skip` are grantable. The rows of a merged place are absent.
  - name: Availability Events
    description: List driver availability windows (off-duty, planned, hometime, loaded).
  - name: Lane Bids
    description: |
      Sales lane bids of the account, one row per lane of a customer bid, as the Sales Bids page shows them. A bid holds the lane, its three bid rounds, the pre-award and the award. The default fields are the lane, the stage and the award flags; `total_volume` and `award_volume` are default fields; the rates, the rounds, `bid_volume` and the 16 monthly and period volume keys are grantable. A deleted bid is absent. A bid that is deleted after a client stored it no longer appears in any read, so an incremental client re-reads the window it needs to reconcile.
  - name: Award Lanes
    description: |
      Awarded contract lanes of customer bids, as the Lane Rates tab and the Lane Dashboard show them. A lane holds the pickup and delivery ZIP prefix, the validity window, the award rates and the commitment progress. Award rates, the calculated RPM, the latest rates and `volume_stats` are grantable. A deleted lane, and every lane of a deleted bid, is absent.
  - name: Award Lane Notes
    description: List and retrieve the notes of an award lane. The list holds the notes of the lane and the notes of its parent bid, as the lane card shows them. It holds no note of a sibling lane.
  - name: Billing Settings
    description: List and retrieve billing profile templates referenced by customers.
  - name: Compensations
    description: |
      Driver pay structures and rates. The endpoint itself requires explicit grant; rate, percentage, flat, and bonus fields require additional field grants on top of the endpoint grant.
  - name: Customers
    description: List and retrieve customers (shippers, brokers, 3PLs) booked on loads.
  - name: Customer Documents
    description: List, retrieve, and upload (multipart) documents attached to a customer profile.
  - name: Customer Notes
    description: List and retrieve the notes of a customer, from the Notes box and the Customer Service Notes box. Read-only.
  - name: Customer Detention Info
    description: Retrieve aggregated detention totals for a customer over a `from..to` window. Returns one record, not a list.
  - name: Destinations
    description: List and retrieve load stops across the account. Also nested under /loads.
  - name: Driver Routes
    description: List and retrieve planned route legs per driver on a load. Each leg holds the planned loaded and empty miles.
  - name: Driver Route State Reports
    description: List and retrieve saved miles per US state for one driver route.
  - name: Detentions
    description: List and retrieve detention events at destinations.
  - name: Drivers
    description: List and retrieve driver identity, status, and employment details.
  - name: Driver Notes
    description: List, retrieve, and create notes attached to drivers.
  - name: Driver Safety Notes
    description: |
      List, retrieve, create, and update safety notes on a driver profile. Safety Notes and Driver Notes are separate records in separate tables. `/drivers/{driver_id}/notes` returns the free-form notes of the driver profile, and it does not return a Safety Note created since February 2026. The safety notes that the profile held before that date were copied into the Safety Notes table, and their original rows stay on the Driver Notes endpoint. A client that reads both endpoints sees those older notes twice.
  - name: Driver Documents
    description: List, retrieve, and upload (multipart) documents attached to a driver profile.
  - name: Driver Change Logs
    description: |
      List and retrieve the change history of a driver profile, and of the documents and notes attached to it. Narrower than the Change Logs tab in the web UI: a field appears only when your application can already read that field on the resource that owns it (the driver, a driver document, or a driver note).
  - name: Load Change Logs
    description: |
      List and retrieve the change history of a load, of its stops, and of the notes and documents attached to it. A field appears only when your application can already read that field on the resource that owns it (the load, a stop, a load note or a load document).
  - name: Load Mobile Change Logs
    description: |
      List the changes that the drivers of a load made from the mobile app, to the load and to its documents.
  - name: Driver Pay Statements
    description: |
      List and retrieve driver pay statements, one per driver and pay period, with the totals, the paid miles and the line items of each. A locked statement also carries its PDF as a `url` link.
  - name: Driver Earnings Summaries
    description: |
      One row per driver with the earnings and the paid miles of the last week, the last 28 days and the year to date.
  - name: Driver OTD Summaries
    description: |
      One row per driver with the on-time delivery percentage (OTD %) over a date range that the client sends.
  - name: Elite Scores
    description: |
      Driver performance score snapshots over time periods. Each snapshot has a headline `score` and a set of grantable component sub-scores.
  - name: Load Scores
    description: |
      Load Score: the schedule score of each load (0-100, grade, can it run on time). `/load_scores` returns one row per load, the current predicted score beside the current actual score. `/load_score_snapshots` returns every version of both kinds. An account without the Load Score feature gets an empty list (and 404 on show).
  - name: Employees
    description: |
      Back-office staff referenced by FKs (e.g. `capacity_manager_id` on Customer). Minimal resolver shape — sensitive HR data (SSN, banking, emergency contacts) is never exposed.
  - name: Fuel Price Data
    description: |
      Weekly DOE (EIA) retail diesel price per US area. Global reference data, identical for every account — not a per-account fuel purchase record.
  - name: Fuel Card Transactions
    description: |
      The fuel card purchases of the account, one row per fuel purchase. The endpoint serves the live rows: deleted and cancelled rows are left out. Money columns are decimal strings. The card and every money column are grantable.
  - name: Fuel Surcharge Matrices
    description: |
      The per-customer fuel surcharge matrix: the price bands (`rows`) and the uploaded original file. The matrix in effect for a load is the one with the latest `start_date` on or before the load date. The fuel price is read `fuel_price_offset_days` days earlier than that date. A band matches when `from <= price <= to`. `rows` and the file link are grantable.
  - name: Fuel Surcharge Methods
    description: |
      How a customer's fuel surcharge is generated: a `matrix` or a `breakthrough` method, one per `load_type`. A method has no start date, so filter it by `customer_id`, `load_type` and `created_at` or `updated_at`.
  - name: Customer Fuel Surcharge Settings
    description: |
      The fuel surcharge switches of each customer, one row per customer with the customer id as `id`: the estimate switch, the automatic fuel surcharge and linehaul settings, and the Breakthrough integration settings. A customer with no saved settings returns the defaults.
  - name: Fuel Surcharge Estimates
    description: |
      The fuel surcharge estimate of each load versus the load's own fuel surcharge, one row per load. A load with no estimate returns `status`, `sub_status`, `mileage_version`, `estimated_fuel_surcharge`, `estimated_miles` and both variance fields as `null`. `fuel_surcharge` and `miles` come from the load and keep their values. The load's own values, the variance percent fields and the estimate amount/miles fields are grantable.
  - name: Gps Logs
    description: |
      Truck or trailer GPS positions from the telematics devices, one row per position report. Requires `vehicle_type` (`Truck` or `Trailer`) and `vehicle_id`. One request covers any `created_at` span of up to 7 days, at any date.
  - name: HOS Logs
    description: |
      Hours-of-service clock samples per driver, one every 3 minutes, with the active load and its status at that moment. Durations are milliseconds. Compare consecutive samples of one driver to derive a load status change.
  - name: IFTA Quarters
    description: |
      IFTA filing quarters with the published per-jurisdiction tax rate and surcharge tables.
  - name: Loads
    description: List and retrieve loads with their destinations.
  - name: Load Notes
    description: List, retrieve, and create notes attached to loads.
  - name: Load Documents
    description: |
      Documents of the load Documents section (rate confirmation, POD, Bill of Lading, lumper receipt, scale ticket, other) and the driver's miscellaneous upload. List, retrieve and upload.
  - name: Load Financials
    description: |
      Money view of a load: load money fields, additional charges and driver accessorial pay with the payroll week that paid each accessorial. Every money field is grantable.
  - name: Load Billing Statuses
    description: |
      Write the billing status of a load: Pending to Bill, Billed-Pending Accessorials, Billed, Paid or Open Balance.
  - name: Load Flags
    description: |
      Customer service flags on a load: pre-loaded trailer, on hold, unscheduled, CS done, Billing Hold.
  - name: Regions
    description: |
      Regions of the account with their zip prefixes. Use a region `code` to read the plan, the capacity and the stops of that region.
  - name: Region Plans
    description: |
      The planned pickup volume and reserve per region and calendar date, resolved as the Capacity board shows it. A date with no plan answers source `missing`, the No volume set status.
  - name: Region Plan Periods
    description: |
      Write-only. Saves the planned volume and reserve of one region over one period, by weekday. Read the result back through `/region_plans`.
  - name: Region Capacities
    description: |
      The planned pickup volume against the booked pickups per region and calendar date.
  - name: Driver Capacities
    description: |
      The drivers per region and calendar date, counted as the Capacity board counts them. A driver is available on a date after a load or a time off that ends on it: a load ends at its last stop, whatever the stop type, and is placed by the first 3 digits of that stop's ZIP code, a time off ends at its reset location and is placed by the first 3 digits of the reset ZIP code, except that a time off that has not started at the time of the request, or that has no reset ZIP code, is placed by the first 3 digits of the ZIP code of the last delivery or trailer drop of the driver before it starts, when he has one. The driver needs at least the account setting Minimum Hours Gap Between Events (8 when unset) free before his next load or time off, plus the Minimum Hours After Delivery when the last stop has no Time Out; on today and later dates the gap also counts from now, as on the Capacity board. A free driver stays available in the region of his last load or time off that ended before today only on today's date. A time off counts in off_duty_drivers on its start date, in the region of its reset ZIP, and on the covered dates in no field; a time off starting on a date never makes the driver available. A pending home time request is not a time off. A stop with no ZIP code, and a time off with no reset ZIP code and no such delivery, is placed in no region, and coordinates are never used. Only drivers with status active count; a driver with status suspended, suspended_new or pre_hired, and a driver with the Test Driver flag, count nowhere. A canceled or TONU load counts as it does on the Capacity board.
  - name: Driver ETAs
    description: |
      The current ETA v2 simulation per driver and stop, with the HOS time left. Live data, not stored.
  - name: Service Failures
    description: |
      Service failure reasons of stops: the reason, the accountable driver, the preventability and the user who logged it.
  - name: Load Invoices
    description: |
      The customer invoice PDF of a load from Exported onward, rendered on request as the Invoice button of the load page renders it.
  - name: Load Gross Profit
    description: |
      The estimated gross profit of one load, the figure the Load view shows.
  - name: Load Full PDF
    description: |
      The Full PDF of one load, the invoice plus the confirmed POD, rendered on request as the Full PDF button of the load page renders it.
  - name: Driver Stats
    description: |
      Gross profit per driver for this week, last week and the average of the last 4, 8, 13, 26 and 52 weeks.
  - name: Rehire Eligibilities
    description: |
      Rehire eligibility assessments per driver: operations, safety and human resources verdicts. A driver with no row has no per-department answers; the driver field `eligible_for_rehire` holds the overall answer.
  - name: Driver Feedbacks
    description: |
      Driver satisfaction survey responses and their optional follow-up answers.
  - name: Vendors
    description: |
      Vendors drivers drive as (owner-operator, carrier, equipment, company driver, maintenance vendor). Resolve a driver's `vendor_id` here to read `driving_as`.
  - name: Payroll Schedules
    description: |
      Pay-cadence reference data used by drivers. Small set of records per account; partners typically fetch once and cache.
  - name: Trailers
    description: List and retrieve fleet trailer details.
  - name: Trailer Notes
    description: List, retrieve, and create notes attached to trailers.
  - name: Trailer Yards
    description: Trailer yards with the pool size and the trailers at the yard now.
  - name: Trailer Documents
    description: List, retrieve, and upload (multipart) documents attached to a trailer.
  - name: Trucks
    description: List and retrieve fleet truck details.
  - name: Truck Notes
    description: List, retrieve, and create notes attached to trucks.
  - name: Truck Documents
    description: List, retrieve, and upload (multipart) documents attached to a truck.
  - name: Users
    description: |
      Users in the account, referenced by other resources via FKs (managers, sales reps, planners, etc.). MobileUser (driver mobile-app login) accounts are excluded; back-office staff appear here only when they have a User record — use `/employees` to resolve `capacity_manager_id` and similar.
  - name: File Links
    description: |
      The redirect targets of the `url` of a document or a driver, and the PDF targets of the `url` of a pay statement, a load invoice or a load Full PDF. Token-authenticated, so they take no `Authorization` header and embed directly in an `<img>`, `<video>` or `<iframe>`. Treat the link as opaque and fetch it as given.
  - name: Health
    description: Service health check (unauthenticated).

paths:
  /loads:
    get:
      tags: [Loads]
      summary: List loads
      description: |
        Returns a paginated, sortable, filterable list of loads scoped to the authenticated application's account.

        Filter syntax: single value `?status=delivered`, multiple values `?status[]=delivered&status[]=billed`, range `?total[gte]=1000&total[lt]=5000`. Sort with `?sort=field` or `?sort=-field` for descending.
      operationId: listLoads
      parameters:
        - name: id
          in: query
          description: Bulk lookup. `?id[]=1&id[]=2` returns only loads matching those IDs.
          schema: { type: integer }
        - name: page
          in: query
          description: Page number (1-indexed)
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          description: Results per page (capped at 100)
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          description: Sort field. Prefix with `-` for descending.
          schema:
            type: string
            enum: [created_at, updated_at, status, first_pu_time_from, last_del_time_to,
                   '-created_at', '-updated_at', '-status', '-first_pu_time_from', '-last_del_time_to']
        - name: status
          in: query
          description: Filter by status. Use `?status[]=a&status[]=b` for multiple values (OR).
          schema:
            type: string
            enum: [booked, assigned, en_route_to_shipper, at_shipper, picked_up, delayed, en_route_to_consignee, at_consignee, delivered, delivered_pending, exported, missing_paperwork, billed_pending, billed, billed_pending_acc, closed, open_balance, canceled, tonu]
        - name: customer_id
          in: query
          description: Filter by customer ID. Use `?customer_id[]=1&customer_id[]=2` for multiple values.
          schema: { type: integer }
        - name: customer_load
          in: query
          description: Filter by the customer's load reference number, an exact match. Use `?customer_load[]=A1&customer_load[]=B2` for multiple values.
          schema: { type: string }
        - name: user_id
          in: query
          description: Filter by load creator (implicit sales rep). Multi-value supported.
          schema: { type: integer }
        - name: account_manager_id
          in: query
          description: Filter by account manager User ID. Multi-value supported.
          schema: { type: integer }
        - name: csr_manager_id
          in: query
          description: Filter by customer-service-rep manager User ID. Multi-value supported.
          schema: { type: integer }
        - name: planner_manager_id
          in: query
          description: Filter by planner manager User ID. Multi-value supported.
          schema: { type: integer }
        - name: hot
          in: query
          description: Filter by hot flag (`?hot=true`).
          schema: { type: boolean }
        - name: high_value
          in: query
          description: Filter by high-value flag.
          schema: { type: boolean }
        - name: short_haul
          in: query
          description: Filter by short-haul flag (load-level "local" indicator).
          schema: { type: boolean }
        - name: flatbed
          in: query
          description: Filter by flatbed flag.
          schema: { type: boolean }
        - name: edi_load
          in: query
          description: Filter by EDI-tendered loads.
          schema: { type: boolean }
        - name: edi_accepted
          in: query
          description: Filter by EDI-accepted loads (only meaningful when `edi_load=true`).
          schema: { type: boolean }
        - name: award_lane_id
          in: query
          description: Filter by the matched award lane. Multi-value supported.
          schema: { type: integer }
        - name: ignore_trailer_board
          in: query
          description: Filter by the Ignore Trailer Board flag. Requires `ignore_trailer_board` field grant.
          schema: { type: boolean }
        - name: predelivered
          in: query
          description: Filter by the Predelivered flag. Requires `predelivered` field grant.
          schema: { type: boolean }
        - name: alcohol_shipment
          in: query
          description: Filter by the Alcohol Shipment flag. Requires `alcohol_shipment` field grant.
          schema: { type: boolean }
        - name: sealed
          in: query
          description: Filter by the Sealed flag. Requires `sealed` field grant.
          schema: { type: boolean }
        - name: last_mile
          in: query
          description: Filter by the Last Mile flag. Requires `last_mile` field grant.
          schema: { type: boolean }
        - name: re_power
          in: query
          description: Filter by the Re-Power flag. Requires `re_power` field grant.
          schema: { type: boolean }
        - name: scale_required
          in: query
          description: Filter by the Scale Required flag. Requires `scale_required` field grant.
          schema: { type: boolean }
        - name: ad_hoc
          in: query
          description: Filter by the Ad Hoc flag. Requires `ad_hoc` field grant.
          schema: { type: boolean }
        - name: regional
          in: query
          description: Filter by the Regional flag. Requires `regional` field grant.
          schema: { type: boolean }
        - name: pff
          in: query
          description: Filter by the PFF flag. Requires `pff` field grant.
          schema: { type: boolean }
        - name: bol_skip
          in: query
          description: Filter by the BOL Skip flag. Requires `bol_skip` field grant.
          schema: { type: boolean }
        - name: rescheduled
          in: query
          description: Filter by the Rescheduled flag. Requires `rescheduled` field grant.
          schema: { type: boolean }
        - name: pod_uploaded
          in: query
          description: Filter by a live Bill of Lading (POD) upload that is not rejected, as in the `pod_uploaded` field. Requires `pod_uploaded` field grant.
          schema: { type: boolean }
        - name: billing_hold
          in: query
          description: Filter by the Billing Hold flag of the load itself, not the customer setting. A load with no flag row reads false. Requires the `billing_hold` field grant of `load_flags`.
          schema: { type: boolean }
        - name: driver_id
          in: query
          description: Loads that have a live stop of this driver, returned once however many stops match. Multi-value supported. `?driver_id[not][]=5` returns the loads with no stop of that driver, loads with no driver included. Do not mix `driver_id[]` and `driver_id[not][]` in one request.
          schema: { type: integer }
        - name: billing_preference
          in: query
          description: Filter by the billing preference of the customer. Multi-value supported. Requires the `billing_preference` field grant of `customers`.
          schema: { type: string, enum: [original, fax, email, epay, website, manual, edi, transflo, rydershare, cass, new_profile, syncada, transplace] }
        - name: billing_setting_id
          in: query
          description: Filter by the billing profile (BillingSetting) ID of the customer. Multi-value supported. Requires the `billing_setting_id` field grant of `customers`.
          schema: { type: integer }
        - name: fsc_applies
          in: query
          description: Filter by the fuel surcharge flag of the customer.
          schema: { type: boolean }
        - name: customer_type
          in: query
          description: Filter by the type of the customer. Multi-value supported.
          schema: { type: string, enum: [3pl, broker, direct] }
        - name: billing_specialist_ids
          in: query
          description: Loads of customers that have this billing specialist, by User ID. One value. Requires the `billing_specialist_ids` field grant of `customers`.
          schema: { type: integer }
        - name: detention_specialist_ids
          in: query
          description: Loads of customers that have this detention specialist, by User ID. One value. Requires the `detention_specialist_ids` field grant of `customers`.
          schema: { type: integer }
        - name: ap_email
          in: query
          description: true returns the loads of customers with at least one non-blank AP email address, false the others. Requires the `ap_email` field grant of `customers`.
          schema: { type: boolean }
        - name: miles
          in: query
          description: |
            Filter by miles. Accepts exact match or range. Range operators: `gte`, `gt`, `lte`, `lt`.
          schema: { type: number }
        - name: empty_miles_sum
          in: query
          description: |
            Filter by empty (deadhead) miles sum. Accepts exact match or range. Range operators: `gte`, `gt`, `lte`, `lt`.
          schema: { type: number }
        - name: first_pu_time_from
          in: query
          description: Filter by first pickup window start. Accepts range — `?first_pu_time_from[gte]=2026-04-01`.
          schema: { type: string, format: date-time }
        - name: last_del_time_to
          in: query
          description: Filter by last delivery window end. Accepts range — `?last_del_time_to[lt]=2026-05-01`.
          schema: { type: string, format: date-time }
        - name: created_at
          in: query
          description: Filter by created_at. Accepts range.
          schema: { type: string, format: date-time }
        - name: updated_at
          in: query
          description: Filter by updated_at. Accepts range.
          schema: { type: string, format: date-time }
      responses:
