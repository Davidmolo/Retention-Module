  /lane_bids:
    get:
      tags: [Lane Bids]
      summary: List lane bids
      description: |
        Returns a paginated list of the Sales lane bids of the account, newest first by default. A deleted bid is not returned. A bid that is deleted after a client stored it no longer appears in any read, so an incremental client re-reads the window it needs to reconcile.

        `/lane_bids` `status` is the stored bid stage (`initial`, `active`, `finalization`, `award`), while `/award_lanes` `status` is the computed validity state (`active`, `future`, `expired`). The two resources join by `aggregated_sales_lane_bid_id` on `/award_lanes`, which is the `id` of `/lane_bids`.

        `award` can be null on a stored bid, and `award=false` does not match null.
      operationId: listLaneBids
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [validity_date_from, validity_date_to, created_at, updated_at, '-validity_date_from', '-validity_date_to', '-created_at', '-updated_at']
        - name: id
          in: query
          description: Filter by bid id. Multi-value supported.
          schema: { type: integer }
        - name: customer_id
          in: query
          description: Filter by customer. Multi-value supported.
          schema: { type: integer }
        - name: customer_bid_id
          in: query
          description: Filter by the customer's bid id. Multi-value supported.
          schema: { type: string }
        - name: customer_lane_id
          in: query
          description: Filter by the customer's lane id. Multi-value supported.
          schema: { type: string }
        - name: status
          in: query
          description: Filter by the stored bid stage. Multi-value supported. Any other value answers 400.
          schema: { type: string, enum: [initial, active, finalization, award] }
        - name: award
          in: query
          description: Filter by the award flag. `award=false` does not match a bid whose `award` is null.
          schema: { type: string, enum: ['true', 'false'] }
        - name: validity_date_from
          in: query
          description: Filter by the first day of the bid validity. Accepts range, for example `?validity_date_from[gte]=2026-01-01`.
          schema: { type: string, format: date }
        - name: validity_date_to
          in: query
          description: Filter by the last day of the bid validity. Accepts range, for example `?validity_date_to[lte]=2026-12-31`.
          schema: { type: string, format: date }
        - name: created_at
          in: query
          description: Filter by creation time. Accepts range, for example `?created_at[gte]=2026-01-01T00:00:00Z`.
          schema: { type: string, format: date-time }
        - name: updated_at
          in: query
          description: Filter by update time. Accepts range, for example `?updated_at[gte]=2026-01-01T00:00:00Z`.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LaneBid' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Lane Bids]
      summary: Create or update the Sales lane bids of one customer
      description: |
        Writes the lanes of one customer in one request, as one Sales bid template upload does. All or nothing: one invalid lane rejects the whole request and writes nothing, and the 422 lists each error by lane position and field (`lanes[1].pu_city`). A request holds 1 to 500 lanes.

        A lane with the same customer, validity dates, pick-up and delivery city, state, ZIP and ZIP range, trailer type and `customer_lane_id` (a blank id counts as none) as a stored bid updates that bid. Any other lane creates a bid. The response lists the bid `id` and `created` or `updated` for each lane, in request order. Two lanes of one request with the same key return 422.

        A lane replaces the stored bid as a whole, as an uploaded row does: a field left out of the lane clears the stored value, and the rounds R1 to R3 that the lane does not carry are removed. A lane sends the stored codes of `status`, `move_type`, `trailer_type`, `loading_type`, `unloading_type`, `fuel_compensation_type`, `pre_award_status` and `awarded_lane_type`, not the labels of the template. A date is `YYYY-MM-DD`. A lane with `award` true and `status` `award` becomes award lanes, up to 1000 for one lane and 5000 for one request, and appears on the Lane Dashboard and the customer Lane Rates. A lane changed to not awarded removes its award lanes.

        The PU and DEL market are set from the ZIP, and city and state are stored in upper case. A key outside the fields of this schema returns 422 `unknown_field`. A number outside the range of its column returns 422 `invalid_value`. A `customer_id` that is not a customer of the account returns 422 on `customer_id`.

        The write needs the endpoint grant `lane_bids#create` and every field of this schema granted. Without every field the request returns 403 with one detail for each missing field, because a lane that left out a field the application cannot see would clear it. The bids show `<application name> - API` as the creator in the history of the bid.
      operationId: createLaneBids
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lane_bid]
              properties:
                lane_bid:
                  type: object
                  required: [customer_id, lanes]
                  properties:
                    customer_id: { type: integer, description: Customer of the account., example: 42 }
                    lanes:
                      type: array
                      minItems: 1
                      maxItems: 500
                      items: { $ref: '#/components/schemas/LaneBidWrite' }
      responses:
        '201':
          description: Lanes saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, description: Bid id. }
                        result: { type: string, enum: [created, updated] }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The application lacks the endpoint grant, or lacks a lane field. Without a field grant the details list each missing field.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                data: null
                error:
                  code: forbidden
                  message: "Writing lane bids needs every lane field granted"
                  details:
                    - field: r1_linehaul_bid
                      code: forbidden
                      message: "needs a field grant to write lane bids"
                meta:
                  request_id: "8f3a-c4e2-bb19-2f7d"
                  timestamp: "2026-04-14T12:00:00Z"
