    LaneBidWrite:
      type: object
      description: |
        One lane of a lane bid write: the columns of the Sales bid template, with stored codes in place of labels. A field left out is stored blank, as an empty template cell. Fields marked "Grantable" need a field grant, and the write needs all of them.
      required: [validity_date_from, validity_date_to, bid_date, pu_state, pu_city, del_state, del_city, fuel_compensation_type]
      additionalProperties: false
      properties:
        status: { type: string, enum: [initial, active, finalization, award], description: "Stored code. Defaults to `initial` when left out." }
        validity_date_from: { type: string, format: date, description: "Required." }
        validity_date_to: { type: string, format: date, description: "Required." }
        bid_date: { type: string, format: date, description: "Required." }
        customer_lane_id: { type: [ string, 'null' ] }
        customer_bid_id: { type: [ string, 'null' ] }
        lane_name: { type: [ string, 'null' ] }
        pu_state: { type: string, description: "Required." }
        pu_city: { type: string, description: "Required." }
        pu_zip: { type: [ string, 'null' ] }
        del_state: { type: string, description: "Required." }
        del_city: { type: string, description: "Required." }
        del_zip: { type: [ string, 'null' ] }
        pu_zip_range: { type: [ string, 'null' ] }
        del_zip_range: { type: [ string, 'null' ] }
        move_type: { type: [ string, 'null' ], enum: [point_to_point, point_to_zone, null] }
        trailer_type: { type: [ string, 'null' ], enum: [van, reefer, flatbed, other, null] }
        trailer_size: { type: [ integer, 'null' ], maximum: 2147483647 }
        total_volume: { type: [ integer, 'null' ], maximum: 2147483647 }
        customer_miles: { type: [ number, string, 'null' ], description: "Decimal, rounded to 2 places, below 10000000." }
        gp_miles: { type: [ number, string, 'null' ], description: "Decimal, rounded to 2 places, below 10000000." }
        loading_type: { type: [ string, 'null' ], enum: [live, drop, live_or_drop, round_trip, null] }
        unloading_type: { type: [ string, 'null' ], enum: [live, drop, live_or_drop, round_trip, null] }
        stop_offs: { type: [ integer, 'null' ], maximum: 2147483647 }
        commodity: { type: [ string, 'null' ] }
        fuel_compensation_type: { type: string, enum: [per_mile, percent, breakthrough], description: "Required." }
        alcohol_shipment: { type: [ boolean, 'null' ] }
        r1_linehaul_bid: { type: [ number, string, 'null' ], description: "Grantable, requires field grant. Decimal, rounded to 2 places, below 10000000." }
