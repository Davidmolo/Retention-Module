        '403': { $ref: '#/components/responses/Forbidden' }

  /driver_otd_summaries:
    get:
      tags: [Driver OTD Summaries]
      summary: List the on-time delivery and pickup percentages of each driver for a date range
      description: |
        Returns one row per driver with the on-time delivery percentage (OTD %) and the on-time pickup percentage (OTP %) over the required `date` range, which spans at most 92 days. Dates are calendar days in Central Time, the time zone of the application. A stop counts on the Central day of its stop time, and no stop dated after today counts. A stop recorded with no stop time counts on the last day of its weekly statistics row.

        **The OTD and OTP rule.** The same rule as the OTD % and OTP % that the TMS shows for the driver. A stop is late for the driver when all three hold: its service failure reason is `driver_related`, `traffic_delay` or `accident`; the failure is charged to this driver (a failure charged to another driver excuses this one); and the failure is preventable (only a failure marked Non-preventable excuses the driver, and one that nobody classified counts as late). OTD counts deliveries and OTP counts pickups. Trailer pickups and trailer drops are not counted.

        `otd_percentage` is 100 minus the late share of all deliveries in the range, and `otp_percentage` is 100 minus the late share of all pickups in the range, each rounded to 2 decimals. The counts behind them are `deliveries_count` and `late_deliveries_count`, and `pickups_count` and `late_pickups_count`, so a range is never an average of weekly percentages. Example: 42 pickups with 1 late give `otp_percentage` 97.62. A count of 0 gives null: a driver with no delivery in the range gets `otd_percentage` null, and a driver with no pickup gets `otp_percentage` null, not 0 or 100. A driver with trailer stops only shows 100 on the page tile, and null here.

        **Compared with the Driver Stats page.** The This Week, Last Week, Last 4 weeks and Last 8 weeks tiles show one combined figure, On-Time Delivery and Pickup: 100 minus (`late_deliveries_count` + `late_pickups_count`) divided by (`deliveries_count` + `pickups_count`) times 100, rounded to 2 decimals. Its weeks run Sunday to Saturday, and Last 4 and Last 8 weeks include the current week. Two differences remain. The page counts a stop in the week of the driver statistics row that holds it, and a pickup made at the end of one week can sit in the row of the next week, while this endpoint counts each stop on its own day; so the figures can differ at the first and the last day of a range. The 8-week figure of the wage statement skips older weeks without positive gross profit, and this endpoint counts every stop.

        An unfiltered list holds the drivers that have a driver statistics row in the range. A client that names a driver with `driver_id` gets a row for that driver, with the percentages null when it has no stop. The figures come from the weekly driver statistics: a week older than two weeks keeps the service failure reason it had when the statistics were last generated. Only account 1 holds statistics today; any other account gets an empty list. Rows are ordered by `id`.

        **Weekly miles and money figures.** The same row carries the Driver Stats figures of the whole Sunday-to-Saturday weeks that lie inside the `date` range. A partial week at either end is dropped, never widened: `weeks_period_start` is the first Sunday on or after `date[gte]` and `weeks_period_end` is the last Saturday on or before `date[lte]`, and a range inside one week gives both null. A week that has no statistics row does not count. A week counts by the Driver Stats rule: the newest week of the range always counts, and an older week counts only when its gross profit is above zero or its wage statement holds a vacation line, so a week with zero or negative gross profit is dropped (Gedas, ORS-4770, 2026-10). `counted_weeks` is the number of weeks that count. `average_miles`, `average_revenue` and `average_gross_profit` are the sum over the counted weeks divided by `counted_weeks`, and `median_miles`, `median_revenue` and `median_gross_profit` are the medians of the weekly values, each rounded to 2 decimals. `revenue_per_mile` is the revenue divided by the miles of the counted weeks. All seven figures are null and `counted_weeks` is 0 when the range holds no whole week, or when no row of the range holds a mileage event (a week with no loads). `revenue_per_mile` is null when the counted weeks hold 0 miles. The miles keys are returned by default. The five money keys (`average_revenue`, `median_revenue`, `revenue_per_mile`, `average_gross_profit`, `median_gross_profit`) are grantable and are never returned without a field grant.

        **Compared with the Driver Stats page.** The figures come from the same fold as the page tiles (`DriverStatistic.aggregate_weeks`). For This Week the page shows the newest row of the 52 weeks when the current week has no row, and this endpoint returns null. The page takes the 4 or 8 newest rows before this week, so a missing week reaches one row further back, while this endpoint takes the calendar weeks of the range and shows the figures of the rows it has. A client asks Last 4 weeks as `date[gte]=<Sunday 4 weeks back>&date[lte]=<last Saturday>`, because the page money of Last 4 and Last 8 excludes the current week. The page shows miles as whole numbers and money to cents. For a range with no loads this endpoint returns null, while the page shows the gross profit of the wage cost alone, a negative figure. The page shows no Last 8 weeks figure when the driver has fewer than 8 statistics rows.
      operationId: listDriverOtdSummaries
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: driver_id
          in: query
          description: Filter by driver. Multi-value supported. A named driver with no stop in the range gets a row with `otd_percentage` and `otp_percentage` null.
          schema: { type: integer }
        - name: date
          in: query
          required: true
          description: "Required date range of at most 92 days, both bounds: `?date[gte]=2026-08-20&date[lte]=2026-10-14`. `gt` and `lt` exclude the bound. A missing bound, an invalid date, a range that ends before it starts or a range above 92 days returns 400 `invalid_filter`."
          schema: { type: string, format: date }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriverOtdSummary' }
                  error:
                    type: 'null'
                    example: null
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

