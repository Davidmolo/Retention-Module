      description: |
        Returns a paginated, sortable, filterable list of customers (shippers, brokers, 3PLs) scoped to the authenticated application's account.

        Sensitive contact, manager, and financial fields require explicit grants. Internal operational flags (`critical_customer`, `not_scheduled_loads`, `protect_from_freeze`, default-load-type config, EFS usernames, fuel-account routing) are never exposed regardless of grants. External system IDs (`macropoint_id`, `apex_broker_id`, `tmw_id`) ARE available with field grants for partners that need to map records back to their own systems.
