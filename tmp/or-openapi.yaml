  /drivers/{driver_id}/documents:
    get:
      tags: [Driver Documents]
      summary: List documents on a driver
      description: |
        Returns a paginated list of documents attached to the driver, newest first. Scoped to the authenticated application's account. Only the `upload_type` values your application holds on `driver_document_types` appear: five by default (`cdl`, `inspections`, `training_certificates`, `road_test`, `orientation_tests`), and each other type only with its grant. When your application is granted them, each document carries a `url` link and its `url_expires_at`; a document with no stored file returns both as null.
      operationId: listDriverDocuments
      parameters:
        - name: driver_id
          in: path
          required: true
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriverDocument' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Driver Documents]
      summary: Upload a document to a driver
      description: |
        Uploads a file (multipart/form-data) and attaches it to the driver's Files section, organized by `upload_type` into the corresponding folder. The file is stored in its original format. There is no PDF conversion. The response carries the created document's `url` and `url_expires_at` when your application is granted them.

        **Constraints:**
          * Max file size: 25 MB
          * Allowed content types: `application/pdf`, `image/jpeg`, `image/png`, `application/msword`, `application/vnd.openxmlformats-officedocument.wordprocessingml.document`, `application/vnd.ms-excel`, `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`, `text/csv`, `text/plain`
          * Allowed extensions: `.pdf`, `.jpg`, `.jpeg`, `.png`, `.doc`, `.docx`, `.xls`, `.xlsx`, `.csv`, `.txt`
          * `upload_type` is **required** and must match a Files-tab folder (see enum).

        **Curl example:**
        ```
        curl -X POST https://openroadtms.com/api/ext/v1/drivers/42/documents \
             -u "$CLIENT_ID:$CLIENT_SECRET" \
             -F "file=@/path/to/cdl.pdf" \
             -F "upload_type=cdl"
        ```
      operationId: createDriverDocument
      parameters:
        - name: driver_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, upload_type]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload. Required.
                upload_type:
                  type: string
                  enum:
                    - cdl
                    - mvr
                    - application
                    - company_policy_receipts
                    - previuos_employment_request
                    - previous_employment
                    - occupation_insurance
                    - psp_attachment
                    - passenger_release_form
                    - misc_docs
                    - orientation_tests
                    - clearinghouse
                    - written_warnings
                    - inspections
                    - training_certificates
                    - operational_agreement
                    - driver_qualification
                    - road_test
                    - driver_app
                  description: Required. Determines which folder the file appears in on the driver's Files tab. Only a type your application holds on `driver_document_types` is accepted; any other value answers 400 with field `upload_type`. The default types are `cdl`, `inspections`, `training_certificates`, `road_test` and `orientation_tests`.
      responses:
        '201':
          description: Document uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DriverDocument' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

