  /fuel_surcharge_matrices/{id}/file:
    get:
      tags: [File Links]
      summary: Follow a fuel surcharge matrix file link
      operationId: getFuelSurchargeMatrixFile
      description: |
        The redirect target of a matrix's `url`. **Treat that URL as opaque and fetch it as
        given** rather than building this path yourself.

        No `Authorization` header is needed here: the `token` is the credential,
        and this endpoint ignores a header you send. Do configure your HTTP client
        **not to forward an `Authorization` header across the redirect**. The
        storage host rejects a request that carries two authentication mechanisms.

        Answers `302` with the storage URL in `Location`; follow it to get the
        bytes. That storage URL is time-limited and expires together with the
        link, so fetch the file before `url_expires_at`.

        Answers `410 link_expired` for a link that expired within the last day.
        An older link answers `404`, because its own signature has expired. In
        both cases, read the parent resource again for a fresh link. Answers
        `404` for every other rejection
        (unknown, tampered, cross-account, or a grant that has since been
        revoked), so a rejected link does not show whether the record exists.

        The link is not single-use. It serves every fetch until its expiry.
        Permission is re-checked on each fetch, so a link can begin to answer
        `404` before it expires. Revoking the application or a grant blocks the
        next fetch of the link. A storage URL already returned in a `Location`
        header works until the link's own expiry.

        Each download is limited: at most 2 downloads of the same document and 30 downloads of any
        document per application in one minute, shared with the other file links. A fetch over a limit
        answers `429 rate_limited` with `Retry-After: 60`. Fetch each file once and keep it.
      security: []
      responses:
        '302':
          description: Redirect to the file bytes.
          headers:
            Location:
              schema: { type: string }
              description: Time-limited storage URL for the file bytes.
            Cache-Control:
              schema: { type: string }
              description: Always `no-store`, so the redirect is never replayed to an expired target.
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/LinkExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Fuel surcharge matrix id. Must be the id the token was minted for.
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: The signed token carried in `url`.

