  /places/{id}:
    get:
      tags: [Places]
      summary: Retrieve a place
      description: Returns one place of the account, a merged place included (its `merged_to_id` names the place that stays).
      operationId: getPlace
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Place' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Places]
      summary: Update a place
      description: |
        Edits a place with the validation of the Places page form. Send only the keys to change. Any other body key is silently dropped. The change is logged in the place history as "<application name> - API".

        - The address keys (`full`, `street`, `street2`, `city`, `state`, `zip`, `country`) are written one at a time; a key you leave out keeps its value. `street`, `city`, `state`, `zip`, `country` and `full` cannot be blank.
        - `lat` and `lng` move the point and must be sent together.
        - `tags` may hold `terminal` and `drop_yard`. The automated tags (`scale_location`, `rest_location`, `trailer_yard`, `home_time_parking`) follow the records of the place: an automated tag you send is removed again, and the response shows the stored tags. A `terminal` tag drives Time Out for the stops at the place.
        - `overnight_parking` is `unknown`, `allowed` or `not_allowed`.
        - `tracking_area` needs the field grant. It is a GeoJSON Polygon that does not cross itself and covers at least one acre; `null` clears it. A coordinate must be a finite number.

        A refused value answers 422 `validation_error` with one `details` entry per field.
      operationId: updatePlace
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [place]
              properties:
                place:
                  type: object
                  properties:
                    name:                           { type: string }
                    description:                    { type: [ string, 'null' ] }
                    banned:                         { type: boolean }
                    overnight_parking:              { type: string, enum: [unknown, allowed, not_allowed] }
                    special_handling_transfer_mode: { type: [ string, 'null' ], enum: [none, load_handling, load_notes, both, null] }
                    full:                           { type: string }
                    street:                         { type: string }
                    street2:                        { type: [ string, 'null' ] }
                    city:                           { type: string }
                    state:                          { type: string }
                    zip:                            { type: string }
                    country:                        { type: string }
                    lat:                            { type: number, minimum: -90, maximum: 90 }
                    lng:                            { type: number, minimum: -180, maximum: 180 }
                    tags:                           { type: array, items: { type: string, enum: [terminal, drop_yard, scale_location, rest_location, trailer_yard, home_time_parking] } }
                    tracking_area:                  { type: [ object, 'null' ], description: "Grantable. GeoJSON Polygon, or null to clear." }
              example:
                place:
                  name: "North Yard"
                  city: "Chicago"
                  tags: ["terminal"]
      responses:
        '200':
          description: Place updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Place' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

