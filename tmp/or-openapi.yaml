  /trailer_locations/{id}:
    patch:
      tags: [Assignments]
      summary: Set a trailer's Empty / Loaded status
      description: |
        Sets the status of the trailer's current location row as the Loaded / Empty update of the Trailer Organizer location view does: an open current row closes one minute before now, a current row with a set end keeps that end, and a new row at the same place starts now with the new status, so the yard counts on `/trailer_yards` follow. The change is recorded as "<application name> - API" in `updated_by` and in the trailer history. A load is linked through `POST /load_flags`, not here.

        - `status` is `empty` or `fully_loaded`; a missing `status` answers 400.
        - The same status as the current one answers 200 with the row unchanged and writes nothing.
        - 422 `validation_error`: `status` outside the two values; `id` is not the current row of its trailer, or the row has no place; `base` when the account lacks the Places or Trailer Organizer feature, or the save fails.
        - The `id` in the answer is the new current row.
      operationId: updateTrailerLocation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trailer_location]
              properties:
                trailer_location:
                  type: object
                  required: [status]
                  properties:
                    status: { type: string, enum: [empty, fully_loaded] }
              example:
                trailer_location:
                  status: empty
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TrailerLocation' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
