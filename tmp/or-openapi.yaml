    AwardLane:
      type: object
      description: |
        An awarded contract lane: one ZIP prefix pair of a customer bid. Fields marked "grantable" require explicit grant from the Admin Panel; if not granted, they are omitted from the response.

        The money columns are decimal-precision strings. `stop_offs` is the count of extra stops, so the total stops are `stop_offs + 2`.

        The figures of `volume_stats` are the Lane Dashboard figures. The dashboard words map as: Contract Bid Name = `lane_name`, Customer Bid ID = `customer_bid_id`, Tendered = `received`, Accepted = `accepted`, Rejected = `rejected`, Canceled = `canceled`, Commitment per period = `planned_pace`. A group figure of the dashboard is built from the lanes: Average Rate = the mean of `award_linehaul`, Average RPM = the mean of `calculated_rpm`, and Revenue = `award_volume` times `award_linehaul`, counted once per `aggregated_sales_lane_bid_id`.

        To read the tender status of a load, read `edi_accepted` on `/loads`. To read the FSC method of the customer, call `/fuel_surcharge_methods?customer_id=`.
      properties:
        id:                           { type: integer }
        aggregated_sales_lane_bid_id: { type: integer, description: "The bid the lane belongs to." }
        customer_id:                  { type: integer, description: "Customer FK. Resolve via GET /customers/{id}." }
        customer_bid_id:              { type: [ string, 'null' ], description: "The customer's own bid id." }
        customer_lane_id:             { type: [ string, 'null' ], description: "The customer's own lane id." }
        lane_name:                    { type: [ string, 'null' ], description: "Contract Bid Name: the Lane Name of the bid upload, as uploaded; null when the upload left it blank." }
        pu_city:                      { type: [ string, 'null' ] }
        pu_state:                     { type: [ string, 'null' ] }
        pu_zip_prefix:                { type: [ string, 'null' ], description: "Stored pickup ZIP prefix, digits only." }
        del_city:                     { type: [ string, 'null' ] }
        del_state:                    { type: [ string, 'null' ] }
        del_zip_prefix:               { type: [ string, 'null' ], description: "Stored delivery ZIP prefix, digits only." }
        lane_type:
          type: [ string, 'null' ]
          enum: [zip_range, point_to_point, null]
          description: "ZIP type of the pickup prefix: `zip_range` for a prefix of 3 digits or fewer, `point_to_point` for a longer prefix, null when the lane has no pickup prefix."
        validity_date_from:           { type: string, format: date, description: "First day of the lane validity, inclusive." }
        validity_date_to:             { type: string, format: date, description: "Last day of the lane validity, inclusive." }
        status:
          type: string
          enum: [active, future, expired]
          description: "Computed from today against the validity dates, inclusive. Never stored. `/lane_bids` `status` is the stored bid stage (initial, active, finalization, award); join the two resources by `aggregated_sales_lane_bid_id`."
        gp_miles:                     { type: [ string, 'null' ], description: "OpenRoad routed miles. Decimal-precision string." }
        customer_miles:               { type: [ string, 'null' ], description: "Miles the customer stated. Decimal-precision string." }
        trailer_type:                 { type: [ string, 'null' ], enum: [van, reefer, flatbed, other, null] }
        trailer_size:                 { type: [ integer, 'null' ] }
        stop_offs:                    { type: [ integer, 'null' ], description: "Extra stops of the lane. Total stops = stop_offs + 2." }
        move_type:                    { type: [ string, 'null' ], enum: [point_to_point, point_to_zone, null] }
        commodity:                    { type: [ string, 'null' ] }
        loading_type:                 { type: [ string, 'null' ], enum: [live, drop, live_or_drop, round_trip, null] }
        unloading_type:               { type: [ string, 'null' ], enum: [live, drop, live_or_drop, round_trip, null] }
        awarded_lane_type:            { type: [ string, 'null' ], enum: [primary, backup, null] }
        rate_type:
          type: [ string, 'null' ]
          enum: [rpm, all_in, flat, null]
          description: "`rpm` when the linehaul RPM is positive, else `all_in` when the all-in rate or the all-in RPM is positive, else `flat` when the linehaul is positive, else null."
        fuel_compensation_type:       { type: [ string, 'null' ], enum: [per_mile, percent, breakthrough, null] }
        award_volume:                 { type: [ string, 'null' ], description: "Committed loads of the lane over its validity. Decimal-precision string." }
        created_at:                   { type: string, format: date-time }
        updated_at:                   { type: string, format: date-time }
        award_linehaul:               { type: [ string, 'null' ], description: "Grantable — requires field grant. Awarded linehaul. Decimal-precision string, e.g. '1500.00'." }
        award_linehaul_rpm:           { type: [ string, 'null' ], description: "Grantable — requires field grant. Awarded linehaul per mile. Decimal-precision string." }
        award_all_in:                 { type: [ string, 'null' ], description: "Grantable — requires field grant. Awarded all-in rate. Decimal-precision string." }
        award_all_in_rpm:             { type: [ string, 'null' ], description: "Grantable — requires field grant. Awarded all-in rate per mile. Decimal-precision string." }
        award_fuel_compensation:      { type: [ string, 'null' ], description: "Grantable — requires field grant. Awarded fuel compensation. Decimal-precision string." }
        calculated_rpm:               { type: [ number, 'null' ], description: "Grantable — requires field grant. The GP RPM: `award_linehaul` divided by `gp_miles`, or by `customer_miles` when `gp_miles` is 0. Null when the linehaul or the miles are missing." }
        latest_linehaul:              { type: [ string, 'null' ], description: "Grantable — requires field grant. Latest linehaul of the bid history. Decimal-precision string." }
        latest_linehaul_rpm:          { type: [ string, 'null' ], description: "Grantable — requires field grant. Latest linehaul per mile. Decimal-precision string." }
        latest_all_in:                { type: [ string, 'null' ], description: "Grantable — requires field grant. Latest all-in rate. Decimal-precision string." }
        latest_all_in_rpm:            { type: [ string, 'null' ], description: "Grantable — requires field grant. Latest all-in rate per mile. Decimal-precision string." }
        volume_stats:
          allOf:
            - $ref: '#/components/schemas/AwardLaneVolumeStats'
          description: "Grantable — requires field grant. Commitment progress of the lane, the figures of the Lane Dashboard. The figures are cached for up to 10 minutes."

    AwardLaneVolumeStats:
      type: object
      description: |
        Commitment progress of one award lane. The windows are the current day, the current week (Monday start) and the current month, in Central time. Every count is a count of contract loads on the lane, by `created_at`, inside the lane validity clipped to the bid validity. `received` counts every contract load tendered on the lane, `rejected` counts the canceled and TONU loads that hold a rejected tender, `canceled` counts every other canceled and TONU load, and `accepted` counts every other status, so `accepted` plus `rejected` plus `canceled` equals `received` in each window. Before 2026-10-07 `canceled` also held the rejected loads. The figures are cached for up to 10 minutes.
      properties:
        committed:         { type: integer, description: "Award volume of the lane." }
        received_total:    { type: integer }
        received_day:      { type: integer }
        received_week:     { type: integer }
        received_month:    { type: integer }
        accepted_total:    { type: integer }
        accepted_day:      { type: integer }
        accepted_week:     { type: integer }
        accepted_month:    { type: integer }
        rejected_total:    { type: integer }
        rejected_day:      { type: integer }
        rejected_week:     { type: integer }
        rejected_month:    { type: integer }
        canceled_total:    { type: integer }
        canceled_day:      { type: integer }
        canceled_week:     { type: integer }
        canceled_month:    { type: integer }
        planned_pace:
          type: object
          description: "Loads the commitment plans per day, week and month over the clipped validity."
          properties:
            per_day:       { type: number }
            per_week:      { type: number }
            per_month:     { type: number }
        valid_from:        { type: [ string, 'null' ], format: date, description: "First day of the lane validity clipped to the bid validity." }
        valid_to:          { type: [ string, 'null' ], format: date, description: "Last day of the lane validity clipped to the bid validity." }

    AwardLaneNote:
      type: object
      description: |
        A note of an award lane or of its parent bid. `user_id` is null for a note that a partner created.
      properties:
        id:         { type: integer }
        content:    { type: string, example: "Customer confirmed the lane volume for Q4." }
        user_id:    { type: [ integer, 'null' ], description: "Author User FK. Resolve via /users. Null when the note has no author." }
        category:   { type: string, description: "The kind of record the note is attached to." }
        author:     { type: [ string, 'null' ], description: "Who wrote the note: a user's full name, or for a note created through this API your application name, followed by ` - API`. Null when the note has no known author." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Driver:
      type: object
      description: |
        A driver record. Fields marked "grantable" require explicit grant from the Admin Panel — sensitive data (SSN, DOB, home address, license details) is hidden by default.

        **Security note for `soc_sec_no` (driver SSN).** This is the most sensitive field on the API surface. The grant is reviewed individually — most integrations should not request it. Partners that do receive the grant take on additional handling obligations: PCI/PII storage standards, access logging, and (in many jurisdictions) breach notification responsibilities. Request only if your integration has a genuine, documented need.
      properties:
        id:                { type: integer, example: 8421 }
        first_name:        { type: [ string, 'null' ] }
        last_name:         { type: [ string, 'null' ] }
        middle_name:       { type: [ string, 'null' ] }
        driver_nr:         { type: [ string, 'null' ], description: "Internal driver number" }
        status:            { type: string, example: active, description: "active, pre_hired, suspended_new, suspended, lead" }
        driver_type:       { type: [ string, 'null' ], description: "company_driver, contract_driver, owner_operator, leased_owner" }
        tax_type:          { type: [ string, 'null' ], description: "employee (W-2) or contractor (1099)" }
        fleet_group:       { type: string, enum: [none, local, short_haul, regional, otr, dedicated, flatbed] }
        manager_id:        { type: [ integer, 'null' ], description: "FK to /users — primary manager" }
        substitute_manager_id: { type: [ integer, 'null' ], description: "FK to /users — backup manager" }
        compensation_id:   { type: [ integer, 'null' ], description: "FK to /compensations (endpoint requires explicit grant)" }
        payroll_schedule_id: { type: [ integer, 'null' ], description: "FK to /payroll_schedules" }
        url:            { type: [ string, 'null' ], description: "A gogp link that redirects to the profile photo. Treat it as opaque. Embeds in a bare <img>. Grantable, so it is absent unless your application is granted it. Null when the driver has no photo.", example: "https://app.openroadtms.com/api/ext/v1/drivers/8421/photo/file?token=..." }
        url_expires_at: { type: [ string, 'null' ], format: date-time, description: "When `url` stops working. Grantable with `url`. Null when the driver has no photo." }
        phone:             { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        email:             { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        cdl:               { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        cdl_state:         { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        address:           { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        city:              { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        state_code:        { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        zip_code:          { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        dob:               { type: [ string, 'null' ], format: date, description: "Grantable — requires field grant" }
        cdl_expire_date:   { type: [ string, 'null' ], format: date, description: "Grantable — requires field grant" }
        soc_sec_no:        { type: [ string, 'null' ], description: "Grantable — requires field grant. Driver SSN — see security note in this schema's description; the most sensitive field on the API surface, granted only on individual review with additional handling obligations." }
        date_added:        { type: [ string, 'null' ], format: date, description: "Grantable — requires field grant (hire date)" }
        date_removed:      { type: [ string, 'null' ], format: date, description: "Grantable — requires field grant (termination date)" }
