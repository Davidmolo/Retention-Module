          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          description: Sort field. Prefix with `-` for descending. Newest first by default.
          schema:
            type: string
            enum: [created_at, '-created_at']
