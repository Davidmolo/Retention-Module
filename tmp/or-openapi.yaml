        Returns driver-to-truck and driver-to-trailer assignments. By default only the current rows (start_date in the past, end_date null or in the future); with `include_history=true`, every row, past and future included. These are the driver rows of the trailer Assignments tab; its location rows are on `/trailer_locations`. Scoped to the authenticated application's account.
