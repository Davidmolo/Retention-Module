          schema: { type: string }
        - name: start_date
          in: query
          description: Filter by start_date. Accepts range — `?start_date[gte]=2026-01-01`.
          schema: { type: string, format: date }
        - name: end_date
          in: query
          description: Filter by end_date. Accepts range.
          schema: { type: string, format: date }
        - name: created_at
          in: query
          description: Filter by created_at. Accepts range.
          schema: { type: string, format: date-time }
        - name: updated_at
          in: query
          description: Filter by updated_at. Accepts range.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/IftaQuarter' }
                  error:
                    type: 'null'
                    example: null
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /ifta_quarters/{id}:
    get:
      tags: [IFTA Quarters]
      summary: Retrieve an IFTA quarter
      operationId: getIftaQuarter
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/IftaQuarter' }
                  error:
                    type: 'null'
                    example: null
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /regions:
    get:
      tags: [Regions]
      summary: List regions
      description: |
        Returns a paginated, sortable, filterable list of the regions of the authenticated application's account, each with its zip prefixes. A deleted region is not returned.

        `code` is the region name, the same value as `region_code` on `/region_plans`, `/region_capacities` and `/destinations`. A zip prefix belongs to one region of the account; when two regions hold one prefix, the region with the lowest id owns it.
      operationId: listRegions
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, updated_at, '-created_at', '-updated_at']
        - name: id
          in: query
          description: Filter by region id. Use `?id[]=a&id[]=b` for multiple values.
          schema: { type: integer }
        - name: code
          in: query
          description: Filter by region code. Use `?code[]=a&code[]=b` for multiple values.
          schema: { type: string }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Region' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /region_plans:
    get:
      tags: [Region Plans]
      summary: List the volume plan per region and date
      description: |
        Returns one row per region and calendar date of the requested range, as the Capacity board resolves it. The `date` range is required and spans at most 92 days.

        `source` tells where the numbers come from: `update` is a plan saved for that weekday, `default` is the plan the system derives from the pickups of the same weekday in the four latest full weeks before the date's week (before the current week for a future date); a week that holds New Year's Day, Memorial Day, Independence Day, Labor Day, Thanksgiving Day or Christmas Day is skipped and one more week back is taken, and `missing` means no plan and no pickup in those four weeks. `missing` is the No volume set status: every number is 0 and `valid_from`, `valid_to`, `saved_by`, `created_at` and `updated_at` are null.

        `plan` and `reserve` are the sums of the fleet group columns. `plan_<group>` and `reserve_<group>` carry one column per fleet group: `local`, `short_haul`, `regional`, `otr`, `dedicated` and `flatbed`. `default_plan` is the history plan of the date, also on a date that has an `update` plan. `valid_from` and `valid_to` are the period of the plan that wins the date, and `created_at`, `updated_at` and `saved_by` are the winning plan's.

        Polling `updated_at` misses a deletion of a period and a change of a `default` plan, because neither moves any `updated_at`. To follow changes, read the date range again.

        The default order is `date` ascending, then region code. A row with no plan sorts last by `updated_at`.
      operationId: listRegionPlans
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [date, updated_at, '-date', '-updated_at']
        - name: region_id
          in: query
          description: Filter by region. Use `?region_id[]=a&region_id[]=b` for multiple values. A region of another account returns no row.
          schema: { type: integer }
        - name: region_code
          in: query
          description: Filter by region code, the region name, for example `IL-CHI`. Use `?region_code[]=a&region_code[]=b` for multiple values.
          schema: { type: string }
        - name: date
          in: query
          required: true
          description: "Required date range of at most 92 days, both bounds: `?date[gte]=2026-10-12&date[lte]=2026-10-18`. `gt` and `lt` exclude the bound. A missing bound, an invalid date, a range that ends before it starts or a range above 92 days returns 400 `invalid_filter`."
          schema: { type: string, format: date }
        - name: source
          in: query
          description: Filter by source. Use `?source[]=update&source[]=default` for multiple values. `missing` is the No volume set status.
          schema: { type: string, enum: [default, update, missing] }
        - name: updated_at
          in: query
          description: Filter by the update time of the winning plan. Use `?updated_at[gte]=...`. A row with no plan never matches.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RegionPlan' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /region_plan_periods:
    post:
      tags: [Region Plan Periods]
      summary: Save the volume plan of one region over one period
      description: |
        Writes the planned volume and reserve of one region over one closed date period, by ISO weekday (1 Monday to 7 Sunday). A weekday that the body leaves out stays off for the period. A second write of the same region and period replaces that plan and its days. The write is recorded under the name of the application, shown as `<application name> - API` in `saved_by` of `/region_plans`.

        Send a day as a total (`plan`, `reserve`), as fleet group values (`plan_<group>`, `reserve_<group>`), or both. A total alone is split evenly over the six fleet groups with the remainder to the first groups in the order `local`, `short_haul`, `regional`, `otr`, `dedicated`, `flatbed`: a `plan` of 100 gives 17, 17, 17, 17, 16, 16. A total that differs from the sum of the group values sent with it returns 422. A day with no `plan` and no `plan_<group>` value returns 422. A reserve above its plan returns 422.

        A volume is a whole number from 0 to 2147483647: a decimal, a negative number, a word or null returns 422 and writes nothing. A `region_id` that is not a region of the account returns 422.
      operationId: createRegionPlanPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region_plan_period]
              properties:
                region_plan_period:
                  type: object
                  required: [region_id, valid_from, valid_to, days]
                  properties:
                    region_id: { type: integer, description: Region of the account., example: 12 }
                    valid_from: { type: string, format: date, example: "2026-10-12" }
                    valid_to: { type: string, format: date, description: On or after valid_from., example: "2026-10-18" }
                    days:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required: [weekday]
                        properties:
                          weekday: { type: integer, minimum: 1, maximum: 7, description: ISO weekday. Each weekday appears once. }
                          plan: { type: integer, minimum: 0, description: Total planned volume, split evenly over the fleet groups when no plan_<group> is sent. }
                          reserve: { type: integer, minimum: 0, description: Total reserve, split evenly over the fleet groups when no reserve_<group> is sent. }
                          plan_local: { type: integer, minimum: 0 }
                          plan_short_haul: { type: integer, minimum: 0 }
                          plan_regional: { type: integer, minimum: 0 }
                          plan_otr: { type: integer, minimum: 0 }
                          plan_dedicated: { type: integer, minimum: 0 }
                          plan_flatbed: { type: integer, minimum: 0 }
                          reserve_local: { type: integer, minimum: 0 }
                          reserve_short_haul: { type: integer, minimum: 0 }
                          reserve_regional: { type: integer, minimum: 0 }
                          reserve_otr: { type: integer, minimum: 0 }
                          reserve_dedicated: { type: integer, minimum: 0 }
                          reserve_flatbed: { type: integer, minimum: 0 }
      responses:
        '201':
          description: Period saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RegionPlanPeriod' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /region_capacities:
    get:
      tags: [Region Capacities]
      summary: List the planned volume against the booked pickups per region and date
      description: |
        Returns one row per region and calendar date of the requested range: the planned volume (`plan`, the sum of the fleet group columns of `/region_plans`), the pickups booked in the region on that date (`booked_pickups`) and `remaining`, the plan minus the booked pickups, never below 0. The `date` range is required and spans at most 92 days.

        `source` is `update`, `default` or `missing`, as on `/region_plans`. `missing` is the No volume set status: `plan` and `remaining` are 0.

        The default order is `date` ascending, then region code. The granted fields `unassigned_drivers` and `empty_drivers_now` count drivers the way the Capacity board does.
      operationId: listRegionCapacities
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: region_id
          in: query
          description: Filter by region. Use `?region_id[]=a&region_id[]=b` for multiple values. A region of another account returns no row.
          schema: { type: integer }
        - name: region_code
          in: query
          description: Filter by region code, the region name, for example `IL-CHI`. Use `?region_code[]=a&region_code[]=b` for multiple values.
          schema: { type: string }
        - name: date
          in: query
          required: true
          description: "Required date range of at most 92 days, both bounds: `?date[gte]=2026-10-12&date[lte]=2026-10-18`. `gt` and `lt` exclude the bound. A missing bound, an invalid date, a range that ends before it starts or a range above 92 days returns 400 `invalid_filter`."
          schema: { type: string, format: date }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RegionCapacity' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /driver_capacities:
    get:
      tags: [Driver Capacities]
      summary: List the drivers per region and date
      description: |
        Returns one row per region and calendar date of the requested range, with zeros when nothing counts. The `date` range is required and spans at most 92 days. A date is a calendar date in the time zone of the account.

        A stop places a driver in the region of the first 3 digits of its zip code, on the date of its first present time (Time In, Time Out, Driver App time, appointment), as the pickups booked on `/region_capacities`. The stop types are `pick_up`, `trailer_pu`, `delivery` and `trailer_del`. A canceled or TONU load counts as it does on the Capacity board. A PTO cash-out, a balance adjustment and a pending home time request are not a time off. A driver with the Test Driver flag, and a driver whose status is not `active`, count nowhere.

        `total_drivers` counts the drivers with a stop in the region on the date, the available drivers and the drivers whose time off starts there. `available_drivers` counts the drivers available in the region on the date by the Capacity board rule: A driver is available on a date after a load or a time off that ends on it: a load ends at its last stop, whatever the stop type, and is placed by the first 3 digits of that stop's ZIP code, a time off ends at its reset location and is placed by the first 3 digits of the reset ZIP code, except that a time off that has not started at the time of the request, or that has no reset ZIP code, is placed by the first 3 digits of the ZIP code of the last delivery or trailer drop of the driver before it starts, when he has one. The driver needs at least the account setting Minimum Hours Gap Between Events (8 when unset) free before his next load or time off, plus the Minimum Hours After Delivery when the last stop has no Time Out; on today and later dates the gap also counts from now, as on the Capacity board. A free driver stays available in the region of his last load or time off that ended before today only on today's date. A time off counts in off_duty_drivers on its start date, in the region of its reset ZIP, and on the covered dates in no field; a time off starting on a date never makes the driver available. A pending home time request is not a time off. A stop with no ZIP code, and a time off with no reset ZIP code and no such delivery, is placed in no region, and coordinates are never used. Only drivers with status active count; a driver with status suspended, suspended_new or pre_hired, and a driver with the Test Driver flag, count nowhere. A canceled or TONU load counts as it does on the Capacity board. `off_duty_drivers` counts the drivers whose time off starts on the date, in the region of its reset ZIP code. `loaded_drivers` counts the drivers with a delivery stop in the region on the date. `unassigned_booked_delivery_loads` counts the `booked` loads with a delivery stop in the region on the date that has no driver.

        An application granted the field `fleet_group` gets one row per region, date and driver Fleet Group (`none`, `local`, `short_haul`, `regional`, `otr`, `dedicated`, `flatbed`, in this order), counted by the current `drivers.fleet_group`; a driver with no Fleet Group counts under `none`. The groups of one region and date sum to the unsplit row. The booked delivery loads with no driver are not split: `unassigned_booked_delivery_loads` sits on the `none` row and is null on the other rows. An application without the grant gets one row per region and date, with no `fleet_group` field.

        An application granted the field `landing_drivers_total` gets it on every row, split by fleet group as `available_drivers` is. `landing_drivers_total` counts the active drivers, not Test Drivers, who land in the region on the date. A driver lands at the last delivery or trailer drop of each of his loads, placed by the first 3 digits of its ZIP code and dated as `loaded_drivers` is, on a load that is not canceled or TONU. A driver also lands at the end of a time off on the date, placed as for `available_drivers` (by the reset ZIP code, or by the last delivery or trailer drop of the driver before a time off that has not started at the time of the request or has no reset ZIP code). A last delivery or trailer drop is not a landing when a time off starts within the account Minimum Hours Gap Between Events after it with no stop of the driver between, or when it falls inside a time off; the driver then lands where the last of those time offs ends, a time off ending within the gap before another time off or inside another one counting the same way. A time off whose last stop of the driver before it is a pickup or trailer pickup is not a landing when that load delivers after the time off ends: the driver lands where that load delivers. A load that follows keeps the driver landing. A driver counts once per date, at his first landing of the date in any region, so a request filtered by region does not move him to a later landing; a landing with no ZIP code counts in no region. A pending home time request is not a time off.

        The default order is `date` ascending, then region code, then fleet group.
      operationId: listDriverCapacities
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: region_id
          in: query
          description: Filter by region. Use `?region_id[]=a&region_id[]=b` for multiple values. A region of another account returns no row.
          schema: { type: integer }
        - name: region_code
          in: query
          description: Filter by region code, the region name, for example `IL-CHI`. Use `?region_code[]=a&region_code[]=b` for multiple values.
          schema: { type: string }
        - name: fleet_group
          in: query
          description: Grantable — requires the `fleet_group` field grant, else 400. Filter by driver Fleet Group. Use `?fleet_group[]=a&fleet_group[]=b` for multiple values.
          schema: { type: string, enum: [none, local, short_haul, regional, otr, dedicated, flatbed] }
        - name: date
          in: query
          required: true
          description: "Required date range of at most 92 days, both bounds: `?date[gte]=2026-10-12&date[lte]=2026-10-18`. `gt` and `lt` exclude the bound. A missing bound, an invalid date, a range that ends before it starts or a range above 92 days returns 400 `invalid_filter`."
          schema: { type: string, format: date }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriverCapacity' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /driver_etas:
    get:
      tags: [Driver ETAs]
      summary: List the current ETA v2 per driver and stop
      description: |
        Returns one entry in `data` per driver and stop of the loads the driver holds now, from the current ETA v2 (HOS ETA) simulation. The simulation recalculates every 5 minutes, and the API caches it for 1 minute. Nothing is stored: a value is the latest calculation, so poll the endpoint again for a fresh value.

        `eta` is the simulated arrival at the stop and `ete` the simulated end of the stop, both in UTC. The four HOS fields are the hours-of-service time left when the driver finishes the stop (at `ete`), in milliseconds. `distance` is the miles of the leg from the previous point (the truck or the previous stop) to the stop, not a running total. A driver whose simulation failed or who holds no stop is left out of `data`.

        For an account without ETA v2, the endpoint answers `200` with an empty `data` array. When the ETA v2 service does not answer, the endpoint answers `503` with `internal_error`; retry later.

        The order is `driver_id` ascending, then the stop order of the simulation.
      operationId: listDriverEtas
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: driver_id
          in: query
          description: Filter by driver. Use `?driver_id[]=a&driver_id[]=b` for multiple values. A driver of another account returns no entry.
          schema: { type: integer }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriverEta' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: The ETA v2 service does not answer. Retry later.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Provide your application's client ID as the username and client secret as the password. Secrets can be rotated at any time — rotations include a 24-hour grace period during which both the old and new secrets remain valid.

  schemas:
    Load:
      type: object
      description: |
        A shipment load with its destinations. Fields marked "grantable" require explicit grant from the Admin Panel; if not granted, they are omitted from the response.

        **Status workflow groups (canonical):** the status enum has 19 values that move through a roughly linear workflow. For UI grouping, partners are encouraged to use the canonical buckets below to keep behavior consistent across integrations.

        | Group | Statuses |
        |---|---|
        | `pre_dispatch` | `booked` |
        | `assigned` | `assigned` |
        | `in_transit` | `en_route_to_shipper`, `at_shipper`, `picked_up`, `delayed`, `en_route_to_consignee`, `at_consignee` |
        | `delivered` | `delivered`, `delivered_pending` |
        | `needs_paperwork` | `missing_paperwork` |
        | `billed` | `exported`, `billed_pending`, `billed`, `billed_pending_acc` |
        | `closed` | `closed`, `open_balance` |
        | `exception` | `canceled`, `tonu` |
      properties:
        id:                  { type: integer, example: 12345 }
        status:              { type: string, example: delivered }
        customer_load:       { type: [ string, 'null' ], description: "Customer's load reference number" }
        gp_load:             { type: [ string, 'null' ], description: "OpenRoad internal load reference" }
        customer_id:         { type: [ integer, 'null' ] }
        user_id:             { type: [ integer, 'null' ], description: "Load creator User FK (implicit sales rep). Resolve via /users." }
        account_manager_id:  { type: [ integer, 'null' ], description: "Account manager User FK. Resolve via /users." }
        csr_manager_id:      { type: [ integer, 'null' ], description: "Customer-service-rep manager User FK. Resolve via /users." }
        planner_manager_id:  { type: [ integer, 'null' ], description: "Planner manager User FK. Resolve via /users." }
        equipment:           { type: [ string, 'null' ], example: Van }
        commodity:           { type: [ string, 'null' ] }
        weight:              { type: [ string, 'null' ], description: "Weight in pounds (free-form string; may contain commas)" }
        size:                { type: [ string, 'null' ], description: "Load size classification", example: FTL }
        temperature:         { type: [ string, 'null' ], description: "Required temperature for reefer loads (free-form string)" }
        contract_spot:       { type: [ string, 'null' ], enum: [contract, spot, null] }
        hot:                 { type: [ boolean, 'null' ] }
        high_value:          { type: [ boolean, 'null' ], description: "Grantable — requires field grant. High-value cargo flag (e.g. extra security required)." }
        short_haul:          { type: [ boolean, 'null' ], description: "Short-haul (load-level \"local\") flag." }
        flatbed:             { type: boolean, description: "Flatbed flag — auto-set when a flatbed trailer or flatbed-fleet-group driver is assigned, or toggled manually." }
        edi_load:            { type: [ boolean, 'null' ], description: "True when the load originated from an EDI tender." }
        edi_accepted:        { type: [ boolean, 'null' ], description: "True when an EDI-tendered load has been accepted (only meaningful when edi_load=true)." }
        award_lane_id:       { type: [ integer, 'null' ], description: "The award lane the load is matched to. Resolve via GET /award_lanes/{id}. Null when no lane is matched." }
        empty_miles_sum:     { type: [ string, 'null' ], description: "Grantable — requires field grant. Aggregated empty (deadhead) miles for this load. Decimal-precision string, e.g. '120.5'." }
        first_pu_time_from:  { type: [ string, 'null' ], format: date-time }
        last_del_time_to:    { type: [ string, 'null' ], format: date-time }
        created_at:          { type: string, format: date-time }
        updated_at:          { type: string, format: date-time }
        miles:               { type: [ string, 'null' ], description: "Grantable — requires field grant. Decimal-precision string, e.g. '500.5'." }
        rate_match:
          type: [ string, 'null' ]
          enum: [matched, mismatch, null]
          description: "Grantable — requires field grant. The Rate matched tag of the load page: `mismatch` when the load linehaul differs from the matched lane linehaul, or the fuel surcharge from the load's fuel surcharge estimate, by more than the customer's Max allowed difference (%), else `matched`. Null when no lane matches the load, or when the account lacks the lane rate feature."
        fsc_match:
          type: [ string, 'null' ]
          enum: [matched, mismatch, null]
          description: "Grantable — requires field grant. The Fuel surcharge mismatch banner of the load page: `matched` when the load fuel surcharge is within the customer's Max allowed difference (%) of the processed fuel surcharge estimate of the matched lane contract, `mismatch` when the banner shows. Null when no lane matches the load, the load has no processed estimate, the customer fuel validation is off, the account lacks the lane rate feature, or the account lacks the Fuel Surcharge Estimates feature. No list filter exists."
        invoice_notes:       { type: [ string, 'null' ], description: "Grantable — requires field grant. Free-text notes for the invoice." }
        edi_acceptance_sent: { type: [ boolean, 'null' ], description: "Grantable — requires field grant. True when the EDI acceptance (990) was sent." }
        notification_email:  { type: [ array, 'null' ], items: { type: string }, description: "Grantable — requires field grant. Recipients of the load notification emails. Null when the list is empty." }
        bol_notification_emails: { type: [ array, 'null' ], items: { type: string }, description: "Grantable — requires field grant. Recipients of the BOL notification email of the load." }
        customer_contact_name: { type: [ string, 'null' ], description: "Grantable — requires field grant. Contact person at the customer for this load." }
        customer_contact_phone: { type: [ string, 'null' ], description: "Grantable — requires field grant. Phone of the customer contact for this load." }
        pickup_number:       { type: [ string, 'null' ], description: "Grantable — requires field grant. Pickup number of the load." }
        bill_of_lading:      { type: [ string, 'null' ], description: "Grantable — requires field grant. BOL number typed on the load." }
        price_per_mile:      { type: string, description: "Grantable — requires field grant. Decimal-precision string, e.g. '2.50'." }
        ignore_trailer_board: { type: [ boolean, 'null' ], description: "Grantable — requires field grant. The load is kept off the Trailer Board." }
        predelivered:        { type: [ boolean, 'null' ], description: "Grantable — requires field grant. The load was delivered before the paperwork; flag set by customer service." }
        alcohol_shipment:    { type: [ boolean, 'null' ], description: "Grantable — requires field grant. The load carries alcohol." }
        sealed:              { type: [ boolean, 'null' ], description: "Grantable — requires field grant. The trailer is sealed." }
        last_mile:           { type: [ boolean, 'null' ], description: "Grantable — requires field grant. Last-mile load." }
        re_power:            { type: [ boolean, 'null' ], description: "Grantable — requires field grant. Re-power load: another truck takes over the trailer." }
        scale_required:      { type: [ boolean, 'null' ], description: "Grantable — requires field grant. The load must be weighed on a scale." }
        ad_hoc:              { type: [ boolean, 'null' ], description: "Grantable — requires field grant. Ad hoc load." }
        regional:            { type: [ boolean, 'null' ], description: "Grantable — requires field grant. Regional load." }
        pff:                 { type: [ boolean, 'null' ], description: "Grantable — requires field grant. PFF load." }
        bol_skip:            { type: boolean, description: "Grantable — requires field grant. The BOL upload requirement is skipped for this load." }
        rescheduled:         { type: boolean, description: "Grantable — requires field grant. The load was rescheduled." }
        pod_uploaded:                { type: boolean, description: "Grantable — requires field grant. True when the load has a live Bill of Lading (POD) upload that is not rejected, the rows that GET /loads/{id}/documents lists with upload_type bill_of_lading." }
        pending_by:          { type: array, items: { type: integer }, description: "Grantable — requires field grant. Ids of the drivers whose dispatch is pending acceptance." }
        accepted_by:         { type: array, items: { type: integer }, description: "Grantable — requires field grant. Ids of the drivers who accepted the load. A driver who set in transit or delivered stays in this list." }
        rejected_by:         { type: array, items: { type: integer }, description: "Grantable — requires field grant. Ids of the drivers who rejected the load." }
        in_transit_by:       { type: array, items: { type: integer }, description: "Grantable — requires field grant. Ids of the drivers who set the load in transit in the mobile app." }
        delivered_by:        { type: array, items: { type: integer }, description: "Grantable — requires field grant. Ids of the drivers who set the load delivered in the mobile app." }
        rejection_notes:     { type: object, additionalProperties: { type: string }, description: "Grantable — requires field grant. The reason a driver gave when rejecting the load, keyed by driver id, for example `{ \"123\": \"Truck broke down\" }`. An empty object when none." }
        charges_breakdown:
          oneOf:
            - { $ref: '#/components/schemas/LoadChargesBreakdown' }
            - { type: 'null' }
          description: "Grantable — requires field grant. The charges breakdown last pushed through PATCH /loads/{id}, saved apart from the load charges. Null when none was pushed."
        destinations:
          type: array
          items: { $ref: '#/components/schemas/Destination' }

    DriverRoute:
      type: object
      description: |
        One planned route leg of a driver on a load. The leg connects `destination_from_id` to `destination_to_id`.
      properties:
        id:                  { type: integer }
        load_id:             { type: integer, description: "Parent load FK. Resolve via GET /loads/{id}." }
        driver_id:           { type: [ integer, 'null' ], description: "Driver FK. Resolve via GET /drivers/{id}." }
        destination_from_id: { type: [ integer, 'null' ], description: "Start stop FK. Resolve via GET /destinations/{id}." }
        destination_to_id:   { type: [ integer, 'null' ], description: "End stop FK. Resolve via GET /destinations/{id}." }
        position_from:       { type: [ integer, 'null' ], description: "Stop order of the start stop." }
        position_to:         { type: [ integer, 'null' ], description: "Stop order of the end stop." }
        route_type:          { type: [ string, 'null' ], enum: [practical, shortest, fastest, null] }
        toll_discouraged:    { type: boolean }
        created_at:          { type: string, format: date-time }
        updated_at:          { type: string, format: date-time }
        loaded_miles:        { type: string, description: "Planned loaded miles of this leg. Decimal-precision string, e.g. '450.5'." }
        empty_miles:         { type: string, description: "Planned empty (deadhead) miles of this leg. Decimal-precision string, e.g. '62.0'." }
        duration_loaded:     { type: [ string, 'null' ], description: "Planned loaded drive time in minutes. Decimal-precision string." }
        duration_empty:      { type: [ string, 'null' ], description: "Planned empty drive time in minutes. Decimal-precision string." }

    DriverRouteStateReport:
      type: object
      description: |
        Saved miles and tolls for one US state of one `DriverRoute`. This is the recorded data behind the IFTA mileage figures.
      properties:
        id:               { type: integer }
        driver_route_id:  { type: integer, description: "Parent driver route FK. Resolve via GET /driver_routes/{id}." }
        state:            { type: string, description: "US state code." }
        total_miles:      { type: string, description: "Decimal-precision string, e.g. '120.5'." }
        free_miles:       { type: string, description: "Decimal-precision string." }
        toll_miles:       { type: string, description: "Decimal-precision string." }
        ferry_miles:      { type: string, description: "Decimal-precision string." }
        tolls:            { type: string, description: "Toll amount. Decimal-precision string, e.g. '12.50'." }
        miles_type:       { type: string, enum: [empty_miles, loaded_miles] }
        created_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time }

    DriverRoutePath:
      type: object
      description: |
        Planned road line of a driver route leg, as stored by the route planner: a GeoJSON Feature whose MultiLineString coordinates are `[lng, lat]`.
      properties:
        id:               { type: integer, example: 42 }
        driver_route_id:  { type: integer, example: 17 }
        data:
          type: object
          description: The stored GeoJSON Feature, unchanged.

    GpsLog:
      type: object
      description: One truck or trailer GPS position report from a telematics device.
      properties:
        id:           { type: integer, example: 42 }
        vehicle_type: { type: string, enum: [Truck, Trailer], example: Truck }
        vehicle_id:   { type: integer, example: 17 }
        lat:          { type: number, format: float }
        lng:          { type: number, format: float }
        speed:        { type: number, format: float, description: "As reported by the telematics device; mph for Samsara and Motive." }
        heading:      { type: number, format: float, description: "Degrees, 0 to 360." }
        recorded_at:  { type: [ string, 'null' ], format: date-time, description: "GPS fix time as reported by the device (UTC)." }
        created_at:   { type: string, format: date-time, description: "When OpenRoad stored the position (UTC)." }

    Destination:
      type: object
      description: |
        A single stop on a load. Fields marked "grantable" require explicit grant from the Admin Panel.
      properties:
        id:                { type: integer }
        position:          { type: integer, description: "Stop order (1-indexed)" }
        stop_type:         { type: string, enum: [pick_up, delivery, trailer_pu, trailer_del] }
        stop_company_name: { type: [ string, 'null' ] }
        address:           { type: [ string, 'null' ] }
        city:              { type: [ string, 'null' ] }
        state_code:        { type: [ string, 'null' ] }
        zip_code:          { type: [ string, 'null' ] }
        region_code:       { type: [ string, 'null' ], description: "Grantable — requires field grant. Code of the account region that holds the first three characters of zip_code. Null when the zip code is blank, is not a US prefix or no region holds it. Filter with ?region_code[]=IL-CHI. Resolve via /regions." }
        lat:               { type: [ number, 'null' ] }
        lng:               { type: [ number, 'null' ] }
        on_time:           { type: [ boolean, 'null' ] }
        arrival_status:    { type: [ string, 'null' ], description: "e.g. 'on_time', 'late'" }
        drop_and_hook:     { type: [ boolean, 'null' ], description: "The driver does not wait for the trailer to be loaded or unloaded. Labeled 'Preloaded Trailer' on a pickup and 'Drop Trailer' on a delivery." }
        service_failure_reason: { type: [ string, 'null' ], description: "The reason of the live service failure record of the stop, as stored. Null when the stop has none. Details on /service_failures." }
        load_id:           { type: integer, description: "Parent load FK. Resolve via /loads." }
        driver_id:         { type: [ integer, 'null' ] }
        driver_assigned_by_id: { type: [ integer, 'null' ], description: "User who assigned the driver. Resolve via /users." }
        trailer_id:        { type: [ integer, 'null' ] }
        app_date:          { type: string, format: date }
        normalized_time_from: { type: [ string, 'null' ], format: date-time, description: "Appointment window start as a true instant: the dock appointment read in the stop's time_zone_id. Null when the stop has no time zone." }
        normalized_time_to:   { type: [ string, 'null' ], format: date-time, description: "Appointment window end as a true instant. Null when the stop has no time zone." }
        normalized_driver_time_to:   { type: [ string, 'null' ], format: date-time, description: "Driver appointment time of the stop, shown as 'Driver appt' on the Planner board, as a true instant. The application stores one driver appointment time. Null when the stop has no time zone." }
        time_zone_id:      { type: [ string, 'null' ], description: "IANA time zone of the stop, e.g. America/New_York. Use it to show a normalized time as local dock time." }
        time_in:           { type: [ string, 'null' ], format: date-time }
        time_out:          { type: [ string, 'null' ], format: date-time }
        driver_assigned_at: { type: [ string, 'null' ], format: date-time }
        created_at:        { type: string, format: date-time }
        updated_at:        { type: string, format: date-time }
        phone:             { type: [ string, 'null' ], description: "Grantable — requires field grant" }
        eta:               { type: [ string, 'null' ], format: date-time, description: "Grantable — requires field grant. Estimated arrival of the truck at the stop: the time of the last truck position plus the travel time of the route. Null when the stop has no driver, has a time_in, or no truck position is known." }
        eta_status:        { type: [ string, 'null' ], enum: [Late, Attention, "On Time", Early, null], description: "Grantable — requires field grant. Live ETA status of the stop: Late, Attention, On Time or Early. Refreshed about once a minute. Null when the account runs no ETA simulation, the stop has no simulation, or the ETA service does not answer. It never moves updated_at, so read the open loads instead of polling updated_at." }
        purchase_order_number: { type: [ string, 'null' ], description: "Grantable — requires field grant. Purchase order number of the stop." }
        delivery_order_number: { type: [ string, 'null' ], description: "Grantable — requires field grant. Delivery order number of the stop." }
        shipper_number:     { type: [ string, 'null' ], description: "Grantable — requires field grant. Shipper number of the stop." }
        pick_list_number:   { type: [ string, 'null' ], description: "Grantable — requires field grant. Pick list number of the stop." }
        special_handling:   { type: [ string, 'null' ], description: "Grantable — requires field grant. Free-text special handling instructions of the stop." }
        miles:              { type: [ string, 'null' ], description: "Grantable — requires field grant. Miles of the stop leg as entered on the stop. Decimal-precision string, e.g. '120.50'." }
        toll:               { type: string, description: "Grantable — requires field grant. Toll amount of the stop. Decimal-precision string, e.g. '12.00'." }
        driver_detention:   { type: [ string, 'null' ], description: "Grantable — requires field grant. Detention pay of the driver at the stop. Decimal-precision string, e.g. '50.00'." }

    Detention:
      type: object
      description: |
        A detention event for a destination. `destination_id` is stored on the row; `load_id` and `driver_id` are derived from the parent destination — they're exposed and filterable so partners don't have to pre-resolve via /destinations.
      properties:
        id:                  { type: integer, example: 9012 }
        destination_id:      { type: integer }
        load_id:             { type: integer, description: "Parent load FK (derived via destination). Resolve via /loads." }
        driver_id:           { type: [ integer, 'null' ], description: "Driver FK (derived via destination). Resolve via /drivers." }
        workflow_state:      { type: string, enum: [truck_arrived, truck_left, upcoming, started, ended, canceled] }
        started_at:          { type: [ string, 'null' ], format: date-time }
        ended_at:            { type: [ string, 'null' ], format: date-time }
        created_at:          { type: string, format: date-time }
        updated_at:          { type: string, format: date-time }
        upcoming_started_at: { type: [ string, 'null' ], format: date-time, description: "Grantable — requires field grant." }

    ServiceFailure:
      type: object
      description: |
        The service failure reason of one stop. One live record exists per stop; a deleted reason is not returned, and the stop on `/destinations` then moves its `updated_at` and returns `service_failure_reason` null.
      properties:
        id:                    { type: integer }
        load_id:               { type: integer, description: "Parent load. Resolve via /loads." }
        destination_id:        { type: integer, description: "The stop. Resolve via /destinations." }
        reason:                { type: string, description: "The reason of the stop, as stored. Offered on pick-ups and deliveries: `accident` (Accident), `driver_related` (Driver Related (OPS)), `mechanical_breakdown` (Mechanical (MNT)), `previous_stop` (Previous Stop (CUSTOMER)), `previous_load` (Previous Load (CS)), `weather_or_natural_disaster` (Weather or Natural Disaster), `traffic_delay` (Traffic (OPS)), `carrier_dispatch_error` (Carrier Dispatch Error (OPS)), `capacity_managers_error` (Capacity Manager Error (CAP)), `account_rep_error` (Account Rep Error (CS)), `data_department_error` (Data Department Error (CS)), `driver_not_available` (Driver Not Available (CAP)), `trailer_not_available` (Trailer Not Available (OPS)), `rescheduled_accident` (Rescheduled (Accident)), `rescheduled_driver_related` (Rescheduled (Driver Related) (OPS)), `rescheduled_mechanical` (Rescheduled (Maintenance) (MNT)), `rescheduled_previous_load` (Rescheduled (Previous Load) (CS)), `rescheduled_weather_or_natural_disaster` (Rescheduled (Weather or Natural Disaster)), `rescheduled_traffic` (Rescheduled (Traffic) (OPS)), `rescheduled_carrier_dispatch` (Rescheduled (Carrier Dispatch) (OPS)), `rescheduled_account_rep_error` (Rescheduled (Account Rep Error) (CS)), `rescheduled_data_error` (Rescheduled (DATA Error) (CS)), `rescheduled_capacity_error` (Rescheduled (Capacity Error) (CAP)), `rescheduled_trailer_not_available` (Rescheduled (Trailer Not Available) (OPS)), `rescheduled_driver_not_available` (Rescheduled (Driver Not Available) (CAP)), `rescheduled_customer_issue` (Rescheduled (Customer Issue)). Offered on deliveries only: `shipper_related` (Shipper Related (CUSTOMER)). Accepted, not offered in the stop form: `normal_status` (Normal Status), `other` (Other). Legacy, no longer offered: `consignee_related` (Consignee Related). Older records can hold a free-text label instead of a key, returned exactly as stored: \"Rescheduled (Carrier Issue)\", \"Normal Status (NS)\", \"Driver Related (AH)\", \"Previous Load (AG)\", \"Shipper Related (AM)\", \"Accident (AF)\", \"Capacity Managers Error (CM)\", \"Other (BG)\", \"Consignee Related (previous) (AG)\", \"Traffic Delay\"." }
        accountable_driver_id: { type: [ integer, 'null' ], description: "Set only for `driver_related` and `rescheduled_driver_related`; required when the account classifies service failures. Resolve via /drivers." }
        preventable:           { type: [ boolean, 'null' ], description: "True is Preventable, false is Non-preventable, null is not classified. Only accounts with the service failure accountability feature classify." }
        created_by_id:         { type: [ integer, 'null' ], description: "The user recorded on the create audit of the record: the user who first logged a reason on the stop. A later change keeps it. Null for a record copied by ORS-4235 that has no create audit. A later-deleted user keeps the id. Resolve via /users." }
        created_at:            { type: string, format: date-time, description: "When the reason was logged." }
        updated_at:            { type: string, format: date-time }

    FuelSurchargeEstimate:
      type: object
      description: |
        The fuel surcharge estimate of one load versus the load's own fuel surcharge. `id` is the load id — there is no separate estimate id on this endpoint. A load with no generated estimate returns `status`, `sub_status`, `mileage_version`, `estimated_fuel_surcharge`, `estimated_miles` and both variance fields as `null`; `fuel_surcharge` and `miles` come from the load and keep their values.
      properties:
        id:                              { type: integer, example: 48213, description: "The load id." }
        customer_load:                   { type: [ string, 'null' ] }
        customer_fsc_method_types:       { type: array, items: { type: string, enum: [matrix, breakthrough] }, description: "The fuel surcharge method types configured on the load's customer." }
        status:                          { type: [ string, 'null' ], enum: [processed, pending, failed, null], description: "Null when the load has no generated estimate." }
        sub_status:                      { type: [ string, 'null' ], enum: [missing_input, missing_lane, breakthrough_match_not_found, breakthrough_error, processing_accept, processing_regenerate, null] }
        mileage_version:                 { type: [ string, 'null' ], description: "The Trimble or Mile Maker matrix version behind the estimate's miles: `default` or a version number string such as `38`. Null for a load with no estimate, and for every other miles source.", example: "38" }
        fuel_surcharge:                  { type: [ string, 'null' ], description: "Grantable. The load's own fuel surcharge, in dollars. Decimal-precision string." }
        estimated_fuel_surcharge:        { type: [ string, 'null' ], description: "Grantable. The estimate's amount, in dollars. Decimal-precision string. Null without a generated estimate." }
        miles:                           { type: [ string, 'null' ], description: "Grantable. The load's own miles. Decimal-precision string." }
        estimated_miles:                 { type: [ string, 'null' ], description: "Grantable. The estimate's miles, in miles. Decimal-precision string. Null without a generated estimate." }
        fuel_surcharge_variance_percent: { type: [ string, 'null' ], description: "Grantable. `estimated_fuel_surcharge` against the load's own fuel surcharge, as a signed percent string. Null unless `status` is `processed`.", example: "-3.25" }
        miles_variance_percent:          { type: [ string, 'null' ], description: "Grantable. `estimated_miles` against the load's own miles, as a signed percent string. Null unless `status` is `processed`.", example: "-3.25" }

    FuelSurchargeMatrix:
      type: object
      description: |
        The fuel surcharge matrix of one customer from one `start_date`. The matrix in effect for a load is the one with the latest `start_date` on or before the load date. The fuel price is read `fuel_price_offset_days` days earlier, and a band matches when `from <= price <= to`. Fields marked "Grantable" need a field grant.
      properties:
        id:                     { type: integer, example: 31 }
        customer_id:            { type: integer, description: "Resolve via /customers." }
        start_date:             { type: string, format: date, description: "The first day the matrix is in effect." }
        fuel_price_offset_days: { type: integer, example: 7, description: "How many days before the load date the fuel price is read." }
        created_at:             { type: string, format: date-time }
        updated_at:             { type: string, format: date-time }
        rows:
          type: array
          description: "Grantable. The price bands as stored. A band matches when `from <= price <= to`, and `rate` is the surcharge per mile for that band."
          items:
            type: object
            properties:
              from: { type: number, example: 0.0, description: "Lowest fuel price of the band, in dollars per gallon." }
              to:   { type: number, example: 2.551, description: "Highest fuel price of the band, in dollars per gallon." }
              rate: { type: number, example: 0.05, description: "Surcharge per mile, in dollars." }
        url:            { type: [ string, 'null' ], description: "Grantable. A gogp link that redirects to the uploaded original file. Treat it as opaque. Null when the matrix has no uploaded file.", example: "https://app.openroadtms.com/api/ext/v1/fuel_surcharge_matrices/31/file?token=..." }
        url_expires_at: { type: [ string, 'null' ], format: date-time, description: "Grantable. When `url` stops working. Null when `url` is null." }

    FuelSurchargeMethod:
      type: object
      description: |
        How the fuel surcharge of a customer's loads is generated for one `load_type`. The `matrix_trimble_*` columns act only when `matrix_miles_source` is `trimble`, and the `matrix_mile_maker_*` columns only when it is `mile_maker`. Other rows may hold a stale value in the columns that do not act. A `breakthrough` method holds no `matrix_*` value.
      properties:
        id:                           { type: integer, example: 12 }
        customer_id:                  { type: integer, description: "Resolve via /customers." }
        method_type:                  { type: string, enum: [matrix, breakthrough] }
        load_type:                    { type: string, enum: [all, spot, contract], description: "The loads the method applies to." }
        default:                      { type: [ boolean, 'null' ] }
        matrix_formula:               { type: [ string, 'null' ], description: "One of `basic`. Null for a `breakthrough` method." }
        matrix_miles_source:          { type: [ string, 'null' ], description: "One of `lane`, `load`, `trimble`, `mile_maker`, `manual`. Null for a `breakthrough` method." }
        matrix_fuel_price_region:     { type: [ string, 'null' ], description: "One of `us`, `east_coast`, `new_england`, `midwest`, `california`, `west_coast_less_california`, `central_atlantic`, `lower_atlantic`, `west_coast`, `gulf_coast`, `rocky_mountain`. The `area_name` of /fuel_price_data. Null for a `breakthrough` method." }
        matrix_trimble_version:       { type: [ string, 'null' ], description: "One of `default`, `26`, `27`, `28`, `31`, `32`, `34`, `38`, `39`. Acts only when `matrix_miles_source` is `trimble`. An old row can hold a retired value." }
        matrix_trimble_route_type:    { type: [ string, 'null' ], description: "One of `practical`, `short`, `fast`. Acts only when `matrix_miles_source` is `trimble`." }
        matrix_trimble_stop_source:   { type: [ string, 'null' ], description: "One of `coordinates`, `zip`. Acts only when `matrix_miles_source` is `trimble`." }
        matrix_trimble_truck_size:    { type: [ string, 'null' ], description: "One of `default`, `53`. Acts only when `matrix_miles_source` is `trimble`." }
        matrix_mile_maker_version:    { type: [ string, 'null' ], description: "One of `default`, `19`. Acts only when `matrix_miles_source` is `mile_maker`. An old row can hold a retired value." }
        matrix_mile_maker_route_type: { type: [ string, 'null' ], description: "One of `practical`, `short`, `fast`; Mile Maker labels `fast` as Household Goods. Acts only when `matrix_miles_source` is `mile_maker`." }
        matrix_mile_maker_stop_source: { type: [ string, 'null' ], description: "One of `coordinates`. Acts only when `matrix_miles_source` is `mile_maker`." }
        matrix_mile_maker_truck_size: { type: [ string, 'null' ], description: "One of `53`. Acts only when `matrix_miles_source` is `mile_maker`." }
        created_at:                   { type: string, format: date-time }
        updated_at:                   { type: string, format: date-time }

    CustomerFuelSurchargeSetting:
      type: object
      description: |
        The fuel surcharge switches of one customer. `id` is the customer id. A customer with no saved settings returns the defaults. The thresholds are decimal strings from 0 to 100, in percent.
      properties:
        id:                                 { type: integer, description: "The customer id. Resolve via /customers." }
        fuel_surcharge_estimate_enabled:    { type: boolean, description: "Whether the customer takes part in the fuel surcharge estimate. False when never set." }
        auto_fsc_enabled:                   { type: boolean }
        auto_fsc_statuses:                  { type: array, items: { type: string, enum: [delivered, delivered_pending] }, example: [ delivered, delivered_pending ] }
        auto_fsc_difference_threshold:      { type: string, example: "5.0", description: "Decimal string, 0 to 100." }
        auto_linehaul_enabled:              { type: boolean }
        auto_linehaul_statuses:             { type: array, items: { type: string, enum: [delivered, delivered_pending] }, example: [ delivered, delivered_pending ], description: "A load reaching one of these statuses re-checks its linehaul rate against the matching lane rate; empty means no re-check." }
        auto_linehaul_difference_threshold: { type: string, example: "5.0", description: "Decimal string, 0 to 100. Max percent change of the linehaul rate a re-check applies; 0 means no limit; a load with no linehaul rate always takes the lane rate." }
        breakthrough_enabled:               { type: boolean }
        breakthrough_shipper_identifier:    { type: [ string, 'null' ] }

    HosLog:
      type: object
      description: |
        One hours-of-service clock sample of a driver, taken every 3 minutes. Carries the driver's active load at the moment of the sample.
        Compare consecutive samples of one driver to derive a load status change. Duration fields are milliseconds.
      properties:
        id:                         { type: integer, example: 481203 }
        driver_id:                  { type: integer, description: "FK to /drivers, derived from assigned_driver_id." }
        load_id:                    { type: [ integer, 'null' ], description: "FK to /loads." }
        current_duty_status_code:   { type: [ string, 'null' ], enum: [SLEEPER_BED, OFF_DUTY, DRIVING, DISCONNECTED, ON_DUTY, PERSONAL_CONVEYANCE, YARD_MOVE, null] }
        time_in_current_status:     { type: [ integer, 'null' ], description: "Milliseconds." }
        time_until_break:           { type: [ integer, 'null' ], description: "Milliseconds." }
        shift_drive_remaining:      { type: [ integer, 'null' ], description: "Milliseconds." }
        shift_remaining:            { type: [ integer, 'null' ], description: "Milliseconds." }
        cycle_remaining:            { type: [ integer, 'null' ], description: "Milliseconds." }
        cycle_tomorrow:             { type: [ integer, 'null' ], description: "Milliseconds." }
        driving_in_violation_today: { type: [ integer, 'null' ] }
        driving_in_violation_cycle: { type: [ integer, 'null' ] }
        daily_miles:                { type: [ string, 'null' ], description: "Decimal, returned as a string for precision." }
        created_at:                 { type: string, format: date-time }
        updated_at:                 { type: string, format: date-time }

    CustomerDetentionInfo:
      type: object
      description: |
        Aggregated detention totals for one customer over a time window. Not paginated — one record per request.
        Counts and duration are always returned. Monetary totals are grant-gated.
      properties:
        customer_id:        { type: integer, description: "The customer this summary is for." }
        from:               { type: string, format: date-time, description: "Window start (echoed from request)." }
        to:                 { type: string, format: date-time, description: "Window end (echoed from request)." }
        detentions_count:   { type: integer, description: "Number of ended detentions in the window." }
        destinations_count: { type: integer, description: "Number of destinations in the window that have any detention attached." }
        duration_minutes:   { type: integer, description: "Sum of ended-detention durations, in minutes." }
        estimated_amount:   { type: string, description: "Grantable. Sum of `detention_sum` across the customer's loads in the window. Decimal-precision string." }
        paid_out_amount:    { type: string, description: "Grantable. Sum of detention pay-outs (accessorials + external driver share). Decimal-precision string." }

    LoadNote:
      type: object
      description: |
        A free-form note attached to a load. Created via the external API or internally via the admin UI.
      properties:
        id:         { type: integer, example: 4821 }
        content:    { type: string, example: "Delivered early — receiver confirmed at 14:05." }
        user_id:    { type: [ integer, 'null' ], description: "Author User FK. Resolve via /users. Null for a note that a partner created." }
        category:   { type: string, example: "Load", description: "Free text, not an enum. A note created through this API takes the type of its parent. Values in use on notes of this kind: `Load`, `Load_Instructions`, `Load_Tracking`. Read any other value as a label." }
        author:     { type: [ string, 'null' ], description: "Who wrote the note: a user's full name, or for a note created through this API your application name, followed by ` - API`. Null when the note has no known author." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DriverNote:
      type: object
      description: |
        A free-form note attached to a driver. Same shape as LoadNote.
      properties:
        id:         { type: integer }
        content:    { type: string, example: "Driver completed annual safety review." }
        user_id:    { type: [ integer, 'null' ], description: "Author User FK. Resolve via /users. Null for a note that a partner created." }
        category:   { type: string, example: "Driver", description: "Free text, not an enum. A note created through this API takes the type of its parent. Values in use on notes of this kind: `Driver`, `DriverSafety`, `RouteAgreements`, `Driver_Customer_Service_Notes`. Read any other value as a label." }
        author:     { type: [ string, 'null' ], description: "Who wrote the note: a user's full name, or for a note created through this API your application name, followed by ` - API`. Null when the note has no known author." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DriverSafetyNote:
      type: object
      description: |
        A safety note on a driver profile: a category with its own points value, a free-form comment, or both. `note_date` is required on create. The note needs `comment` or `safety_setting_id` — a request with both blank returns 422.

        `safety_setting_id` is the identifier of the safety category. The category carries its own points value, and no endpoint lists the categories today.

        `user_id` is nullable. A note created through this API carries no author and shows as SYSTEM in the OpenRoad user interface.

        Safety Notes and Driver Notes are separate records in separate tables. `/drivers/{driver_id}/notes` returns the free-form notes of the driver profile, and it does not return a Safety Note created since February 2026. The safety notes that the profile held before that date were copied into the Safety Notes table, and their original rows stay on the Driver Notes endpoint. A client that reads both endpoints sees those older notes twice.
      properties:
        id:                 { type: integer }
        driver_id:          { type: integer }
        safety_setting_id:  { type: [ integer, 'null' ] }
        user_id:            { type: [ integer, 'null' ], description: "Null for a note created through this API. Shows as SYSTEM in the OpenRoad user interface." }
        comment:            { type: [ string, 'null' ], example: "Hard braking event" }
        note_date:          { type: string, format: date-time }
        created_at:         { type: string, format: date-time }
        updated_at:         { type: string, format: date-time }
        points:             { type: [ integer, 'null' ], description: "Optional — requires field grant" }

    DriverDocument:
      type: object
      description: |
        A file attached to a driver's Files section.
        The file keeps its original format. `content_type` and `size_bytes` describe the file as received.
        `upload_type` names the folder that holds the file on the driver's Files tab.
        The fields are `id`, `upload_name`, `upload_type`, `content_type`, `size_bytes`, `created_at`, `updated_at`, `url` and `url_expires_at`.
        `url` is the link to the bytes. Read it before `url_expires_at`.
        The link is a bearer credential until it expires. Do not log it. Do not store it.
        A record that predates storage-backed uploads returns a null `url` and a null `url_expires_at`. Its `content_type` comes from the file name, and its `size_bytes` is null.
      properties:
        id:           { type: integer }
        upload_name:  { type: [ string, 'null' ], example: "cdl.pdf", description: "The stored file name. Null when the record carries none." }
        upload_type:  { type: [ string, 'null' ], example: "cdl", description: "The folder of the file. A document appears only when your application holds its type on `driver_document_types`." }
        content_type: { type: [ string, 'null' ], example: "application/pdf", description: "The MIME type. Comes from the file name when no blob is stored, and is null when neither is known." }
        size_bytes:   { type: [ integer, 'null' ], example: 24576, description: "The size in bytes. Null when no blob is stored." }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }
        url:            { type: [ string, 'null' ], description: "A gogp link that redirects to the file bytes. Treat it as opaque. Do not store it. Grantable, so it is absent unless your application is granted it. Null when no file is stored.", example: "https://app.openroadtms.com/api/ext/v1/driver_documents/123/file?token=..." }
        url_expires_at: { type: [ string, 'null' ], format: date-time, description: "When `url` stops working. Grantable with `url`. Null when no file is stored." }

    DriverDocumentType:
      type: object
      description: |
        A grant list with no endpoint of its own. Each property names one `upload_type` of `/drivers/{driver_id}/documents`, and a field grant on `driver_document_types` opens that type.
        Five types are held by every application that holds `driver_documents`: `cdl`, `inspections`, `training_certificates`, `road_test` and `orientation_tests`. Every other type needs its own grant.
        A document of a type your application does not hold is absent from the list, answers 404 on retrieve, and its link answers 404 at once, so a revoked type closes the links already issued.
        An upload of a type your application does not hold answers 400 with field `upload_type`.
      properties:
        cdl:
          type: boolean
          description: "Held by default. The `cdl` folder of the driver Files tab, readable and creatable by every application that holds `driver_documents`."
        inspections:
          type: boolean
          description: "Held by default. The `inspections` folder of the driver Files tab, readable and creatable by every application that holds `driver_documents`."
        training_certificates:
          type: boolean
          description: "Held by default. The `training_certificates` folder of the driver Files tab, readable and creatable by every application that holds `driver_documents`."
        road_test:
          type: boolean
          description: "Held by default. The `road_test` folder of the driver Files tab, readable and creatable by every application that holds `driver_documents`."
        orientation_tests:
          type: boolean
          description: "Held by default. The `orientation_tests` folder of the driver Files tab, readable and creatable by every application that holds `driver_documents`."
        mvr:
          type: boolean
          description: "Grantable. Requires a field grant on `driver_document_types`. The `mvr` folder of the driver Files tab."
        psp_attachment:
          type: boolean
          description: "Grantable. Requires a field grant on `driver_document_types`. The `psp_attachment` folder of the driver Files tab."
        clearinghouse:
          type: boolean
          description: "Grantable. Requires a field grant on `driver_document_types`. The `clearinghouse` folder of the driver Files tab."
        application:
          type: boolean
          description: "Grantable. Requires a field grant on `driver_document_types`. The `application` folder of the driver Files tab."
        previous_employment:
          type: boolean
          description: "Grantable. Requires a field grant on `driver_document_types`. The `previous_employment` folder of the driver Files tab."
        previuos_employment_request:
          type: boolean
          description: "Grantable. Requires a field grant on `driver_document_types`. The `previuos_employment_request` folder of the driver Files tab. The name keeps the spelling of the stored value."
        written_warnings:
          type: boolean
          description: "Grantable. Requires a field grant on `driver_document_types`. The `written_warnings` folder of the driver Files tab."
        passenger_release_form:
          type: boolean
          description: "Grantable. Requires a field grant on `driver_document_types`. The `passenger_release_form` folder of the driver Files tab."
        medical_card:
          type: boolean
          description: "Grantable. Requires a field grant on `driver_document_types`. The `medical_card` folder of the driver Files tab. Documents of this type cannot be created through the API."
        drug_test:
          type: boolean
          description: "Grantable. Requires a field grant on `driver_document_types`. The `drug_test` folder of the driver Files tab. Documents of this type cannot be created through the API."
        tax_documents:
          type: boolean
          description: "Grantable. Requires a field grant on `driver_document_types`. The `tax_documents` folder of the driver Files tab. Documents of this type cannot be created through the API."
        employment_eligibility:
          type: boolean
          description: "Grantable. Requires a field grant on `driver_document_types`. The `employment_eligibility` folder of the driver Files tab. Documents of this type cannot be created through the API."
        misc_docs:
          type: boolean
          description: "Grantable. Requires a field grant on `driver_document_types`. The `misc_docs` folder of the driver Files tab."
        company_policy_receipts:
          type: boolean
          description: "Grantable. Requires a field grant on `driver_document_types`. The `company_policy_receipts` folder of the driver Files tab."
        driver_qualification:
          type: boolean
          description: "Grantable. Requires a field grant on `driver_document_types`. The `driver_qualification` folder of the driver Files tab."
        occupation_insurance:
          type: boolean
          description: "Grantable. Requires a field grant on `driver_document_types`. The `occupation_insurance` folder of the driver Files tab."
        operational_agreement:
          type: boolean
          description: "Grantable. Requires a field grant on `driver_document_types`. The `operational_agreement` folder of the driver Files tab."
        driver_app:
          type: boolean
          description: "Grantable. Requires a field grant on `driver_document_types`. The `driver_app` folder of the driver Files tab."

    DriverChangeLog:
      type: object
      description: |
        One change to the driver profile, or to a document or note attached to it. `record_type` names the changed resource, `record_id` its row.

        `changes` lists only the fields your application can already read on the resource that owns `record_type`. A field with no grant on that resource never appears, whatever the requested `field` filter: `passport_no` never appears, and `soc_sec_no` appears only with the `soc_sec_no` field grant on drivers.

        A `DriverEmploymentEvent` entry is one Hire, Termination or Rehire of the driver. Its `changes` carry the fields of the `DriverEmploymentEvent` schema, each only with its field grant. An edit of an event links to it by `record_id`. An entry written by the backfill of past events has `changed_by` null and is dated at the backfill run; the real date of the event is its `event_date`. To read the events of one type, read the `event_type` value of the `create` entry of each event.
      properties:
        id:             { type: integer }
        driver_id:      { type: integer }
        record_type:    { type: string, enum: [Driver, Upload, Note, DriverEmploymentEvent] }
        record_id:      { type: integer }
        action:         { type: string, enum: [create, update, destroy] }
        changed_by_id:  { type: [ integer, 'null' ], description: "The user who made the change. Null for a system-made change." }
        changed_by:     { type: [ string, 'null' ], description: "Who made the change: a user's full name, your application name for a change made through this API, followed by ` - API`, or another system label. Null when unknown." }
        created_at:     { type: string, format: date-time, description: "When the change was made." }
        changes:
          type: array
          items:
            type: object
            properties:
              field:     { type: string, example: "fleet_group" }
              old_value: { description: "The value before the change. Null on a `create` entry. Carries mixed JSON types, so no single type is declared." }
              new_value: { description: "The value after the change. Null on a `destroy` entry. Carries mixed JSON types, so no single type is declared." }

    DriverEmploymentEvent:
      type: object
      description: |
        A change-log source with no endpoint of its own. The Hire, Termination and Rehire events of a driver appear as `DriverEmploymentEvent` entries of `GET /drivers/{driver_id}/change_logs`, and each property below is a field of the `changes` array of such an entry.
        Every field is grantable: a grant on `driver_employment_events` is a field grant only, and no application holds it by default. Without the grant, the `Driver` entries stay in the list and no employment entry appears.
        An event is created with its type, so filter by event type by reading `event_type` on the `create` entry. The `created_at` range filter of the endpoint filters the change time; `event_date` is the date entered for the action.
        `eligible_for_rehire` and `new_employer` of the termination modal arrive on the `Driver` entry of the same save, under the field grants of drivers.
      properties:
        event_type:
          type: [ string, 'null' ]
          enum: [hire, termination, rehire, null]
          description: "Grantable — requires field grant. `hire` is Hire, `termination` is Termination and `rehire` is Rehire."
        event_date:
          type: [ string, 'null' ]
          format: date
          description: "Grantable — requires field grant. The date entered for the action. Null only for a backfilled Termination that has no date."
        reason_for_termination:
          type: [ string, 'null' ]
          description: "Grantable — requires field grant. Termination only. One of voluntary_reason, involuntary_reason, internal_transfer. A legacy value can appear on a backfilled event, so the list is not closed."
        voluntary_reason:
          type: [ array, 'null' ]
          items: { type: string }
          description: "Grantable — requires field grant. Termination only. Populated when reason_for_termination is voluntary_reason. Values: home_time, unsatisfied_with_pay, other_sector, unsatisfied_with_ops, change_of_career, expectations_not_met, recent_pip, transport_operations, recruiting, accounting_internal_operations, safety_rules, fleet_maintenance, family_reasons, family_emergency, health_related_reasons, approved_extended_absence, new_opportunities, misalignment_of_values_and_company_culture, personal_reasons, personal_documentation, job_abandonment, failure_to_undertake_post_role, retired, fleet_realignment, other, plus internal_transfer. A legacy value can appear."
        involuntary_reason:
          type: [ array, 'null' ]
          items: { type: string }
          description: "Grantable — requires field grant. Termination only. Populated when reason_for_termination is involuntary_reason. Same values as involuntary_reason of Driver. A legacy value can appear."
        termination_notes:
          type: [ string, 'null' ]
          description: "Grantable — requires field grant. Termination only. Free text."
        rehire_note:
          type: [ string, 'null' ]
          description: "Grantable — requires field grant. Rehire only. Free text."

    LoadChangeLog:
      type: object
      description: |
        One change to a load, to one of its stops, or to a note or document attached to it. `record_type` names the changed resource, `record_id` its row.

        `changes` lists only the fields your application can already read on the resource that owns `record_type`.

        A driver's tap in the mobile app appears as changes of `pending_by`, `accepted_by`, `rejected_by`, `in_transit_by`, `delivered_by` and `rejection_notes`, each only with its field grant on loads. The internal `driver_status` key never appears.
      properties:
        id:             { type: integer }
        load_id:        { type: integer }
        record_type:    { type: string, enum: [Load, Destination, ServiceFailure, Note, Upload] }
        record_id:      { type: integer }
        destination_id: { type: [ integer, 'null' ], description: "The stop of a ServiceFailure entry, a deleted record included. Null for every other record type." }
        action:         { type: string, enum: [create, update, destroy] }
        changed_by_id:  { type: [ integer, 'null' ], description: "The user who made the change. Null for a system-made change." }
        changed_by:     { type: [ string, 'null' ], description: "Who made the change: a user's full name, your application name for a change made through this API, followed by ` - API`, or another system label. Null when unknown." }
        created_at:     { type: string, format: date-time, description: "When the change was made." }
        changes:
          type: array
          items:
            type: object
            properties:
              field:     { type: string, example: "status" }
              old_value: { description: "The value before the change. Null on a `create` entry. Carries mixed JSON types, so no single type is declared." }
              new_value: { description: "The value after the change. Null on a `destroy` entry. Carries mixed JSON types, so no single type is declared." }

    LoadMobileChangeLog:
      type: object
      description: |
        One change that a driver of the load made from the mobile app, to the load or to one of its documents. Same fields and visibility rules as LoadChangeLog. A driver's tap appears as changes of `pending_by`, `accepted_by`, `rejected_by`, `in_transit_by`, `delivered_by` and `rejection_notes`, each only with its field grant on loads. The internal `driver_status` key never appears.
      properties:
        id:             { type: integer }
        load_id:        { type: integer }
        record_type:    { type: string, enum: [Load, Upload] }
        record_id:      { type: integer }
        action:         { type: string, enum: [create, update, destroy] }
        changed_by_id:  { type: [ integer, 'null' ], description: "The mobile user who made the change." }
        changed_by:     { type: [ string, 'null' ], description: "The full name of the user who made the change. Null when unknown." }
        created_at:     { type: string, format: date-time, description: "When the change was made." }
        changes:
          type: array
          items:
            type: object
            properties:
              field:     { type: string, example: "status" }
              old_value: { description: "The value before the change. Null on a `create` entry. Carries mixed JSON types, so no single type is declared." }
              new_value: { description: "The value after the change. Null on a `destroy` entry. Carries mixed JSON types, so no single type is declared." }

    CustomerDocument:
      type: object
      description: |
        A file attached to a customer's Files section.
        The fields are `id`, `upload_name`, `upload_type`, `content_type`, `size_bytes`, `created_at`, `updated_at`, `url` and `url_expires_at`.
        `url` is the link to the bytes. Read it before `url_expires_at`.
        `upload_type` is a year string, because the customer Files tab holds one folder for each year.
        A record that predates storage-backed uploads returns a null `url` and a null `url_expires_at`. Its `content_type` comes from the file name, and its `size_bytes` is null.
      properties:
        id:           { type: integer }
        upload_name:  { type: [ string, 'null' ], example: "contract.pdf", description: "The stored file name. Null when the record carries none." }
        upload_type:  { type: [ string, 'null' ], example: "2026" }
        content_type: { type: [ string, 'null' ], example: "application/pdf", description: "The MIME type. Comes from the file name when no blob is stored, and is null when neither is known." }
        size_bytes:   { type: [ integer, 'null' ], example: 24576, description: "The size in bytes. Null when no blob is stored." }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }
        url:            { type: [ string, 'null' ], description: "A gogp link that redirects to the file bytes. Treat it as opaque. Do not store it. Grantable, so it is absent unless your application is granted it. Null when no file is stored.", example: "https://app.openroadtms.com/api/ext/v1/documents/123/file?token=..." }
        url_expires_at: { type: [ string, 'null' ], format: date-time, description: "When `url` stops working. Grantable with `url`. Null when no file is stored." }

    AccidentDocument:
      type: object
      description: |
        A file attached to an accident. The file is dashcam video, a photo, a police report or a claim PDF.
        The fields are `id`, `upload_name`, `upload_type`, `content_type`, `size_bytes`, `created_at`, `updated_at`, `url` and `url_expires_at`.
        `url` is the link to the bytes. Read it before `url_expires_at`.
        The link is a bearer credential until it expires. Do not log it. Do not store it.
        `upload_type` is a free-text label with no validated set. Most records in production hold `attachment`. Do not depend on a fixed set of values.
        A record that predates storage-backed uploads returns a null `url` and a null `url_expires_at`. Its `content_type` comes from the file name, and its `size_bytes` is null.
        The resource is read-only.
      properties:
        id:           { type: integer }
        upload_name:  { type: [ string, 'null' ], example: "dashcam.mp4", description: "The stored file name. Null when the record carries none." }
        upload_type:  { type: [ string, 'null' ], example: "attachment" }
        content_type: { type: [ string, 'null' ], example: "video/mp4", description: "The MIME type. Comes from the file name when no blob is stored, and is null when neither is known." }
        size_bytes:   { type: [ integer, 'null' ], example: 125829120, description: "The size in bytes. Null when no blob is stored." }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }
        url:            { type: [ string, 'null' ], description: "A gogp link that redirects to the file bytes. Treat it as opaque. Do not store it. Grantable, so it is absent unless your application is granted it. Null when no file is stored.", example: "https://app.openroadtms.com/api/ext/v1/documents/123/file?token=..." }
        url_expires_at: { type: [ string, 'null' ], format: date-time, description: "When `url` stops working. Grantable with `url`. Null when no file is stored." }

    LoadDocument:
      type: object
      description: |
        A file of the load Documents section, or the driver's miscellaneous upload.
        The fields are `id`, `upload_name`, `upload_type`, `content_type`, `size_bytes`, `uploaded_by_id`, `verification_status`, `confirmed`, `created_at`, `updated_at`, `url` and `url_expires_at`.
        `url` is the link to the bytes. Read it before `url_expires_at`.
        The link is a bearer credential until it expires. Do not log it. Do not store it.
        `upload_type` is one of `rate_confirmation`, `bill_of_lading`, `bol`, `lumper_receipt`, `scale_ticket`, `other` or `misc`.
        A record that predates storage-backed uploads returns a null `url` and a null `url_expires_at`. Its `content_type` comes from the file name, and its `size_bytes` is null.
      properties:
        id:           { type: integer }
        upload_name:  { type: [ string, 'null' ], example: "rate_confirmation.pdf", description: "The stored file name. Null when the record carries none." }
        upload_type:  { type: [ string, 'null' ], enum: [rate_confirmation, bill_of_lading, bol, lumper_receipt, scale_ticket, other, misc, null] }
        content_type: { type: [ string, 'null' ], example: "application/pdf", description: "The MIME type. Comes from the file name when no blob is stored, and is null when neither is known." }
        size_bytes:   { type: [ integer, 'null' ], example: 51200, description: "The size in bytes. Null when no blob is stored." }
        uploaded_by_id:      { type: [ integer, 'null' ], description: "The user who uploaded the document: a staff user, or the driver's mobile user." }
        verification_status: { type: [ string, 'null' ], enum: [approved, needs_review, null], description: "The result of the automatic document check. Null when the document was not checked." }
