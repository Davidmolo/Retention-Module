  /loads/{load_id}/documents:
    get:
      tags: [Load Documents]
      summary: List documents on a load
      description: |
        Returns a paginated, sortable, filterable list of documents of the load Documents section, newest first. When your application is granted them, each document carries a `url` link and its `url_expires_at`; a document with no stored file returns both as null.

        `upload_type` groups the documents by Documents-section folder:

        | Section | `upload_type` values |
        |---|---|
        | Rate Confirmation | `rate_confirmation` |
        | Proof of Delivery | `bill_of_lading` |
        | Bill of Lading | `bol` |
        | Lumper Receipt | `lumper_receipt` |
        | Scale Ticket | `scale_ticket` |
        | Other | `other` |
        | Driver Miscellaneous | `misc` |

        A driver upload that accounting has not confirmed yet is not listed, unless you send `include_unconfirmed=true`. A document appears in the default list once accounting confirms it, and `updated_at` moves at that moment.
      operationId: listLoadDocuments
      parameters:
        - name: load_id
          in: path
          required: true
          description: Load ID
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, updated_at, '-created_at', '-updated_at']
        - name: include_unconfirmed
          in: query
          description: Send `true` to list the driver uploads that accounting has not confirmed yet as well. Each document carries `confirmed` and `verification_status`.
          schema: { type: boolean, default: false }
        - name: upload_type
          in: query
          description: Filter by document type. Use `?upload_type[]=a&upload_type[]=b` for multiple values (OR).
          schema:
            type: string
            enum: [rate_confirmation, bill_of_lading, bol, lumper_receipt, scale_ticket, other, misc]
        - name: updated_at
          in: query
          description: Filter by update time. Use `?updated_at[gte]=`, `[gt]`, `[lte]` or `[lt]` with an ISO 8601 timestamp.
          schema: { type: string, format: date-time }
        - name: created_at
          in: query
          description: Filter by creation time. Use `?created_at[gte]=`, `[gt]`, `[lte]` or `[lt]` with an ISO 8601 timestamp.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LoadDocument' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    post:
      tags: [Load Documents]
      summary: Upload a document to a load
      description: |
        Uploads a file (multipart/form-data) to the load Documents section, in the folder of `upload_type`. Your application needs the `load_documents` create grant, given apart from the list grant; without it the upload answers 403. A `rate_confirmation` upload also becomes the load's Rate conf. link. The file keeps the type sent, is saved as confirmed with no Accounting confirmation step, and sends no email. An upload runs no Damage & Shortage scan and no BOL weight reading. A PDF Proof of Delivery (`bill_of_lading`) goes to FourKites as an ePOD when OpenRoad has turned on FourKites ePOD forwarding for your account and the customer has FourKites ePOD enabled; an image or other file does not. Upload is allowed at every load status, Closed included, and only to a load of your application's account. A file whose name the load already holds is saved as `<name> (2).<extension>`, then `(3)`; names compare case-sensitively. The load history logs the upload with the file name, the type and `<application name> - API`. The response carries the created document.

        **Constraints:**
          * Max file size: 25 MB
          * Allowed content types: `application/pdf`, `image/jpeg`, `image/png`, `application/msword`, `application/vnd.openxmlformats-officedocument.wordprocessingml.document`, `application/vnd.ms-excel`, `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`, `text/csv`, `text/plain`
          * Allowed extensions: `.pdf`, `.jpg`, `.jpeg`, `.png`, `.doc`, `.docx`, `.xls`, `.xlsx`, `.csv`, `.txt`
          * The invoice combined PDF takes only PDF and image files, so a DOCX, XLSX, CSV or TXT document uploads and lists but stays out of that PDF.
          * `upload_type` is **required**.

        **Curl example:**
        ```
        curl -X POST https://openroadtms.com/api/ext/v1/loads/42/documents \
             -u "$CLIENT_ID:$CLIENT_SECRET" \
             -F "file=@/path/to/pod.pdf" \
             -F "upload_type=bill_of_lading"
        ```
      operationId: createLoadDocument
      parameters:
        - name: load_id
          in: path
          required: true
          description: Load ID
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, upload_type]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload. Required.
                upload_type:
                  type: string
                  enum: [rate_confirmation, bill_of_lading, bol, lumper_receipt, scale_ticket, other]
                  description: |
                    Required. The folder of the load Documents section. Any other value, `misc` (Driver Miscellaneous) included, answers 400 with field `upload_type`; send such a file as `other`.

                    | `upload_type` | Section |
                    |---|---|
                    | `rate_confirmation` | Rate Confirmation |
                    | `bill_of_lading` | Proof of Delivery (sets the load's POD uploaded indicator) |
                    | `bol` | Bill of Lading |
                    | `lumper_receipt` | Lumper Receipt |
                    | `scale_ticket` | Scale Ticket |
                    | `other` | Other |
      responses:
        '201':
          description: Document uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LoadDocument' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

