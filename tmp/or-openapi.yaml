          in: query
          description: Filter by load ID. Multi-value supported.
          schema: { type: integer }
        - name: place_id
          in: query
          description: "Filter by the stored place of the row. Multi-value supported. Needs the `place_id` field grant, else 400 `unknown_field`. A row of a merged place matches its stored place, not the merge target that the `place_id` field shows."
          schema: { type: integer }
