  /loads/{load_id}/full_pdf:
    get:
      tags: [Load Full PDF]
      summary: Retrieve the Full PDF link of a load
      description: |
        Returns the link to the Full PDF of one load, the file the Full PDF button of the load page builds: the invoice, the rate confirmation, the confirmed POD (`bill_of_lading`), the lumper receipts and the scale tickets. Singleton, so it has no list shape. `load_id` is always returned. `url` and `url_expires_at` are grantable and granted together. Fetch `url` as given; it answers `200` with the PDF.

        The Full PDF exists when the load is Exported or later **and** holds a confirmed POD. Otherwise this endpoint answers `422 validation_error`, with one `error.details` entry for each missing part: `field: status` with the current status as `value`, and `field: pod` with a null `value`.
      operationId: getLoadFullPdf
      parameters:
        - name: load_id
          in: path
          required: true
          description: Load ID
          schema: { type: integer }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LoadFullPDF' }
                  error:
                    type: 'null'
                    example: null
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The load has no invoice yet, no confirmed POD, or neither.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                data: null
                error:
                  code: validation_error
                  message: "Validation failed"
                  details:
                    - field: status
                      code: invalid_value
                      message: "the invoice exists from Exported onward; the load is Delivered (delivered)"
                      value: delivered
                    - field: pod
                      code: invalid_value
                      message: "the load has no confirmed POD (bill_of_lading)"
                      value: null
                meta:
                  request_id: "8f3a-c4e2-bb19-2f7d"
                  timestamp: "2026-04-14T12:00:00Z"

