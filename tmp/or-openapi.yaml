  /destinations/{id}:
    get:
      tags: [Destinations]
      summary: Retrieve a destination
      operationId: getDestination
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Destination' }
                  error:
                    type: 'null'
                    example: null
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Destinations]
      summary: Update the times and the address of a stop
      description: |
        Writes the appointment window, the actual times or the address of one stop. Every key of `destination` is optional. The stop is saved through its load, the same way as the OpenRoad interface: the arrival and departure follow-ups, the EDI 214 updates and the trailer locations of the load run after the save.

        `time_in` and `time_out` are marked as edited by a user. A `time_in` or `time_out` in the future returns 422 with field `time_in` or `time_out`. A `normalized_time_from` after `normalized_time_to` returns 422 with field `normalized_time_to`. A `normalized_time_from`, `normalized_time_to` or `normalized_driver_time_to` more than 1 year ahead returns 422 with field `normalized_time_from`, `normalized_time_to` or `normalized_driver_time_to`. `app_date` is not writable: it follows `normalized_time_from`.

        `normalized_time_from`, `normalized_time_to` and `normalized_driver_time_to` are ISO 8601 instants with an offset, for example `2026-10-29T14:00:00-04:00`. The API reads each instant in the `time_zone_id` of the stop and saves its local dock time. A stop with no `time_zone_id` returns 422 with field `time_zone_id`. A value with no offset returns 422 with the field of the value. `normalized_driver_time_to` is the driver appointment time; `null` clears it. The write has no 2-hour driver appointment lock and runs no account driver-time reset. A driver appointment earlier than the previous stop or later than the next stop of the same driver returns 422 with field `base`.

        An address needs its coordinates. When the body holds any of `address`, `city`, `state_code` or `zip_code`, it must hold both `lat` and `lng`; the missing one returns 400 with code `missing_parameter`. A blank `address` returns 422.

        A stop of a load whose stored status is one of the account locked statuses returns 422 with field `status` and changes nothing. A stop of another account returns 404.
      operationId: updateDestination
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination]
              properties:
                destination:
                  type: object
                  properties:
                    normalized_time_from: { type: string, format: date-time, description: "Start of the appointment window as an instant with a UTC offset (e.g. 2026-10-29T14:00:00-04:00). Read in the time_zone_id of the stop. Needs a time_zone_id on the stop." }
                    normalized_time_to:   { type: string, format: date-time, description: "End of the appointment window as an instant with a UTC offset. Not before normalized_time_from." }
                    normalized_driver_time_to: { type: [ string, 'null' ], format: date-time, description: "Driver appointment time as an instant with a UTC offset. Read in the time_zone_id of the stop. Null clears it." }
                    time_in:   { type: [ string, 'null' ], format: date-time, description: "Actual arrival. Not in the future." }
                    time_out:  { type: [ string, 'null' ], format: date-time, description: "Actual departure. Not in the future." }
                    address:    { type: string, description: "Needs lat and lng." }
                    city:       { type: string, description: "Needs lat and lng." }
                    state_code: { type: string, description: "Needs lat and lng." }
                    zip_code:   { type: string, description: "Needs lat and lng." }
                    lat:        { type: number, description: "Latitude. Required with an address field." }
                    lng:        { type: number, description: "Longitude. Required with an address field." }
            example:
              destination:
                time_in: "2026-10-01T14:05:00Z"
                time_out: "2026-10-01T15:20:00Z"
                normalized_driver_time_to: "2026-10-01T13:30:00-04:00"
      responses:
        '200':
          description: Stop updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Destination' }
                  error:
                    type: 'null'
                    example: null
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

