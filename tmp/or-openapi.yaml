  /load_billing_statuses/{id}:
    patch:
      tags: [Load Billing Statuses]
      summary: Change the billing status of a load
      description: |
        Moves a load to Pending to Bill (`billed_pending`), Billed-Pending Accessorials (`billed_pending_acc`), Billed (`billed`), Paid (`closed`), Open Balance (`open_balance`) or Exported (`exported`). The `id` is the load id.

        `billed_pending` is accepted only from `delivered`, `delivered_pending`, `missing_paperwork` or `billed_pending`. `billed_pending_acc` is accepted only from `billed_pending` or `billed_pending_acc`. `billed` is accepted only from `exported` or `billed`. `closed` is accepted only from `billed`, `billed_pending`, `billed_pending_acc`, `exported` or `open_balance`. `open_balance` is accepted only from `billed`, `open_balance` or `exported`. `exported` is accepted only from `delivered` or `exported`. It changes the status only, as the Exported label of the status modal does: nothing goes to Sage or QuickBooks, and Automatic Export, which reads only `delivered`, `delivered_pending` and `tonu` loads, does not export the load again. Any other source status returns 422 with field `status`, and so does a status outside the six. Sending the status the load already holds returns 200 and changes no status. This path does not check the locked statuses. Every accepted call refreshes the Available Balance of the customer.

        The change writes a load log row and refreshes the Available Balance of the customer. A move to `billed` or `billed_pending_acc` also sets the Billed Date of the load. It changes the status only: it creates no billing snapshot, sends no invoice email or customer status notification, runs no QuickBooks export and sends no EDI 210 or 214. A load of another account returns 404.
      operationId: updateLoadBillingStatus
      parameters:
        - name: id
          in: path
          required: true
          description: The load id.
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [load_billing_status]
              properties:
                load_billing_status:
                  type: object
                  required: [status]
                  properties:
                    status: { type: string, enum: [billed_pending, billed_pending_acc, billed, closed, open_balance] }
            examples:
              exported_to_billed:
                summary: Exported to Billed (PATCH /load_billing_statuses/2283217)
                value:
                  load_billing_status:
                    status: billed
              delivered_to_pending_to_bill:
                summary: Delivered to Pending to Bill
                value:
                  load_billing_status:
                    status: billed_pending
      responses:
        '200':
          description: Billing status written, or already held
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LoadBillingStatus' }
                  error:
                    type: 'null'
                    example: null
                  meta: { $ref: '#/components/schemas/Meta' }
              example:
                data:
                  id: 2283217
                  status: billed
                  updated_at: '2026-10-22T09:15:00-05:00'
                error: null
                meta:
                  request_id: 8f3a-c4e2-bb19-2f7d
                  timestamp: '2026-10-22T14:15:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /load_flags:
    get:
      tags: [Load Flags]
      summary: List load flags
      description: |
        Returns a paginated list of customer service flags on loads, scoped to the authenticated application's account.

        Not every load has a `load_flags` row. A load with no row carries no flag: `preloaded`, `on_hold`, `unscheduled` and `cs_done` are all false.
      operationId: listLoadFlags
      parameters:
