  /award_lanes:
    get:
      tags: [Award Lanes]
      summary: List award lanes
      description: |
        Returns a paginated list of the awarded contract lanes of the account, newest first by default. A lane belongs to one bid (`aggregated_sales_lane_bid_id`) and one customer.

        ZIP filters match the stored prefix exactly: `pu_zip_prefix=606` returns the lanes stored with the prefix `606`, and no lane stored as `60601`.

        `status` is computed from today against the validity dates, inclusive: `active` when `validity_date_from <= today <= validity_date_to`, `future` when `validity_date_from > today`, and `expired` when `validity_date_to < today`.

        `/lane_bids` `status` is the stored bid stage (`initial`, `active`, `finalization`, `award`), while `/award_lanes` `status` is the computed validity state (`active`, `future`, `expired`). The two resources join by `aggregated_sales_lane_bid_id` on `/award_lanes`, which is the `id` of `/lane_bids`.
      operationId: listAwardLanes
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [validity_date_from, validity_date_to, created_at, updated_at, '-validity_date_from', '-validity_date_to', '-created_at', '-updated_at']
        - name: id
          in: query
          description: Filter by lane id. Multi-value supported.
          schema: { type: integer }
        - name: customer_id
          in: query
          description: Filter by customer. Multi-value supported.
          schema: { type: integer }
        - name: customer_bid_id
          in: query
          description: Filter by the customer's bid id. Multi-value supported.
          schema: { type: string }
        - name: customer_lane_id
          in: query
          description: Filter by the customer's lane id. Multi-value supported.
          schema: { type: string }
        - name: lane_name
          in: query
          description: Filter by the Lane Name of the bid upload (Contract Bid Name), exact match. Multi-value supported.
          schema: { type: string }
        - name: pu_state
          in: query
          description: Filter by pickup state. Multi-value supported.
          schema: { type: string }
        - name: pu_zip_prefix
          in: query
          description: Filter by the stored pickup ZIP prefix, exact match. Multi-value supported.
          schema: { type: string }
        - name: del_state
          in: query
          description: Filter by delivery state. Multi-value supported.
          schema: { type: string }
        - name: del_zip_prefix
          in: query
          description: Filter by the stored delivery ZIP prefix, exact match. Multi-value supported.
          schema: { type: string }
        - name: trailer_type
          in: query
          description: Filter by trailer type. Multi-value supported.
          schema: { type: string, enum: [van, reefer, flatbed, other] }
        - name: validity_date_from
          in: query
          description: Filter by the first day of the lane validity. Accepts range, for example `?validity_date_from[gte]=2026-01-01`.
          schema: { type: string, format: date }
        - name: validity_date_to
          in: query
          description: Filter by the last day of the lane validity. Accepts range, for example `?validity_date_to[lte]=2026-12-31`.
          schema: { type: string, format: date }
        - name: created_at
          in: query
          description: Filter by creation time. Accepts range, for example `?created_at[gte]=2026-01-01T00:00:00Z`.
          schema: { type: string, format: date-time }
        - name: updated_at
          in: query
          description: Filter by update time. Accepts range, for example `?updated_at[gte]=2026-01-01T00:00:00Z`.
          schema: { type: string, format: date-time }
        - name: status
          in: query
          description: Filter by the computed validity status (`active`, `future`, `expired`), not the stored bid stage of `/lane_bids`. Any other value answers 400.
          schema: { type: string, enum: [active, future, expired] }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AwardLane' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

