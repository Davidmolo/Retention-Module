  /availability_events:
    get:
      tags: [Availability Events]
      summary: List driver availability events
      description: |
        Returns a paginated, sortable, filterable list of driver availability windows scoped to the authenticated application's account. Use to plan around driver off-duty, planned, hometime, and loaded states.
      operationId: listAvailabilityEvents
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          description: Sort field. Prefix with `-` for descending.
          schema:
            type: string
            enum: [start_date, end_date, created_at, updated_at, '-start_date', '-end_date', '-created_at', '-updated_at']
        - name: driver_id
          in: query
          description: Filter by driver ID. Multi-value supported.
          schema: { type: integer }
        - name: status
          in: query
          description: Filter by status. Multi-value supported.
          schema:
            type: string
            enum: [loaded, off_duty, planned, pending_hometime]
        - name: off_duty_reason
          in: query
          description: Filter off-duty and pending Home Time events by reason. Multi-value supported (`?off_duty_reason[]=Home Time&off_duty_reason[]=Breakdown`). Requires the `off_duty_reason` field grant. Stored values that older events carry and that the Planner no longer offers (`Off`, `Other`, `Unscheduled Off`, `Planned`, `Layover`, `Layover (Paid)`) are read-only and cannot be filtered.
          schema:
            type: string
            enum: ['10 Hour Reset', '34 Hour Reset', 'Home Time', 'Unapproved Off', 'Vacation', 'Medical', 'Bereavement', 'Breakdown', 'Weather', 'Paid Layover', 'Not Paid Layover']
        - name: start_date
          in: query
          description: Filter by start_date. Accepts range.
          schema: { type: string, format: date-time }
        - name: end_date
          in: query
          description: Filter by end_date. Accepts range.
          schema: { type: string, format: date-time }
        - name: created_at
          in: query
          description: Filter by created_at. Accepts range.
          schema: { type: string, format: date-time }
        - name: updated_at
          in: query
          description: Filter by updated_at. Accepts range.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AvailabilityEvent' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Availability Events]
      summary: Create an off duty event
      description: |
        Creates an off-duty event for one driver, as the Planner "Create off duty event" form does. The event is created as `off_duty` with no pending step, and it appears on the Planner board and in Capacity the same way. It sends no Home Time notification mail and does not accept `at_home`. The write is recorded as `<application name> - API` in `created_by`.

        Send each field under `availability_event`. A field the application holds no field grant for is ignored, so an application needs the field grant of each field it writes (`off_duty_reason`, `pto_type`, `layover_reason`, `off_duty_comment` and the `reset_location` fields). A `pto_type` sent without its field grant is refused with 422, not ignored. Any other key in the body, such as `status`, `is_reset`, `balance_adjustment`, `approved_by_id` or `pending_event_status`, is ignored.

        `start_date` and `end_date` are required ISO 8601 values with minute precision (seconds are dropped). A value with an offset is that instant. A value with no offset is the local time at the reset location. The reset location sets the time zone, as in the Planner; the account time zone applies when the zone cannot be found. A Vacation event with `pto_cash_out` and no reset location uses the account time zone.

        Reset location: send a saved Place (`reset_location_place_id`), or an address (`reset_location` as `City, ST`, `reset_location_lat`, `reset_location_lng` and optionally `reset_location_zip_code`), never both. The address is not geocoded. It is required for every reason except Vacation with `pto_cash_out`.

        Rules: `off_duty_reason` is one of the 11 Planner values. `pto_type` is `pto` or `pto_cash_out`, defaults to `pto` with Vacation, as the Planner form does, and is refused with any other reason. `layover_reason` is required with Paid Layover and Not Paid Layover and refused with any other reason. The same validations as the Planner apply: the end must not be before the start, a Home Time event may not exceed the account limit, and an event may not overlap a planned event or, for Vacation and Bereavement, another event of the same reason. The checks of a Planner user with the adjust-vacation-balance permission are skipped there; here they always run: the driver must be active for a Vacation event of a driver with PTO, and a Vacation event cannot cover a frozen week of a new wage account (422). A Vacation event over a locked legacy payroll saves, and its PTO pay is not added, the same as in the Planner. Medical, Bereavement and Unapproved Off enqueue the same off-duty notification mail as the Planner.
      operationId: createAvailabilityEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [availability_event]
              properties:
                availability_event:
                  type: object
                  required: [driver_id, start_date, end_date, off_duty_reason]
                  properties:
                    driver_id: { type: integer, description: Driver of the account., example: 8421 }
                    start_date: { type: string, format: date-time, example: "2026-10-12T08:00:00-05:00" }
                    end_date: { type: string, format: date-time, example: "2026-10-13T18:00:00-05:00" }
                    off_duty_reason:
                      type: string
                      description: "The stored value of the Planner list. The Planner label PTO/Vacation is stored as `Vacation`."
                      enum: ['10 Hour Reset', '34 Hour Reset', 'Home Time', 'Unapproved Off', 'Vacation', 'Medical', 'Bereavement', 'Breakdown', 'Weather', 'Paid Layover', 'Not Paid Layover']
                    pto_type:
                      type: string
                      enum: [pto, pto_cash_out]
                      description: Defaults to `pto` with `Vacation`. Refused with any other reason.
                    layover_reason:
                      type: string
                      description: Required with `Paid Layover` and `Not Paid Layover`, refused with any other reason. Stored exactly as listed, double space included.
                      enum: ['Closed facility', 'Dispatch related', 'Capacity related', 'Dwell time related', 'Contracted customer related', 'Long loading/unloading time', 'Trailer pool related', 'No load', 'Traffic related', 'TONU/Load Cancellation  related', 'Other']
                    off_duty_comment: { type: string }
                    reset_location: { type: string, description: "Address as `City, ST`. Send with the coordinates, or send a Place instead.", example: "Chicago, IL" }
                    reset_location_lat: { type: number, minimum: -90, maximum: 90, example: 41.8781 }
                    reset_location_lng: { type: number, minimum: -180, maximum: 180, example: -87.6298 }
                    reset_location_zip_code: { type: string, example: "60601" }
                    reset_location_place_id: { type: integer, description: "A saved Place of the account. The server fills the address, coordinates, zip code and Place name from it." }
      responses:
        '201':
          description: Event created. `data` holds the stored values.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AvailabilityEvent' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /availability_events/{id}:
