    LaneBid:
      type: object
      description: |
        A Sales lane bid: one lane of a customer bid with its three bid rounds, the pre-award and the award. Fields marked "grantable" require explicit grant from the Admin Panel; if not granted, they are omitted from the response.

        The money, rate and mile columns are decimal-precision strings. `stop_offs` is the count of extra stops, so the total stops are `stop_offs + 2`. A lane bid holds no address, time, customer object or note.

        `status` is the stored bid stage, not the validity state of `/award_lanes`. Join the two by `aggregated_sales_lane_bid_id` on `/award_lanes`, which is the `id` here.
      properties:
        id:                     { type: integer }
        customer_id:            { type: integer, description: "Customer FK. Resolve via GET /customers/{id}." }
        status:
          type: string
          enum: [initial, active, finalization, award]
          description: "Stored bid stage. `/award_lanes` `status` is a different, computed value."
        validity_date_from:     { type: string, format: date, description: "First day of the bid validity, inclusive." }
        validity_date_to:       { type: string, format: date, description: "Last day of the bid validity, inclusive." }
        bid_date:               { type: [ string, 'null' ], format: date }
        customer_lane_id:       { type: [ string, 'null' ], description: "The customer's own lane id." }
        customer_bid_id:        { type: [ string, 'null' ], description: "The customer's own bid id." }
        lane_name:              { type: [ string, 'null' ], description: "Contract Bid Name: the Lane Name of the bid upload." }
        pu_city:                { type: string }
        pu_state:               { type: string }
        pu_zip:                 { type: [ string, 'null' ] }
        pu_zip_range:           { type: [ string, 'null' ], description: "Pickup ZIP prefixes or ranges, for example `680-689` or `304/313/315-316`." }
        pu_market:              { type: [ string, 'null' ] }
        del_city:               { type: string }
        del_state:              { type: string }
        del_zip:                { type: [ string, 'null' ] }
        del_zip_range:          { type: [ string, 'null' ], description: "Delivery ZIP prefixes or ranges." }
        del_market:             { type: [ string, 'null' ] }
        move_type:              { type: [ string, 'null' ], enum: [point_to_point, point_to_zone, null] }
