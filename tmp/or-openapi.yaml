  /gps_logs:
    get:
      tags: [Gps Logs]
      summary: List truck or trailer GPS positions
      description: |
        Returns a paginated, sortable, filterable list of truck or trailer GPS positions from the telematics devices, one row per position report, scoped to the authenticated application's account.
        `vehicle_type` and `vehicle_id` are both required, because a truck and a trailer can share an id. One request covers any `created_at` span of up to 7 days, at any date, so an old load works: no bounds defaults to the last 7 days, one bound extends 7 days from it, and an explicit window wider than 7 days returns 400.
        The default order is newest first; pass `sort=created_at` for a trail in time order. To get the trail of a load from its first pickup, pass the pickup's `time_in` (from `GET /destinations?load_id=`) as `created_at[gte]` and the last delivery's `time_out` as `created_at[lte]`, with the `vehicle_id` of the truck on that load.
      operationId: listGpsLogs
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, id, '-created_at', '-id']
        - name: vehicle_type
          in: query
          required: true
          description: "`Truck` or `Trailer`."
          schema: { type: string, enum: [Truck, Trailer] }
        - name: vehicle_id
          in: query
          required: true
          description: Filter by truck or trailer id. Use `?vehicle_id[]=a&vehicle_id[]=b` for multiple values.
          schema: { type: integer }
        - name: created_at
          in: query
          description: Filter by insert time. Any span of up to 7 days, at any date. Use `?created_at[gte]=...&created_at[lte]=...`.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GpsLog' }
                  meta:
