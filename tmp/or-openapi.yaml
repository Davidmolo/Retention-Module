        voluntary_reason:  { type: [ array, 'null' ], items: { type: string }, description: "Grantable — requires field grant. Populated when reason_for_termination is voluntary_reason. Values: home_time, unsatisfied_with_pay, other_sector, unsatisfied_with_ops, change_of_career, expectations_not_met, recent_pip, transport_operations, recruiting, accounting_internal_operations, safety_rules, fleet_maintenance, family_reasons, family_emergency, health_related_reasons, approved_extended_absence, new_opportunities, misalignment_of_values_and_company_culture, personal_reasons, personal_documentation, job_abandonment, failure_to_undertake_post_role, retired, fleet_realignment, other, plus internal_transfer (the form also offers this reason for a terminated driver). Nothing validates the array, so a blank or a legacy value can appear." }
        involuntary_reason: { type: [ array, 'null' ], items: { type: string }, description: "Grantable — requires field grant. Populated when reason_for_termination is involuntary_reason. Values: poor_performance, safety, performance_and_safety, unreliability_excessive_tardiness, damage, unprofessional_behavior, other, chronic_absenteeism_or_tardiness, company_policy_violation, conduct_or_behavioral_problems_insubordination, deceased, failure_to_accurately_report_hours_of_service, failure_to_maintain_a_valid_medical_card, falsifying_company_documents, fleet_realignment, inability_to_meet_performance_expectations, job_abandonment, repeated_or_severe_at_fault_accident, suspension_or_revocation_of_driving_privileges, transferring_to_company_drivers, transferring_to_lease, transferring_to_oo, unauthorized_location_wo_notice, uninsurable_risk, plus internal_transfer (the form also offers this reason for a terminated driver). Nothing validates the array, so a blank or a legacy value can appear." }
