        both cases, read the statement again for a fresh link. Answers
        `404` for every other rejection (unknown, tampered, cross-account, a statement that is no longer
        locked, or a grant that has since been revoked).

        The link is not single-use. It serves every fetch until its expiry.
        Permission is re-checked on each fetch.

        Each download is limited: at most 2 downloads of the same document and 30 downloads of any
        document per application in one minute, shared with the other file links. A fetch over a limit
        answers `429 rate_limited` with `Retry-After: 60`. Fetch each file once and keep it.
      security: []
      responses:
        '200':
          description: The statement PDF.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `no-store`.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/LinkExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }
      parameters:
