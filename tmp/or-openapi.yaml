  /load_financials:
    get:
      tags: [Load Financials]
      summary: List load financials
      description: |
        Returns a paginated list of the money view of each load, scoped to the authenticated application's account. `id` is the load id.

        The identity fields are always returned. `linehaul_rate`, `fuel_surcharge`, `detention_sum`, `total`, `lumper_sum`, `storage_sum`, `misc_sum`, `deductions_sum`, the `additional_charges` list, the `driver_accessorials` list and the `carrier_pay` list are grantable; without the grant they are omitted.

        Each driver accessorial shows the payroll week it was paid in, through `settlement_status` and the week fields. `paid`: the accessorial is part of a locked payroll, and the week fields say which week. `excluded`: the accessorial was added after the load's payroll week was locked, so no payroll includes it. `pending`: the load's payroll week is not locked yet. For `excluded` and `pending` the week fields are `null`. Auto-created blank rows (no amount, no category, no note) are not returned.
      operationId: listLoadFinancials
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, updated_at, '-created_at', '-updated_at']
        - name: id
          in: query
          description: Filter by load id. Multi-value supported — `?id[]=1&id[]=2`.
          schema: { type: integer }
        - name: customer_id
          in: query
          description: Filter by customer. Multi-value supported.
          schema: { type: integer }
        - name: status
          in: query
          description: Filter by load status. Multi-value supported.
          schema:
            type: string
            enum: [booked, assigned, en_route_to_shipper, at_shipper, picked_up, delayed, en_route_to_consignee, at_consignee, delivered, delivered_pending, exported, missing_paperwork, billed_pending, billed, billed_pending_acc, closed, open_balance, canceled, tonu]
        - name: linehaul_rate
          in: query
          description: Filter by linehaul rate. Accepts exact match or range — `?linehaul_rate[gte]=1000`. Needs the `linehaul_rate` field grant.
          schema: { type: number }
        - name: fuel_surcharge
          in: query
          description: Filter by fuel surcharge. Accepts exact match or range. Needs the `fuel_surcharge` field grant.
          schema: { type: number }
        - name: detention_sum
          in: query
          description: Filter by detention. Accepts exact match or range — `?detention_sum[gt]=0` lists loads with detention. Needs the `detention_sum` field grant.
          schema: { type: number }
        - name: total
          in: query
          description: Filter by load total. Accepts exact match or range — `?total[gte]=1000&total[lt]=5000`. Needs the `total` field grant.
          schema: { type: number }
        - name: created_at
          in: query
          description: Filter by the load's created_at. Accepts range — `?created_at[gte]=2026-01-01`.
          schema: { type: string, format: date-time }
        - name: updated_at
          in: query
          description: Filter by the load's updated_at. Accepts range. An accessorial edit touches its load, so `updated_at[gte]` catches accessorial changes.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LoadFinancial' }
                  error:
                    type: 'null'
                    example: null
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /load_financials/{id}:
    get:
      tags: [Load Financials]
      summary: Retrieve the financials of one load
      operationId: getLoadFinancial
      parameters:
        - name: id
          in: path
          required: true
          description: The load id.
          schema: { type: integer }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LoadFinancial' }
                  error:
                    type: 'null'
                    example: null
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Load Financials]
      summary: Update the money columns and the additional charges of one load
      description: |
        Writes the seven money columns of a load and its Additional Charges. Every key of `load_financial` is optional, and a column the application has no field grant for is ignored. The load total is recomputed after the write: linehaul rate plus fuel surcharge plus detention, lumper, storage, misc and deductions. A `null` column saves 0.00. An amount that is not a number returns 422 with the field of the column.

        When the call changes the total and the customer has an Available Balance with the hard block on, a total over the limit returns 422 with field `customer_id`.

        `additional_charges` is the full list of the load. An item with an `id` updates that charge, an item without an `id` creates one, and a charge of the load whose id is not in the list is removed. A key that is omitted or null keeps the list, and `[]` removes every charge. A value that is not a list of objects, or an item without a `name` or with an `amount` that is not a number, returns 422 with field `additional_charges`, and the same rules on `carrier_pay` return 422 with field `carrier_pay` (a repeated `vendor_id`, a `vendor_id` that is not a carrier of the load, a charge without a `name` or with an `amount` that is not a number), and a missing or unknown `mapped_field` returns 422 with field `additional_charges.mapped_field`. An `id` that is not a charge of this load returns 404. The charges mapped to one column must add up to that column of the load, or the call returns 422 with field `additional_charges`.

        A load whose stored status is one of the account locked statuses returns 422 with field `status` and changes nothing. A load of another account returns 404.
      operationId: updateLoadFinancial
      parameters:
        - name: id
          in: path
          required: true
          description: The load id.
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [load_financial]
              properties:
                load_financial:
                  type: object
                  properties:
                    linehaul_rate:  { type: [ number, string, 'null' ], description: "Grantable. Linehaul rate. A number or a plain number string such as '1000.00'. Null saves 0.00." }
                    fuel_surcharge: { type: [ number, string, 'null' ], description: "Grantable. Fuel surcharge. Null saves 0.00." }
                    detention_sum:  { type: [ number, string, 'null' ], description: "Grantable. Detention. Null saves 0.00." }
                    lumper_sum:     { type: [ number, string, 'null' ], description: "Grantable. Lumper. Null saves 0.00." }
                    storage_sum:    { type: [ number, string, 'null' ], description: "Grantable. Storage. Null saves 0.00." }
                    misc_sum:       { type: [ number, string, 'null' ], description: "Grantable. Miscellaneous charges. Null saves 0.00." }
                    deductions_sum: { type: [ number, string, 'null' ], description: "Grantable. Deductions, zero or negative. Null saves 0.00." }
                    carrier_pay:
                      type: [ array, 'null' ]
                      description: "Grantable. Carrier Pay of a brokered load: one item per carrier of the load. The `charges` of a listed carrier replace its charges: an item with an `id` updates that charge, an item without an `id` creates one, and a charge not in the list is removed. A carrier that is not listed keeps its charges. The API cannot add or remove a carrier. Omitted or null keeps everything. The load Total never changes."
                      items:
                        type: object
                        required: [ vendor_id, charges ]
                        properties:
                          vendor_id: { type: integer, description: "A carrier of this load. Resolve via /vendors." }
                          charges:
                            type: array
                            description: "The full list of charges of this carrier. `[]` removes every charge."
                            items:
                              type: object
                              required: [ name, amount ]
                              properties:
                                id:          { type: integer, description: "A charge of this carrier. Without it the item creates a charge. A charge of another carrier returns 404." }
                                name:        { type: string }
                                amount:      { type: [ number, string ], description: "Dollars." }
                                description: { type: [ string, 'null' ] }
                    additional_charges:
                      type: [ array, 'null' ]
                      description: "Grantable. The full list of charges. Omitted or null keeps the list."
                      items:
                        type: object
                        required: [ name, amount, mapped_field ]
                        properties:
                          id:           { type: integer, description: "A charge of this load. Without it the item creates a charge." }
                          name:         { type: string }
                          amount:       { type: [ number, string ], description: "Dollars." }
                          mapped_field: { type: string, enum: [linehaul_rate, fuel_surcharge, lumper_sum, storage_sum, misc_sum, detention_sum, deductions_sum], description: "The load column the charge is part of." }
            example:
              load_financial:
                linehaul_rate: "1000.00"
                fuel_surcharge: "150.00"
                detention_sum: "50.00"
                lumper_sum: "25.00"
                storage_sum: "10.00"
                misc_sum: "15.00"
                deductions_sum: "-20.00"
                additional_charges:
                  - { id: 412, name: Fee A, amount: "10.00", mapped_field: misc_sum }
