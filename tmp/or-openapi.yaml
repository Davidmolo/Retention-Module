  /driver_earnings_summaries:
    get:
      tags: [Driver Earnings Summaries]
      summary: List driver earnings summaries
      description: |
        Returns one row per driver that has driver statistics this calendar year. Each row holds three windows, counted from today in the account time zone:

        | Window | From | To |
        |--------|------|----|
        | `weekly` | 7 days ago | yesterday |
        | `monthly` | 28 days ago | yesterday |
        | `annual` | 1 January | yesterday |

        `<window>_earnings` is the sum of the settlement of the statements whose `period_end` falls in the window, locked or not. `<window>_paid_miles` is the sum of the `total_miles` of the driver statistics whose `end_date` falls in the window, the figure the driver app shows. Amounts and miles are decimal strings. The `<window>_earnings` fields are grantable.
      operationId: listDriverEarningsSummaries
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: id
          in: query
