  /loads/{id}:
    get:
      tags: [Loads]
      summary: Retrieve a load
      description: Returns a single load with its destinations.
      operationId: getLoad
      parameters:
        - name: id
          in: path
          required: true
          description: Load ID
          schema: { type: integer }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Load' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Loads]
      summary: Update the status, weight or commodity of a load
      description: |
        Writes one of three status families and, with any status outside the five billing statuses, the weight and the commodity. Every key of `load` is optional.

        **Tracking statuses.** `en_route_to_shipper`, `at_shipper`, `picked_up`, `en_route_to_consignee`, `at_consignee` and `delivered`. The load takes the same save path as the OpenRoad interface: the status dates are stamped (`delivered` sets the delivered date), and EDI 214 status updates, SPS jobs and the customer load status notification email follow the account and customer settings. A move in either direction is accepted, for example `delivered` back to `at_consignee`. An account can turn off the customer status email, the EDI 214, the FourKites update and the detention automation for status writes through the API, in Settings, Account Sync. The statuses `missing_paperwork` (Missing Paperwork), `booked`, `assigned`, `delayed`, `delivered_pending` (Delivered - Pending), `exported`, `canceled` and `tonu` are written on the same path, so a load at `delivered` can move to them and back. `booked` and `assigned` store the status only. `delayed` stores the status and queues the SPS 214 update when the customer subscribes to `delayed`, unless the account turns off the EDI 214 for status writes through the API. `delivered_pending` stores the status and follows the EDI 214 settings like the other statuses. `exported` changes the label only, as the status modal does: no export runs. `canceled` removes the drivers from the stops and removes the trailer from the load and its trailer locations. `tonu` keeps the first stop, adds a delivery copy of the last stop, sets the load miles, the rate per mile, and the miles and driver linehaul of each stop to zero and sets the linehaul rate to 150 unless the load already changed it, and it removes the trailer. `tonu` keeps the drivers. A status write on a load at a locked status returns 422 for these statuses too. `weight` and `commodity` go through the same validation as in the interface. A weight of 40,000 lbs or more marks the scale as required, and a weight above the account maximum returns 422 with field `weight`, except on an EDI load. When the account requires Time In and Time Out on delivered loads, `delivered` needs both on every stop, or the call returns 422.

        A load whose stored status is one of the account locked statuses (Settings, Load, Locked Statuses; by default `exported`, `billed`, `billed_pending`, `billed_pending_acc` and `closed`) returns 422 with field `status` and changes nothing, even when the call sends the status the load already holds, `exported` included.

        **Pending to Bill, Billed-Pending Accessorials, Billed, Paid and Open Balance.** `billed_pending`, `billed_pending_acc`, `billed`, `closed` and `open_balance`. In the OpenRoad interface `billed_pending` shows as "Pending to Bill", `billed_pending_acc` shows as "Billed-Pending Accessorials", `billed` shows as "Billed", `closed` shows as "Paid" and `open_balance` shows as "Open Balance". A call with one of these five statuses needs the `load_billing_statuses#update` endpoint grant of the application, and without it returns 403. `billed_pending` is accepted only from `delivered`, `delivered_pending`, `missing_paperwork` or `billed_pending`. `billed_pending_acc` is accepted only from `billed_pending` or `billed_pending_acc`. `billed` is accepted only from `exported` or `billed`. `closed` is accepted only from `billed`, `billed_pending`, `billed_pending_acc`, `exported` or `open_balance`. `open_balance` is accepted only from `billed`, `open_balance` or `exported`. Any other source status returns 422. This path does not check the locked statuses, and it ignores `weight` and `commodity`.

        Sending the status the load already holds returns 200 and changes no status, unless the load holds a locked status on the tracking path, which returns 422. A `charges_breakdown` sent with the same billing status is still saved.

        `charges_breakdown` is optional and needs the `charges_breakdown` field grant on loads; without the grant it is ignored. It is accepted only together with `billed_pending`, `billed_pending_acc`, `billed`, `closed` or `open_balance`: a call with `charges_breakdown` and no status, or with a tracking status, returns 422. It is saved apart from the load: the load Linehaul Rate, Fuel Surcharge, Storage, Detention, Lumper, Misc, Deductions, Additional Charges and Total never change. Each call that carries it replaces the saved breakdown whole. A call without it, or with null, keeps the saved one. An amount that is not a number, a `linehaul_rate`, `fuel_surcharge`, `storage_sum`, `detention_sum`, `lumper_sum`, `misc_sum` or `deductions_sum` outside -9999999.99 to 9999999.99, a positive `deductions_sum`, or a total below zero or above 9999999.99, returns 422 with the field `linehaul_rate`, `fuel_surcharge`, `storage_sum`, `detention_sum`, `lumper_sum`, `misc_sum`, `deductions_sum`, `additional_charges` or `total`, and saves nothing. The total is linehaul rate plus fuel surcharge plus storage, detention, lumper, misc and deductions plus every additional charge. Deductions are zero or negative and lower the total. A single additional charge can be negative for a credit, as long as the total is zero or more. With the account setting "Use the Charges Breakdown for Open Balance Loads" on, a load at `open_balance` counts the breakdown total in the customer Open Balance, and so in the Available Balance. An account with Sage, QuickBooks or Apex takes its Open Balance from that integration and is not affected.

        A status outside the nineteen returns 422 with field `status`.
      operationId: updateLoad
      parameters:
        - name: id
          in: path
          required: true
          description: Load ID
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [load]
              properties:
                load:
                  type: object
                  properties:
                    status:
                      type: string
                      enum: [booked, assigned, en_route_to_shipper, at_shipper, picked_up, delayed, en_route_to_consignee, at_consignee, delivered, delivered_pending, exported, missing_paperwork, canceled, tonu, billed_pending, billed_pending_acc, billed, closed, open_balance]
                      description: "Tracking status, Booked (booked), Assigned (assigned), Delayed (delayed), Delivered - Pending (delivered_pending), Exported (exported, label only), Canceled (canceled), TONU (tonu), Missing Paperwork (missing_paperwork), Pending to Bill (billed_pending, accepted from delivered, delivered_pending, missing_paperwork or billed_pending), Billed-Pending Accessorials (billed_pending_acc, accepted from billed_pending or billed_pending_acc), Billed (billed, accepted from exported or billed) or Paid (closed, accepted from billed, billed_pending, billed_pending_acc, exported or open_balance) or Open Balance (open_balance, accepted from billed, open_balance or exported)."
                    weight:
                      type: [ string, 'null' ]
                      description: "Freight weight in lbs, free text such as '42000'. Written with any status outside the five billing statuses, or with no status. Ignored with billed_pending, billed_pending_acc, billed, closed or open_balance."
                    commodity:
                      type: [ string, 'null' ]
                      description: "Commodity, up to 255 characters. Written with any status outside the five billing statuses, or with no status. Ignored with billed_pending, billed_pending_acc, billed, closed or open_balance."
                    charges_breakdown:
                      type: [ object, 'null' ]
                      description: "Optional. Needs the charges_breakdown field grant on loads. Sent only with billed_pending, billed_pending_acc, billed, closed or open_balance. Replaces the saved breakdown whole. Null keeps the saved breakdown. The total (linehaul_rate + fuel_surcharge + storage_sum + detention_sum + lumper_sum + misc_sum + deductions_sum + every additional charge amount) must be zero or more and below 10000000, or the call returns 422 with field total."
                      properties:
                        linehaul_rate:  { type: [ number, string, 'null' ], description: "Linehaul rate. A number from -9999999.99 to 9999999.99, rounded to 2 decimals; a string holds a plain number such as '1500.00'. Null or omitted saves 0." }
                        fuel_surcharge: { type: [ number, string, 'null' ], description: "Fuel surcharge. A number from -9999999.99 to 9999999.99, rounded to 2 decimals; a string holds a plain number such as '1500.00'. Null or omitted saves 0." }
                        storage_sum:    { type: [ number, string, 'null' ], description: "Storage. A number from -9999999.99 to 9999999.99, rounded to 2 decimals; a string holds a plain number such as '1500.00'. Null or omitted saves 0." }
                        detention_sum:  { type: [ number, string, 'null' ], description: "Detention. A number from -9999999.99 to 9999999.99, rounded to 2 decimals; a string holds a plain number such as '1500.00'. Null or omitted saves 0." }
                        lumper_sum:     { type: [ number, string, 'null' ], description: "Lumper. A number from -9999999.99 to 9999999.99, rounded to 2 decimals; a string holds a plain number such as '1500.00'. Null or omitted saves 0." }
                        misc_sum:       { type: [ number, string, 'null' ], description: "Miscellaneous charges. A number from -9999999.99 to 9999999.99, rounded to 2 decimals; a string holds a plain number such as '1500.00'. Null or omitted saves 0." }
                        deductions_sum: { type: [ number, string, 'null' ], description: "Deductions. Zero or a negative number from -9999999.99 to 0, rounded to 2 decimals; a positive number returns 422 with field deductions_sum. A string holds a plain number such as '-50.00'. Null or omitted saves 0." }
                        additional_charges:
                          type: array
                          description: "Omitted saves an empty list."
                          items:
                            type: object
                            required: [ amount ]
                            properties:
                              name:   { type: string, description: "Free text, e.g. Tolls. Optional." }
                              amount: { type: [ number, string ], description: "Required. A number, negative allowed for a credit, rounded to 2 decimals. A string holds a plain number: no currency sign, no thousands separator." }
            examples:
              tracking:
                summary: Tracking status with weight and commodity
                value:
                  load:
                    status: at_consignee
                    weight: "42000"
                    commodity: Steel coils
              paid:
                summary: Open Balance with a charges breakdown
                value:
                  load:
                    status: open_balance
                    charges_breakdown:
                      linehaul_rate: 1500.00
                      fuel_surcharge: 210.50
                      storage_sum: 40.00
                      detention_sum: 100.25
                      lumper_sum: 75.00
                      misc_sum: 20.00
                      deductions_sum: -50.50
                      additional_charges:
                        - { name: Tolls, amount: 12.00 }
      responses:
        '200':
          description: Load updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Load' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

