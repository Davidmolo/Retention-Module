  /drivers/{driver_id}/change_logs:
    get:
      tags: [Driver Change Logs]
      summary: List the change history of a driver
      description: |
        Returns a paginated list of changes to the driver profile, and to the documents and notes attached to it, newest first. Scoped to the authenticated application's account.

        A change entry carries only the fields your application can already read on the resource that owns them. A field that no grant reaches, for example `passport_no`, never appears, whatever its record type. `soc_sec_no` appears on a `Driver` entry only with the `soc_sec_no` field grant on drivers, and then carries the old and the new SSN.
      operationId: listDriverChangeLogs
      parameters:
        - name: driver_id
          in: path
          required: true
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: sort
          in: query
          description: Sort field. Prefix with `-` for descending.
          schema:
            type: string
            enum: [created_at, '-created_at']
        - name: record_type
          in: query
          description: Filter by the audited record's type. Multi-value supported — `?record_type[]=Driver&record_type[]=Note`. `DriverEmploymentEvent` returns only the Hire, Termination and Rehire entries.
          schema:
            type: string
            enum: [Driver, Upload, Note, DriverEmploymentEvent]
        - name: action
          in: query
          description: Filter by the change kind. Multi-value supported.
          schema:
            type: string
            enum: [create, update, destroy]
        - name: created_at
          in: query
          description: Filter by when the change was made. Accepts range — `?created_at[gte]=2026-09-01T00:00:00Z`. It filters the change time, not the `event_date` of an employment event.
          schema: { type: string, format: date-time }
        - name: field
          in: query
          description: Return only the named field's change. The name must be one your application can already read on the resource that owns it — otherwise the request returns 400 `invalid_filter`.
          schema: { type: string }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriverChangeLog' }
                  error:
                    type: 'null'
                    example: null
                    description: Always null on successful responses (see error responses for failure shape).
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

