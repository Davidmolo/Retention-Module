      description: |
        Returns the estimated gross profit of one load, the figure the Load view shows: the sum of the calculable drivers of the load. `gross_profit` is grantable, and is a decimal string rounded to cents. It is null when the account is not a GP Transco account, when the load has no driver, or when the Load view shows "Can't calculate" for every driver, for example a driver on Percentage pay.
