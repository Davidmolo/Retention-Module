        region_codes:      { type: array, items: { type: string }, description: "Grantable — requires field grant. Sorted codes of the primary regions of the driver, from the driver region assignments with type primary. Blocked regions are not listed. An empty list when the driver has no primary region. Resolve via /regions." }
