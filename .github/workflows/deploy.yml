name: Deploy

# Push to main (or master) → build images → deploy to AWS EC2 → live.
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  IMAGE: ghcr.io/davidmolo/retention-module
  SERVER_DIR: /opt/retention-module

jobs:
  build-and-push:
    name: Build & push images
    concurrency:
      group: deploy-build
      cancel-in-progress: true

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    environment: production

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & push runtime image
        run: |
          docker build \
            --target runtime \
            --build-arg NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }} \
            --build-arg NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }} \
            -t $IMAGE:latest \
            -t $IMAGE:${{ steps.meta.outputs.tag }} \
            .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ steps.meta.outputs.tag }}

      - name: Build & push migrator image
        run: |
          docker build --target migrator \
            -t $IMAGE:migrator-latest \
            -t $IMAGE:migrator-${{ steps.meta.outputs.tag }} \
            .
          docker push $IMAGE:migrator-latest
          docker push $IMAGE:migrator-${{ steps.meta.outputs.tag }}

  deploy:
    name: Deploy to AWS
    needs: build-and-push

    concurrency:
      group: production-deploy-server
      cancel-in-progress: false

    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SERVER_IP }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ env.SERVER_DIR }}"

            # Prefer a long-lived GHCR pull token on the server; fall back to job token.
            if [ -n "${{ secrets.GHCR_PULL_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_PULL_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            else
              echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi

            sudo docker compose pull
            sudo docker compose up -d --remove-orphans

            echo "Deployed ${{ needs.build-and-push.outputs.image_tag }}"
            sudo docker compose ps
