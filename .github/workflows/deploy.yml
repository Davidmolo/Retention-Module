name: Deploy

# Push to main → verify → rsync → build/migrate/PM2 on EC2 (same pattern as fuel-optimizer).
# Does not touch fuel-staging, fuel-optimizer, or trailhead processes.
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-retention-production
  cancel-in-progress: false

env:
  APP_DIR: /var/www/retention-module

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install & typecheck
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit || true

  deploy:
    name: Deploy to AWS
    needs: verify
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Uses repository Actions secrets (Settings → Secrets and variables → Actions).
    # No Environment required — avoids Environments admin page.
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust host
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync source to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${DEPLOY_USER:-ubuntu}"
          ssh "$USER_NAME@$DEPLOY_HOST" "sudo mkdir -p '$APP_DIR' && sudo chown ubuntu:ubuntu '$APP_DIR'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.production' \
            --exclude '.env*.local' \
            --exclude '_migrate_*.txt' \
            --exclude '_prd_extract_tmp.txt' \
            --exclude 'data/sftp-incoming/' \
            --exclude 'data/generated/' \
            ./ "$USER_NAME@$DEPLOY_HOST:$APP_DIR/"

      - name: Build and reload on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 45m
          script: |
            set -euo pipefail
            cd /var/www/retention-module
            chmod +x deploy/remote-deploy.sh deploy/first-setup.sh
            bash deploy/remote-deploy.sh
