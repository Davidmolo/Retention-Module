# HTTP/HTTPS vhost for https://v2.goxxii.com/
# Does NOT touch fuel-staging, fueloptimiser, or trailhead.
# App listens on 127.0.0.1:3000 (PM2: retention-module-web).
# After DNS A record points here:
#   sudo certbot --nginx -d v2.goxxii.com

upstream retention_module_web {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name v2.goxxii.com;

    location / {
        proxy_pass http://retention_module_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
