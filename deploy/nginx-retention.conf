# HTTPS vhost for https://v2.goxxii.com/
# Does NOT touch fuel-staging, fueloptimiser, or trailhead.
# App listens on 127.0.0.1:3000 (PM2: retention-module-web).
#
# Requires Let's Encrypt certs (one-time):
#   sudo certbot certonly --nginx -d v2.goxxii.com
# Paths below must exist before `nginx -t`.

upstream retention_module_web {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name v2.goxxii.com;

    ssl_certificate /etc/letsencrypt/live/v2.goxxii.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v2.goxxii.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://retention_module_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name v2.goxxii.com;
    return 301 https://$host$request_uri;
}
